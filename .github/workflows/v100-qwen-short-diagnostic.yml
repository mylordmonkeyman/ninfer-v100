name: V100 Qwen Short Prompt Diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
# Prioritize the accuracy blocker over further peer-model qualification.
concurrency:
  group: v100-qwen-model-matrix
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: [self-hosted, v100, sm70, cuda-12-8, ninfer-phase11]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive
          persist-credentials: false
          clean: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: geoffwatts/ninfer-v100
          ref: b37d0dd3e1163b9d802d8bccfa89918bf68d793e
          path: baseline
          submodules: recursive
          persist-credentials: false
          clean: false
      - name: Apply the isolated split-K correction to the original reference
        run: |
          set -euo pipefail
          git -C baseline apply --check "$PWD/tools/validation/v100_ordered_splitk_reference.patch"
          git -C baseline apply "$PWD/tools/validation/v100_ordered_splitk_reference.patch"
      - name: Instrument actual model contractions with an independent FP64 oracle
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          header = Path('tools/validation/v100_real_splitk_oracle.h').resolve()
          for root in (Path('.'), Path('baseline')):
              for quant in ('q4', 'q5'):
                  path = root / f'src/ops/linear/{quant}/{quant}_volta_mma_gemm.cu'
                  source = path.read_text()
                  source = f'#include "{header}"\n' + source
                  anchor = '    auto scope           = ws.scope();'
                  args = 'false, false' if quant == 'q4' else 'true, add_residual'
                  capture = f'    ninfer::validation::RealSplitKOracle oracle(x, w, out, {args}, weight_row_offset, stream);\n'
                  if source.count(anchor) != 1:
                      raise RuntimeError(f'Unexpected launch body: {path}')
                  source = source.replace(anchor, capture + anchor)
                  anchor = '    CUDA_CHECK(cudaGetLastError());\n}\n'
                  if source.count(anchor) != 1:
                      raise RuntimeError(f'Unexpected launch end: {path}')
                  source = source.replace(anchor, '    CUDA_CHECK(cudaGetLastError());\n    oracle.finish();\n}\n')
                  path.write_text(source)
          PYTHON
      - name: Build identical short-prompt probes
        run: |
          set -euo pipefail
          rm -rf -- short-results
          mkdir -p short-results
          cp tools/validation/v100_qwen_short_probe.cpp baseline/tools/v100_qwen_short_probe.cpp
          for label in candidate baseline; do
            source=.
            build=../build-27b
            probe=tools/validation/v100_qwen_short_probe.cpp
            media=ON
            if [[ "$label" == baseline ]]; then source=baseline; build=../build-27b-baseline; probe=tools/v100_qwen_short_probe.cpp; media=OFF; fi
            cat >> "$source/CMakeLists.txt" <<CMAKE
          add_executable(ninfer_v100_qwen_short_probe $probe)
          target_include_directories(ninfer_v100_qwen_short_probe PRIVATE \${PROJECT_SOURCE_DIR}/include)
          target_link_libraries(ninfer_v100_qwen_short_probe PRIVATE ninfer_engine)
          CMAKE
            cmake -S "$source" -B "$build" -G Ninja -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_CUDA_COMPILER=/usr/local/cuda-12.8/bin/nvcc -DCMAKE_CUDA_ARCHITECTURES=70 \
              -DNINFER_BUILD_MEDIA="$media" -DNINFER_BUILD_APPS=OFF -DNINFER_BUILD_BENCHMARKS=ON -DBUILD_TESTING=ON
            cmake --build "$build" -j --target ninfer_v100_qwen_short_probe 2>&1 | tee "short-results/$label-build.log"
          done
      - name: Verify model accuracy and repeated request sequences
        run: |
          set -euo pipefail
          cp tools/validation/v100_ordered_splitk_reference.patch short-results/reference-correction.patch
          for label in candidate baseline; do
            build=../build-27b
            if [[ "$label" == baseline ]]; then build=../build-27b-baseline; fi
            for filename in qwen3_6_27b.ninfer qwen3_6_27b_nvfp4.ninfer; do
              "$build/ninfer_v100_qwen_short_probe" \
                "../v100-qualification-models/v2/$filename" bench/fixtures/bench_corpus.ids int8 64 qualification-sequence \
                2>&1 | tee "short-results/$label-$filename-sequence.log"
            done
          done
          python3 - <<'PYTHON'
          from pathlib import Path
          for filename in ('qwen3_6_27b.ninfer', 'qwen3_6_27b_nvfp4.ninfer'):
              exports = {}
              for label in ('candidate', 'baseline'):
                  rows = {}
                  for line in Path(f'short-results/{label}-{filename}-sequence.log').read_text().splitlines():
                      if line.startswith('ROUND '):
                          fields = line.split()
                          rows[int(fields[1]), int(fields[3])] = fields[4:]
                  if len(rows) != 12 or any(len(tokens) != 64 for tokens in rows.values()):
                      raise RuntimeError(f'{label} {filename}: incomplete output')
                  for scenario in range(4):
                      stable = all(rows[round, scenario] == rows[0, scenario] for round in (1, 2))
                      print(f'{label} {filename} scenario={scenario} repeatable={stable}')
                      if not stable:
                          raise RuntimeError('Repeated request sequence is unstable')
                  exports[label] = rows
              if exports['candidate'] != exports['baseline']:
                  raise RuntimeError(f'{filename}: corrected-reference token disagreement')
              print(f'PASS {filename}: exact corrected-reference sequence parity')
          PYTHON
      - name: Preserve diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v100-qwen-short-diagnostic
          path: short-results
          retention-days: 30

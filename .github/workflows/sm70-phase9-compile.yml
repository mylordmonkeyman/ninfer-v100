name: SM70 Phase 9 Compile

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - forwardport/v100-flash-next-phase9
  workflow_dispatch:

jobs:
  compile-phase9:
    runs-on: ubuntu-24.04
    container:
      image: nvidia/cuda:12.8.1-devel-ubuntu24.04
    timeout-minutes: 45

    steps:
      - name: Install build tools
        shell: bash
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git \
            ca-certificates \
            python3 \
            python3-pip \
            pkg-config
          python3 -m pip install --break-system-packages 'cmake>=3.28,<4' ninja

      - uses: actions/checkout@v4

      - name: Isolate unrelated Ampere-only kernels
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          cmake = Path('src/CMakeLists.txt')
          text = cmake.read_text()

          excluded = {
              'ops/context_kv_materialize/materialize.cu',
              'ops/candidate_selector/bf16/candidate_selector_path.cu',
          }
          for source in Path('src').rglob('*.cu'):
              if 'w8_small_t_mma.cuh' in source.read_text(errors='ignore'):
                  excluded.add(source.relative_to('src').as_posix())

          lines = text.splitlines(keepends=True)
          text = ''.join(
              line for line in lines
              if not any(source in line for source in excluded)
          )
          cmake.write_text(text)
          print('Excluded SM80+ sources from the Phase 9 SM70 compile graph:')
          for source in sorted(excluded):
              print(f'  {source}')
          PY

      - name: Configure CUDA 12.8 SM70
        shell: bash
        run: |
          cmake -S . -B build-sm70 -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CUDA_ARCHITECTURES=70 \
            -DNINFER_BUILD_MEDIA=OFF \
            -DNINFER_BUILD_APPS=OFF \
            -DNINFER_BUILD_BENCHMARKS=OFF \
            -DBUILD_TESTING=ON

      - name: Build Phase 9 MoE targets
        shell: bash
        run: |
          ninja -C build-sm70 -j2 -k 0 \
            ninfer_qwen3_8_flash_next_moe_route_test \
            ninfer_qwen3_8_flash_next_moe_test

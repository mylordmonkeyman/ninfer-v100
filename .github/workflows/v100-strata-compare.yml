name: V100 Structural Engine Comparison
# Step 5: qualify software FP8 KV, then actual 128K/near-262K prompts.
on:
  workflow_dispatch:
  push:
    branches: [perf/v100-strata-derived]
    paths: ['.github/workflows/v100-strata-compare.yml']
permissions:
  contents: read
  actions: read
env:
  CMAKE_BUILD_PARALLEL_LEVEL: 32
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Validate structural harness before reserving V100
        run: |
          python3 -m compileall -q tools/telemetry
          python3 -m unittest discover -s tools/telemetry -p 'test_*.py'
          python3 tools/telemetry/structural_v100.py --help
          git diff --check
  hardware:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[v100:structural-compare]')) }}
    needs: checks
    runs-on: [self-hosted, v100, sm70, cuda-12-8, ninfer-phase11]
    concurrency:
      group: v100-sv0-hardware
      cancel-in-progress: false
    timeout-minutes: 180
    env:
      CUDA_VISIBLE_DEVICES: '0'
      NINFER_WEIGHTS: /models/qwen3-8b-flash-next
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          clean: false
      - name: Freeze environment and check existing assets
        shell: bash
        run: |
          set -euo pipefail
          results="$GITHUB_WORKSPACE/structural-comparison-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir "$results"
          echo "QUALIFICATION_RESULTS=$results" >> "$GITHUB_ENV"
          free_mib=$(nvidia-smi --id=0 --query-gpu=memory.free --format=csv,noheader,nounits | tr -d '[:space:]')
          if (( free_mib < 28000 )); then
            echo "::error::V100 is occupied ($free_mib MiB free); no unrelated process was stopped."
            exit 1
          fi
          test -r "$NINFER_WEIGHTS"
          # The resident model lacks a .ninfer suffix. Keep the alias OUTSIDE
          # the uploaded results directory: upload-artifact dereferences symlinks
          # and otherwise uploads the entire 113 GB model.
          alias_path="$RUNNER_TEMP/qualified-model-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.ninfer"
          ln -s -- "$NINFER_WEIGHTS" "$alias_path"
          test -r "$alias_path"
          printf 'Source: %s\nAlias: %s\n' "$NINFER_WEIGHTS" "$alias_path" > "$results/ninfer-artifact-alias.txt"
          test -x /opt/ai/strata/engine/strata
          sha256sum /opt/ai/strata/engine/strata > "$results/installed-strata-binary.sha256"
          test -x /opt/ai/strata/.venv/bin/python
          test -r /opt/ai/strata/strata-unsloth-ud-q4_k_xl.json
          installed_sha=$(git -c safe.directory=/opt/ai/strata -C /opt/ai/strata rev-parse HEAD)
          test "$installed_sha" = ad5206fba4914b4ab0ffb5e1d17bae4cd77ba778
          git rev-parse HEAD > "$results/ninfer-sha.txt"
          echo "$installed_sha" > "$results/installed-strata-sha.txt"
          cp /opt/ai/strata/strata-unsloth-ud-q4_k_xl.json "$results/installed-strata-config.json"
          sha256sum /opt/ai/strata/strata-unsloth-ud-q4_k_xl.json > "$results/installed-strata-config.sha256"
          stat "$NINFER_WEIGHTS" > "$results/ninfer-model-stat.txt"
          nvidia-smi -q > "$results/gpu.txt"
          numactl --hardware > "$results/numa.txt"
          lscpu > "$results/cpu.txt"
          /usr/local/cuda-12.8/bin/nvcc --version > "$results/cuda.txt"
          nvidia-smi --id=0 --query-gpu=uuid --format=csv,noheader | tr -d '[:space:]' > "$results/gpu-uuid.txt"
      - name: Download validated resident profile
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: v100-sv2-37270512213-1
          run-id: 37270512213
          github-token: ${{ github.token }}
          path: structural-profile-source
      - name: Step 5 qualify FP8 KV and retained performance routes
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build-structural-comparison -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CUDA_COMPILER=/usr/local/cuda-12.8/bin/nvcc -DCMAKE_CUDA_ARCHITECTURES=70 \
            -DNINFER_BUILD_MEDIA=OFF -DNINFER_BUILD_APPS=ON -DNINFER_BUILD_BENCHMARKS=OFF -DBUILD_TESTING=ON
          cmake --build build-structural-comparison --target ninfer-serve ninfer_volta_nvfp4_codec_test ninfer_volta_qsa_scores_test ninfer_qwen3_8_flash_next_qsa_attention_test ninfer_fp8_f32_prefill_sm70_test ninfer_qwen3_8_flash_next_expert_gemm_test ninfer_qwen3_8_flash_next_expert_stream_test ninfer_qwen3_8_flash_next_expert_cache_test
          build-structural-comparison/tests/ninfer_volta_nvfp4_codec_test 2>&1 \
            | tee "$QUALIFICATION_RESULTS/software-fp8-codec-oracle.log"
          build-structural-comparison/tests/ninfer_volta_qsa_scores_test 2>&1 \
            | tee "$QUALIFICATION_RESULTS/qsa-fp64-attention-oracle.log"
          build-structural-comparison/tests/ninfer_qwen3_8_flash_next_qsa_attention_test 2>&1 \
            | tee "$QUALIFICATION_RESULTS/qsa-fp8-append-integration.log"
          build-structural-comparison/tests/ninfer_fp8_f32_prefill_sm70_test 2>&1 \
            | tee "$QUALIFICATION_RESULTS/dense-public-dispatch-oracle.log"
          NINFER_V100_EXPERT_PAIR_EXPAND=0 \
            build-structural-comparison/tests/ninfer_qwen3_8_flash_next_expert_gemm_test 2>&1 \
            | tee "$QUALIFICATION_RESULTS/expert-scalar-oracle-and-cost.log"
          NINFER_V100_EXPERT_PAIR_EXPAND=1 \
            build-structural-comparison/tests/ninfer_qwen3_8_flash_next_expert_gemm_test 2>&1 \
            | tee "$QUALIFICATION_RESULTS/expert-pair-oracle-parity-and-cost.log"
          NINFER_V100_PREFILL_EXPERT_GEMM=fp16 NINFER_V100_PREFILL_RESIDENT_GEMM=1 \
            NINFER_V100_PREFILL_CPU_STREAM_OVERLAP=1 NINFER_V100_EXPERT_PAIR_EXPAND=1 \
            build-structural-comparison/tests/ninfer_qwen3_8_flash_next_expert_stream_test 2>&1 \
            | tee "$QUALIFICATION_RESULTS/stream-lifetime-and-ownership.log"
          python3 - <<'PY_CHECK'
          import json, os, pathlib
          rows=[json.loads(l) for l in (pathlib.Path(os.environ['QUALIFICATION_RESULTS'])/'stream-lifetime-and-ownership.log').read_text().splitlines() if l.startswith('{')]
          rows=[r for r in rows if r.get('kind')=='expert_stream_timing' and r.get('context',{}).get('executor')==991]
          owners={(r['context']['phase'],r['context']['transaction']):r for r in rows}
          assert len(rows)==2 and set(owners)=={('prefill',991991),('verify',991992)}, owners
          p=owners[('prefill',991991)]; v=owners[('verify',991992)]
          assert (p['experts'],p['routes'],p['gemm_experts'],p['gemm_routes'])==(5,160,5,160), p
          assert (v['experts'],v['routes'],v['gemm_experts'],v['gemm_routes'])==(1,7,0,0), v
          assert p['route_buckets']==[0,5,0,0,0,0] and v['route_buckets']==[1,0,0,0,0,0]
          print('Submission ownership survives multi-wrap collection and finish in verification')
          PY_CHECK
          NINFER_V100_PREFILL_EXPERT_GEMM=fp16 NINFER_V100_PREFILL_RESIDENT_GEMM=1 \
            NINFER_V100_PREFILL_CPU_STREAM_OVERLAP=1 NINFER_V100_EXPERT_PAIR_EXPAND=1 \
            build-structural-comparison/tests/ninfer_qwen3_8_flash_next_expert_cache_test 2>&1 \
            | tee "$QUALIFICATION_RESULTS/cache-join-oracle.log"
          cp build-structural-comparison/CMakeCache.txt "$QUALIFICATION_RESULTS/ninfer-CMakeCache.txt"
      - name: Step 5 actual FP8 KV long-context requests
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/telemetry/structural_v100.py --fp8-long-context \
            --ninfer build-structural-comparison/apps/ninfer-serve \
            --artifact "$RUNNER_TEMP/qualified-model-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.ninfer" \
            --profile structural-profile-source/sv2-static-profile.json \
            --strata-python /opt/ai/strata/.venv/bin/python \
            --strata-server /opt/ai/strata/serve/server.py \
            --strata-config /opt/ai/strata/strata-unsloth-ud-q4_k_xl.json \
            --strata-binary /opt/ai/strata/engine/strata \
            --gpu-uuid "$(cat "$QUALIFICATION_RESULTS/gpu-uuid.txt")" \
            --output "$QUALIFICATION_RESULTS/matrix" \
            | tee "$QUALIFICATION_RESULTS/matrix-summary.log"
          cat "$QUALIFICATION_RESULTS/matrix-summary.log" >> "$GITHUB_STEP_SUMMARY"
      - name: Compress completed or partial native logs
        if: always()
        shell: bash
        run: |
          folder="$GITHUB_WORKSPACE/structural-comparison-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if [[ -d "$folder" ]]; then
            find "$folder" -type f -name '*.log' -print0 | xargs -0 -r gzip -1
          fi
      - name: Guard uploaded evidence against large files and symlinks
        id: upload_guard
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          folder="$GITHUB_WORKSPACE/structural-comparison-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if [[ ! -d "$folder" ]]; then
            echo "safe=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No evidence directory was created."
            exit 0
          fi
          # Symlinks are never needed in a diagnostic artifact; never dereference a model.
          find "$folder" -type l -print -delete
          bytes="$(du -sb -- "$folder" | cut -f1)"
          echo "Diagnostic artifact source size: ${bytes} bytes"
          if (( bytes >= 1073741824 )); then
            echo "safe=false" >> "$GITHUB_OUTPUT"
            echo "::error::Diagnostic bundle exceeds the 1 GiB safety limit; refusing upload."
            exit 0
          fi
          echo "safe=true" >> "$GITHUB_OUTPUT"
      - name: Preserve all evidence including partial failures
        if: ${{ always() && steps.upload_guard.outputs.safe == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v100-structural-comparison-${{ github.run_id }}-${{ github.run_attempt }}
          path: structural-comparison-${{ github.run_id }}-${{ github.run_attempt }}/
          retention-days: 30
          if-no-files-found: warn

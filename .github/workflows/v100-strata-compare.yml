name: V100 Telemetry First Hardware Qualification
on:
  workflow_dispatch:
  push:
    branches: [perf/v100-strata-derived]
    paths: ['.github/workflows/v100-strata-compare.yml']
permissions:
  contents: read
  actions: read
env:
  CMAKE_BUILD_PARALLEL_LEVEL: 32
jobs:
  hardware:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[v100:telemetry-qualify]')) }}
    runs-on: [self-hosted, v100, sm70, cuda-12-8, ninfer-phase11]
    concurrency:
      group: v100-sv0-hardware
      cancel-in-progress: false
    timeout-minutes: 180
    env:
      CUDA_VISIBLE_DEVICES: '0'
      NINFER_WEIGHTS: /models/qwen3-8b-flash-next
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          clean: false
      - name: Freeze environment and check existing assets
        shell: bash
        run: |
          set -euo pipefail
          # Remove only the prior run's bad link; do not touch the existing model bytes.
          old_alias="$GITHUB_WORKSPACE/telemetry-qualification-37707932845-1/qualified-model.ninfer"
          if [[ -L "$old_alias" ]]; then rm -- "$old_alias"; fi
          results="$GITHUB_WORKSPACE/telemetry-qualification-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir "$results"
          echo "QUALIFICATION_RESULTS=$results" >> "$GITHUB_ENV"
          free_mib=$(nvidia-smi --id=0 --query-gpu=memory.free --format=csv,noheader,nounits | tr -d '[:space:]')
          if (( free_mib < 28000 )); then
            echo "::error::V100 is occupied ($free_mib MiB free); no unrelated process was stopped."
            exit 1
          fi
          test -r "$NINFER_WEIGHTS"
          # The resident model lacks a .ninfer suffix. Keep the alias OUTSIDE
          # the uploaded results directory: upload-artifact dereferences symlinks
          # and otherwise uploads the entire 113 GB model.
          alias_path="$RUNNER_TEMP/qualified-model-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.ninfer"
          ln -s -- "$NINFER_WEIGHTS" "$alias_path"
          test -r "$alias_path"
          printf 'Source: %s\nAlias: %s\n' "$NINFER_WEIGHTS" "$alias_path" > "$results/ninfer-artifact-alias.txt"
          test -x /opt/ai/strata/.venv/bin/python
          test -r /opt/ai/strata/strata-unsloth-ud-q4_k_xl.json
          installed_sha=$(git -c safe.directory=/opt/ai/strata -C /opt/ai/strata rev-parse HEAD)
          test "$installed_sha" = ad5206fba4914b4ab0ffb5e1d17bae4cd77ba778
          git rev-parse HEAD > "$results/ninfer-sha.txt"
          echo "$installed_sha" > "$results/installed-strata-sha.txt"
          cp /opt/ai/strata/strata-unsloth-ud-q4_k_xl.json "$results/installed-strata-config.json"
          sha256sum /opt/ai/strata/strata-unsloth-ud-q4_k_xl.json > "$results/installed-strata-config.sha256"
          stat "$NINFER_WEIGHTS" > "$results/ninfer-model-stat.txt"
          nvidia-smi -q > "$results/gpu.txt"
          numactl --hardware > "$results/numa.txt"
          lscpu > "$results/cpu.txt"
          /usr/local/cuda-12.8/bin/nvcc --version > "$results/cuda.txt"
          nvidia-smi --id=0 --query-gpu=uuid --format=csv,noheader | tr -d '[:space:]' > "$results/gpu-uuid.txt"
      - name: Check out frozen instrumented Strata without changing installed baseline
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: mylordmonkeyman/Strata-V100
          ref: 0430d397d907032fc9ab83c8bb7acff48a935b53
          path: telemetry-strata-source
          persist-credentials: false
      - name: Download existing validated resident profile
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: v100-sv2-37270512213-1
          run-id: 37270512213
          github-token: ${{ github.token }}
          path: telemetry-profile-source
      - name: Build both frozen engines once
        shell: bash
        run: |
          set -euo pipefail
          git -C telemetry-strata-source rev-parse HEAD > "$QUALIFICATION_RESULTS/strata-sha.txt"
          test "$(cat "$QUALIFICATION_RESULTS/strata-sha.txt")" = 0430d397d907032fc9ab83c8bb7acff48a935b53
          cmp docs/v100-cross-engine-telemetry-spec.md telemetry-strata-source/docs/v100-cross-engine-telemetry-spec.md
          cmake -S . -B build-telemetry-qualification -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CUDA_COMPILER=/usr/local/cuda-12.8/bin/nvcc -DCMAKE_CUDA_ARCHITECTURES=70 \
            -DNINFER_BUILD_MEDIA=OFF -DNINFER_BUILD_APPS=ON -DNINFER_BUILD_BENCHMARKS=OFF -DBUILD_TESTING=ON
          cmake --build build-telemetry-qualification --target ninfer-serve \
            ninfer_qwen3_8_flash_next_expert_cache_test ninfer_qwen3_8_flash_next_expert_stream_test
          cmake -S telemetry-strata-source -B build-strata-telemetry-qualification -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DSTRATA_ENABLE_CUDA=ON -DSTRATA_BUILD_TESTS=OFF \
            -DCMAKE_CUDA_COMPILER=/usr/local/cuda-12.8/bin/nvcc -DCMAKE_CUDA_ARCHITECTURES=70
          cmake --build build-strata-telemetry-qualification --target strata
          cp build-telemetry-qualification/CMakeCache.txt "$QUALIFICATION_RESULTS/ninfer-CMakeCache.txt"
          cp build-strata-telemetry-qualification/CMakeCache.txt "$QUALIFICATION_RESULTS/strata-CMakeCache.txt"
      - name: Validate known GPU expert work before loading full models
        shell: bash
        run: |
          set -euo pipefail
          for level in 0 1 2; do
            for fixture in expert_cache expert_stream; do
              V100_COMPARE_TELEMETRY_LEVEL="$level" V100_COMPARE_RUN_ID="fixture-${fixture}-l${level}" \
                "build-telemetry-qualification/tests/ninfer_qwen3_8_flash_next_${fixture}_test" \
                > "$QUALIFICATION_RESULTS/${fixture}-l${level}.log" 2>&1
            done
          done
      - name: Qualify native outputs and telemetry overhead in one sequential matrix
        shell: bash
        run: |
          set -euo pipefail
          # On failure, print native engine details before the artifact upload step.
          trap 'rc=$?; echo "::error::Native qualification failed (exit $rc)"; tail -100 "$QUALIFICATION_RESULTS/matrix-summary.log" 2>/dev/null || true; find "$QUALIFICATION_RESULTS/matrix" -maxdepth 2 -name server.log -type f -print -exec tail -n 35 {} \; 2>/dev/null || true; exit "$rc"' ERR
          python3 tools/telemetry/qualify_v100.py \
            --ninfer build-telemetry-qualification/apps/ninfer-serve \
            --artifact "$RUNNER_TEMP/qualified-model-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.ninfer" --profile telemetry-profile-source/sv2-static-profile.json \
            --strata-python /opt/ai/strata/.venv/bin/python \
            --strata-server telemetry-strata-source/serve/server.py \
            --strata-config /opt/ai/strata/strata-unsloth-ud-q4_k_xl.json \
            --strata-binary build-strata-telemetry-qualification/strata \
            --gpu-uuid "$(cat "$QUALIFICATION_RESULTS/gpu-uuid.txt")" \
            --output "$QUALIFICATION_RESULTS/matrix" --warmups 5 --repeats 3 \
            > "$QUALIFICATION_RESULTS/matrix-summary.log" 2>&1
          cat "$QUALIFICATION_RESULTS/matrix-summary.log" >> "$GITHUB_STEP_SUMMARY"
      - name: Guard uploaded evidence against large files and symlinks
        id: upload_guard
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          folder="$GITHUB_WORKSPACE/telemetry-qualification-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if [[ ! -d "$folder" ]]; then
            echo "safe=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No evidence directory was created."
            exit 0
          fi
          # Symlinks are never needed in a diagnostic artifact; never dereference a model.
          find "$folder" -type l -print -delete
          bytes="$(du -sb -- "$folder" | cut -f1)"
          echo "Diagnostic artifact source size: ${bytes} bytes"
          if (( bytes >= 1073741824 )); then
            echo "safe=false" >> "$GITHUB_OUTPUT"
            echo "::error::Diagnostic bundle exceeds the 1 GiB safety limit; refusing upload."
            exit 0
          fi
          echo "safe=true" >> "$GITHUB_OUTPUT"
      - name: Preserve all evidence including partial failures
        if: ${{ always() && steps.upload_guard.outputs.safe == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v100-telemetry-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: telemetry-qualification-${{ github.run_id }}-${{ github.run_attempt }}/
          retention-days: 30
          if-no-files-found: warn

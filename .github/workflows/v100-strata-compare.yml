name: V100 NInfer vs Strata Comparison
on:
  push:
    branches: [perf/v100-strata-derived]
    paths:
      - '.github/workflows/v100-strata-compare.yml'
      - 'tools/diagnostics/v100_strata_compare.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  CMAKE_BUILD_PARALLEL_LEVEL: 32
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: |
          python3 -m py_compile tools/diagnostics/v100_strata_compare.py
          git diff --check
  hardware:
    needs: checks
    runs-on: [self-hosted, v100, sm70, cuda-12-8, ninfer-phase11]
    concurrency:
      group: v100-sv0-hardware
      cancel-in-progress: true
    timeout-minutes: 120
    env:
      CUDA_VISIBLE_DEVICES: '0'
      NINFER_WEIGHTS: /models/qwen3-8b-flash-next
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          clean: false
      - name: Check V100 headroom and existing Strata assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p strata-compare-results strata-compare-source
          find strata-compare-results -mindepth 1 -delete
          find strata-compare-source -mindepth 1 -delete
          free_mib=$(nvidia-smi --id=0 --query-gpu=memory.free --format=csv,noheader,nounits | tr -d '[:space:]')
          if (( free_mib < 28000 )); then
            echo "::error::V100 is busy ($free_mib MiB free); no unrelated process was stopped."
            exit 1
          fi
          test -r "$NINFER_WEIGHTS"
          strata_root=''
          for root in /opt/ai/strata /srv/Strata-V100; do
            config="$root/strata-unsloth-ud-q4_k_xl.json"
            if [[ -x "$root/.venv/bin/python" && -r "$root/serve/server.py" && -r "$config" ]]; then
              strata_root="$root"; break
            fi
          done
          if [[ -z "$strata_root" ]]; then
            echo 'Visible candidate model/runtime assets:'
            find /models /var/lib/llama /opt/ai /srv -maxdepth 4 -type f \
              \( -iname '*Flash-Next*' -o -iname '*q4*k*xl*' -o -name 'server.py' -o -name 'strata' \) \
              -print 2>/dev/null | head -200 || true
            echo 'Local Strata files are absent; probing host llama-swap without loading a model.'
            for endpoint in http://127.0.0.1:9292 http://127.0.0.1:8080; do
              echo "PROBE $endpoint"
              curl -fsS --max-time 3 "$endpoint/v1/models" || true
              echo
            done
            echo '::error::Existing Strata install/config is not visible in this runner namespace.'
            exit 1
          fi
          echo "STRATA_ROOT=$strata_root" >> "$GITHUB_ENV"
          echo "STRATA_CONFIG=$strata_root/strata-unsloth-ud-q4_k_xl.json" >> "$GITHUB_ENV"
          test -r "$strata_root/data/expert-profile.bin"
          git rev-parse HEAD > strata-compare-results/ninfer-sha.txt
          git -c safe.directory="$strata_root" -C "$strata_root" rev-parse HEAD > strata-compare-results/strata-sha.txt
          sha256sum "$strata_root/strata-unsloth-ud-q4_k_xl.json" > strata-compare-results/strata-config-sha256.txt
          nvidia-smi -q > strata-compare-results/gpu.txt
          /usr/local/cuda-12.8/bin/nvcc --version > strata-compare-results/cuda.txt
          numactl --hardware > strata-compare-results/numa.txt
      - name: Download validated NInfer resident profile
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: v100-sv2-37270512213-1
          run-id: 37270512213
          github-token: ${{ github.token }}
          path: strata-compare-source
      - name: Build current NInfer server
        shell: bash
        run: |
          set -euo pipefail
          ln -s "$NINFER_WEIGHTS" strata-compare-source/model.ninfer
          cmake -S . -B build-strata-compare -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CUDA_COMPILER=/usr/local/cuda-12.8/bin/nvcc \
            -DCMAKE_CUDA_ARCHITECTURES=70 -DNINFER_BUILD_MEDIA=OFF \
            -DNINFER_BUILD_APPS=ON -DNINFER_BUILD_BENCHMARKS=OFF -DBUILD_TESTING=OFF
          cmake --build build-strata-compare --target ninfer-serve
      - name: Run alternating same-host comparison
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/diagnostics/v100_strata_compare.py \
            --ninfer build-strata-compare/apps/ninfer-serve \
            --artifact strata-compare-source/model.ninfer \
            --profile strata-compare-source/sv2-static-profile.json \
            --strata-python "$STRATA_ROOT/.venv/bin/python" \
            --strata-server "$STRATA_ROOT/serve/server.py" \
            --strata-config "$STRATA_CONFIG" \
            --strata-profile "$STRATA_ROOT/data/expert-profile.bin" \
            --output strata-compare-results --repeats 3
          cat strata-compare-results/summary.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve comparison evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v100-strata-compare-${{ github.run_id }}-${{ github.run_attempt }}
          path: strata-compare-results/
          retention-days: 30
          if-no-files-found: warn

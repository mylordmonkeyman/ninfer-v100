name: V100 SV3 Prefill Staging Ring
on:
  push:
    branches: [perf/v100-strata-derived]
    paths:
      - '.github/workflows/v100-sv3.yml'
      - 'src/targets/qwen3_8_flash_next/impl/expert_stream.*'
      - 'src/targets/qwen3_8_flash_next/impl/moe.*'
      - 'src/targets/qwen3_8_flash_next/impl/perf_telemetry.h'
      - 'src/targets/qwen3_8_flash_next/impl/program.cpp'
      - 'src/targets/qwen3_8_flash_next/impl/runtime_state.*'
      - 'src/targets/qwen3_8_flash_next/impl/runtime_plan.*'
      - 'src/targets/qwen3_8_flash_next/impl/text_decode*'
      - 'tests/targets/qwen3_8_flash_next/test_expert_stream.cpp'
      - 'tests/targets/qwen3_8_flash_next/test_vertical_slice_real.cpp'
      - 'tools/diagnostics/v100_sv3_runtime.py'
      - 'tools/diagnostics/test_v100_sv3_runtime.py'
      - 'tools/diagnostics/v100_sv3_calibrate.py'
      - 'tools/diagnostics/test_v100_sv3_calibrate.py'
      - 'docs/maintainer/v100-strata-performance.md'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  CMAKE_BUILD_PARALLEL_LEVEL: 32
jobs:
  compile:
    runs-on: ubuntu-24.04
    container:
      image: nvidia/cuda:12.8.1-devel-ubuntu24.04
    timeout-minutes: 60
    steps:
      - name: Install build tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends git ca-certificates python3 python3-pip pkg-config
          python3 -m pip install --break-system-packages 'cmake>=3.28,<4' ninja
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Compile bounded prefill staging for SM70
        run: |
          cmake -S . -B build-sv3 -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CUDA_ARCHITECTURES=70 -DNINFER_BUILD_MEDIA=OFF \
            -DNINFER_BUILD_APPS=OFF -DNINFER_BUILD_BENCHMARKS=OFF -DBUILD_TESTING=ON
          cmake --build build-sv3 --target ninfer_qwen3_8_flash_next_expert_stream_test
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest \
            tools.diagnostics.test_v100_sv3_runtime \
            tools.diagnostics.test_v100_sv3_calibrate
  hardware:
    needs: compile
    runs-on: [self-hosted, v100, sm70, cuda-12-8, ninfer-phase11]
    concurrency:
      group: v100-sv0-hardware
      cancel-in-progress: false
    timeout-minutes: 120
    env:
      CUDA_VISIBLE_DEVICES: '0'
      NINFER_WEIGHTS: /models/qwen3-8b-flash-next
      NINFER_FLASH_NEXT_ORACLE_MANIFEST: /oracle/phase11/manifest.json
      NINFER_FLASH_NEXT_CPU_EXPERT_WORKERS: '32'
      NINFER_FLASH_NEXT_FP32_HYPER_STATE: '1'
      NINFER_FLASH_NEXT_FP32_GDN_CONV: '1'
      NINFER_FLASH_NEXT_FP32_GDN_PROJECTION: '1'
      NINFER_FLASH_NEXT_FP32_GDN_READOUT: '1'
      NINFER_FLASH_NEXT_FP32_GDN_GATE: '1'
      NINFER_FLASH_NEXT_FP32_GDN_OUTPUT: '1'
      NINFER_FLASH_NEXT_FP32_GDN_OUTPUT_INPUT: '1'
      NINFER_FLASH_NEXT_FP32_HYPER_INJECT_INPUT: '1'
      NINFER_FLASH_NEXT_FP32_HYPER_INJECT_APPLY: '1'
      NINFER_FLASH_NEXT_FP32_MLP_HYPER_OUTPUT: '1'
      NINFER_FLASH_NEXT_FP32_MLP_HYPER_INPUT: '1'
      NINFER_FLASH_NEXT_FP32_MLP_HYPER_NORMALIZED: '1'
      NINFER_FLASH_NEXT_FP32_MLP_HYPER_LOW_RANK: '1'
      NINFER_FLASH_NEXT_FP32_MLP_HYPER_APPLY: '1'
      NINFER_FLASH_NEXT_FP32_MLP_HYPER_INJECTION: '1'
      NINFER_FLASH_NEXT_FP32_MOE_OUTPUT: '1'
      NINFER_FLASH_NEXT_FP32_ROUTER_INPUT: '0'
      NINFER_FLASH_NEXT_FP32_ROUTER_INPUT_LAYERS_32_47: '0'
      NINFER_FLASH_NEXT_FP32_MOE_ROUTED_INPUT: '0'
      NINFER_FLASH_NEXT_FP32_MOE_SHARED_INPUT: '0'
      NINFER_FLASH_NEXT_CPU_EXPERT_FP32_INTERMEDIATE: '0'
      NINFER_FLASH_NEXT_MOE_SHARED_FP32_INTERMEDIATE: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          clean: false
      - name: Prepare staging evidence
        run: |
          mkdir -p sv3-results
          find sv3-results -mindepth 1 -maxdepth 1 -delete
          git rev-parse HEAD > sv3-results/candidate-sha.txt
          nvidia-smi -q > sv3-results/gpu.txt
          /usr/local/cuda-12.8/bin/nvcc --version > sv3-results/cuda.txt
      - name: Download validated identity-bound resident profile
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: v100-sv2-37270512213-1
          run-id: 37270512213
          github-token: ${{ github.token }}
          path: sv3-profile-source
      - name: Build and test ring reuse against independent expert oracle
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build-sv3 -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CUDA_COMPILER=/usr/local/cuda-12.8/bin/nvcc \
            -DCMAKE_CUDA_ARCHITECTURES=70 -DNINFER_BUILD_MEDIA=OFF \
            -DNINFER_BUILD_APPS=OFF -DNINFER_BUILD_BENCHMARKS=OFF -DBUILD_TESTING=ON
          cmake --build build-sv3 --target ninfer_qwen3_8_flash_next_expert_stream_test
          build-sv3/tests/ninfer_qwen3_8_flash_next_expert_stream_test 2>&1 | tee sv3-results/staging.log
      - name: Build and exercise the real prefill integration
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build-sv3 --target ninfer_qwen3_8_flash_next_vertical_slice_real_test
          python3 tools/diagnostics/v100_sv3_runtime.py \
            --executable build-sv3/tests/ninfer_qwen3_8_flash_next_vertical_slice_real_test \
            --output sv3-results --positions 32 | tee sv3-results/runtime.log
      - name: Check resident hits and ephemeral misses on the real model
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/diagnostics/v100_sv3_runtime.py \
            --executable build-sv3/tests/ninfer_qwen3_8_flash_next_vertical_slice_real_test \
            --output sv3-results/resident --positions 32 \
            --profile sv3-profile-source/sv2-static-profile.json \
            | tee sv3-results/resident.log
          python3 - <<'PY'
          from pathlib import Path
          from tools.diagnostics.v100_sv3_calibrate import parse_probe
          off = parse_probe(Path('sv3-results/runtime.stdout.log').read_text(), 32)
          cached = parse_probe(Path('sv3-results/resident/runtime.stdout.log').read_text(), 32)
          keys = ('candidate_top1', 'oracle_top1', 'kl', 'relative_nll_delta', 'max_logit_error')
          if any(off[key] != cached[key] for key in keys):
              raise RuntimeError('resident/stream numerical metrics differ from all-stream control')
          print('Resident and all-stream numerical metrics match exactly.')
          PY
      - name: Calibrate CPU and staged-GPU prefill across supported chunk sizes
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/diagnostics/v100_sv3_calibrate.py \
            --executable build-sv3/tests/ninfer_qwen3_8_flash_next_vertical_slice_real_test \
            --output sv3-results --repeats 3 \
            --sizes 128 256 512 1024 2048 | tee sv3-results/calibration.log
      - name: Preserve staging evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v100-sv3-${{ github.run_id }}-${{ github.run_attempt }}
          path: sv3-results/
          retention-days: 30
          if-no-files-found: warn

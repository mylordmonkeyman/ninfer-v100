name: V100 SV3 Prefill Staging Ring
on:
  push:
    branches: [perf/v100-strata-derived]
    paths:
      - '.github/workflows/v100-sv3.yml'
      - 'src/targets/qwen3_8_flash_next/impl/expert_stream.*'
      - 'tests/targets/qwen3_8_flash_next/test_expert_stream.cpp'
  workflow_dispatch:
permissions:
  contents: read
env:
  CMAKE_BUILD_PARALLEL_LEVEL: 32
jobs:
  compile:
    runs-on: ubuntu-24.04
    container:
      image: nvidia/cuda:12.8.1-devel-ubuntu24.04
    timeout-minutes: 60
    steps:
      - name: Install build tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends git ca-certificates python3 python3-pip pkg-config
          python3 -m pip install --break-system-packages 'cmake>=3.28,<4' ninja
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Compile bounded prefill staging for SM70
        run: |
          cmake -S . -B build-sv3 -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CUDA_ARCHITECTURES=70 -DNINFER_BUILD_MEDIA=OFF \
            -DNINFER_BUILD_APPS=OFF -DNINFER_BUILD_BENCHMARKS=OFF -DBUILD_TESTING=ON
          cmake --build build-sv3 --target ninfer_qwen3_8_flash_next_expert_stream_test
  hardware:
    needs: compile
    runs-on: [self-hosted, v100, sm70, cuda-12-8, ninfer-phase11]
    concurrency:
      group: v100-sv0-hardware
      cancel-in-progress: false
    timeout-minutes: 60
    env:
      CUDA_VISIBLE_DEVICES: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          clean: false
      - name: Prepare staging evidence
        run: |
          mkdir -p sv3-results
          find sv3-results -mindepth 1 -maxdepth 1 -delete
          git rev-parse HEAD > sv3-results/candidate-sha.txt
          nvidia-smi -q > sv3-results/gpu.txt
          /usr/local/cuda-12.8/bin/nvcc --version > sv3-results/cuda.txt
      - name: Build and test ring reuse against independent expert oracle
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build-sv3 -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CUDA_COMPILER=/usr/local/cuda-12.8/bin/nvcc \
            -DCMAKE_CUDA_ARCHITECTURES=70 -DNINFER_BUILD_MEDIA=OFF \
            -DNINFER_BUILD_APPS=OFF -DNINFER_BUILD_BENCHMARKS=OFF -DBUILD_TESTING=ON
          cmake --build build-sv3 --target ninfer_qwen3_8_flash_next_expert_stream_test
          build-sv3/tests/ninfer_qwen3_8_flash_next_expert_stream_test 2>&1 | tee sv3-results/staging.log
      - name: Preserve staging evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v100-sv3-${{ github.run_id }}-${{ github.run_attempt }}
          path: sv3-results/
          retention-days: 30
          if-no-files-found: warn

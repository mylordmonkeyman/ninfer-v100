name: Phase 11 V100 Trace Summary

on:
  push:
    branches:
      - work/precision-matched-reference
    paths:
      - .github/workflows/precision-v100-summary.yml

permissions:
  actions: read
  contents: read

jobs:
  summarize:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Download completed V100 candidate and comparison
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 36018385552 \
            --repo "$GITHUB_REPOSITORY" \
            --name v100-precision-trace-14 \
            --dir v100-artifact
          gh run download 36017907847 \
            --repo "$GITHUB_REPOSITORY" \
            --name cpu-precision-reference-14 \
            --dir cpu-artifact
      - name: Compare router scores and near-tie decisions
        run: |
          python3 -m venv score-venv
          score-venv/bin/pip install numpy
          score-venv/bin/python - <<'PY'
          import collections
          import csv
          import json
          from pathlib import Path
          import numpy as np

          cpu = Path('cpu-artifact')
          gpu = Path('v100-artifact/candidate-stage')
          details = []
          for pos in range(14):
              for layer in range(48):
                  name = f'L{layer:02d}_moe_router_scores.bin'
                  rel = Path(f'pos{pos:04d}') / name
                  fp32 = np.fromfile(cpu / 'fp32' / rel, dtype='<f4')
                  storage = np.fromfile(cpu / 'v100-phase11-storage' / rel, dtype='<f4')
                  candidate = np.fromfile(gpu / rel, dtype='<f4')
                  if (fp32.size, storage.size, candidate.size) != (512, 512, 512):
                      raise SystemExit(f'incomplete 512-score vector: {rel}')
                  rank = np.argsort(-fp32, kind='stable')
                  ref_set = set(rank[:10])
                  cpu_set = set(np.argsort(-storage, kind='stable')[:10])
                  gpu_set = set(np.argsort(-candidate, kind='stable')[:10])
                  scale = max(float(np.sqrt(np.mean(fp32.astype('f8')**2))), 1e-12)
                  row = {
                      'position': pos, 'layer': layer,
                      'cutoff': float(fp32[rank[9]] - fp32[rank[10]]),
                      'cpu_rms_error': float(np.sqrt(np.mean((storage.astype('f8')-fp32)**2))),
                      'gpu_rms_error': float(np.sqrt(np.mean((candidate.astype('f8')-fp32)**2))),
                      'cpu_nrmse': float(np.sqrt(np.mean((storage.astype('f8')-fp32)**2))/scale),
                      'gpu_nrmse': float(np.sqrt(np.mean((candidate.astype('f8')-fp32)**2))/scale),
                      'cpu_gpu_nrmse': float(np.sqrt(np.mean((storage.astype('f8')-candidate)**2))/scale),
                      'cpu_flip': int(cpu_set != ref_set),
                      'gpu_flip': int(gpu_set != ref_set),
                      'cpu_only_ids': ','.join(map(str, sorted(cpu_set-ref_set))),
                      'gpu_only_ids': ','.join(map(str, sorted(gpu_set-ref_set))),
                  }
                  details.append(row)
                  if (pos, layer) in ((2,20), (2,38), (10,5), (13,39)):
                      print('Router focus', json.dumps(row))
                      print('  oracle 10th/11th IDs', rank[9], rank[10])
                      print('  oracle/cpu/gpu 10th/11th scores',
                            [(int(i),float(fp32[i]),float(storage[i]),float(candidate[i]))
                             for i in rank[9:11]])
          print('Score vectors:', len(details))
          print('GPU flip count from raw scores:', sum(r['gpu_flip'] for r in details))
          print('CPU flip count from raw scores:', sum(r['cpu_flip'] for r in details))
          for label in ('cpu_nrmse','gpu_nrmse','cpu_gpu_nrmse'):
              print(label, 'median=',float(np.median([r[label] for r in details])),
                    'p95=',float(np.percentile([r[label] for r in details], 95)))
          out = Path('concise-v100-report')
          out.mkdir(exist_ok=True)
          with (out / 'router_scores.csv').open('w', newline='') as handle:
              writer = csv.DictWriter(handle, fieldnames=list(details[0]))
              writer.writeheader()
              writer.writerows(details)
          PY
      - name: Summarize matched and unmatched stage errors
        run: |
          python3 - <<'PY'
          import collections
          import csv
          import json
          from pathlib import Path

          root = Path('v100-artifact')
          rows = list(csv.DictReader((root / 'v100-comparison/stage_comparison.csv').open()))
          router = [r for r in rows if r['stage'].endswith('moe_router_ids')]
          cpu = {(int(r['position']), r['stage']) for r in router
                 if r['cpu_same_expert_set'] == '0'}
          v100 = {(int(r['position']), r['stage']) for r in router
                  if r['v100_same_expert_set'] == '0'}
          print('Router cells:', len(router))
          print('Shared flips:', len(cpu & v100))
          print('CPU-only flips:', len(cpu - v100))
          print('V100-only flips:', len(v100 - cpu))
          print('CPU flips per position:', sorted(collections.Counter(p for p, _ in cpu).items()))
          print('V100 flips per position:', sorted(collections.Counter(p for p, _ in v100).items()))
          print('V100-only flips per layer:', sorted(collections.Counter(s[:3] for _, s in v100 - cpu).items()))
          for stage in ('embedding', 'L00_attn_block_input', 'L00_mlp_block_input',
                        'L24_attn_block_input', 'L24_mlp_block_input',
                        'L43_mlp_block_input', 'final_hidden', 'logits'):
              matches = [r for r in rows if r['stage'] == stage and r['position'] in ('0','13')]
              for r in matches:
                  print('stage', stage, 'pos', r['position'],
                        'cpu_oracle', r['cpu_vs_oracle_nrmse'],
                        'v100_oracle', r['v100_vs_oracle_nrmse'],
                        'v100_cpu', r['v100_vs_cpu_nrmse'])
          log = (root / 'v100-trace.log').read_text(errors='replace')
          lines = log.splitlines()
          summaries = [line for line in lines if 'phase11.top1_agreement=' in line or
                       'phase11.mean_kl=' in line or 'phase11.qualification' in line]
          print('V100 test summaries:')
          for line in summaries[-20:]: print(line[:700])
          print('V100 test log tail:')
          for line in lines[-40:]: print(line[:700])
          probes = [line for line in lines if any(
              marker in line for marker in (
                  'phase11.router_margin.position=2 stage=L20_moe_router_ids',
                  'phase11.router_ids_mismatch.position=2 stage=L20_moe_router_ids',
                  'phase11.pre_router_autopsy.position=2 layer=20',
                  'phase11.router_probe.position=2 layer=20',
                  'phase11.router_margin.position=10 stage=L05_moe_router_ids',
                  'phase11.pre_router_autopsy.position=10 layer=5',
                  'phase11.router_margin.position=13 stage=L39_moe_router_ids'))]
          print('First divergent router probes:')
          for line in probes: print(line[:1500])
          out = Path('concise-v100-report')
          out.mkdir(exist_ok=True)
          for source in (root / 'v100-comparison/stage_comparison.csv',
                         root / 'v100-comparison/stage_comparison.json'):
              (out / source.name).write_bytes(source.read_bytes())
          (out / 'test-summary.txt').write_text('\n'.join(
              summaries[-20:] + lines[-40:] + probes))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v100-precision-summary-14
          path: concise-v100-report
          retention-days: 14

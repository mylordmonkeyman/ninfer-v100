name: SM70 Flash-Next Compile

on:
  push:
    branches:
      - forwardport/v100-flash-next-omp
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sm70-flash-next-compile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: SM70 Flash-Next Compile
    runs-on: ubuntu-24.04
    environment: "Oh my pi" 
    container:
      image: nvidia/cuda:12.8.1-devel-ubuntu24.04
    timeout-minutes: 60

    steps:
      - name: Install build tools
        shell: bash
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git \
            ca-certificates \
            python3 \
            python3-pip \
            pkg-config
          python3 -m pip install --break-system-packages 'cmake>=3.28,<4' ninja

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Configure CUDA 12.8 SM70
        shell: bash
        run: |
          cmake -S . -B build-sm70 -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CUDA_ARCHITECTURES=70 \
            -DNINFER_BUILD_MEDIA=OFF \
            -DNINFER_BUILD_APPS=OFF \
            -DNINFER_BUILD_BENCHMARKS=OFF \
            -DBUILD_TESTING=ON

      - name: Build Flash-Next SM70 targets
        shell: bash
        run: |
          cmake --build build-sm70 --parallel 2 --target \
            ninfer_qwen3_8_flash_next_expert_bank_test \
            ninfer_qwen3_8_flash_next_cpu_expert_reference_test \
            ninfer_qwen3_8_flash_next_moe_test \
            ninfer_qwen3_8_flash_next_text_decode_test \
            ninfer_qwen3_8_flash_next_loader_test \
            ninfer_qwen3_8_flash_next_vertical_slice_test \
            ninfer_qwen3_8_flash_next_vertical_slice_real_test \
            ninfer_qwen3_8_flash_next_text_executor_test \
            ninfer_qwen3_8_flash_next_load_plan_test

      - name: Run host-only Flash-Next contract test
        shell: bash
        run: |
          # GitHub-hosted runners have the CUDA toolkit but no NVIDIA driver.
          # This contract test is CPU-only; expose CUDA's link stub under the
          # runtime SONAME so the executable can start without physical GPU hardware.
          stub_src=/usr/local/cuda/targets/x86_64-linux/lib/stubs/libcuda.so
          stub_dir="$PWD/build-sm70/cuda-driver-stub"
          mkdir -p "$stub_dir"
          ln -sf "$stub_src" "$stub_dir/libcuda.so.1"
          LD_LIBRARY_PATH="$stub_dir:${LD_LIBRARY_PATH:-}" \
            ctest --test-dir build-sm70 --output-on-failure \
              -R '^ninfer_qwen3_8_flash_next_vertical_slice_test$'

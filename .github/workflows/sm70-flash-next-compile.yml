name: SM70 Flash-Next CI

on:
  push:
    branches:
      - forwardport/v100-flash-next
      - perf/v100-gdn-chunked-sm70
  pull_request:
    branches:
      - forwardport/v100-flash-next
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sm70-flash-next-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: CUDA 12.8 SM70 compile + host checks
    runs-on: ubuntu-24.04
    container:
      image: nvidia/cuda:12.8.1-devel-ubuntu24.04
    timeout-minutes: 60

    steps:
      - name: Install build tools
        shell: bash
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git \
            ca-certificates \
            python3 \
            python3-pip \
            pkg-config
          python3 -m pip install --break-system-packages 'cmake>=3.28,<4' ninja

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Configure CUDA 12.8 SM70
        shell: bash
        run: |
          cmake -S . -B build-sm70 -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CUDA_ARCHITECTURES=70 \
            -DNINFER_BUILD_MEDIA=OFF \
            -DNINFER_BUILD_APPS=OFF \
            -DNINFER_BUILD_BENCHMARKS=OFF \
            -DBUILD_TESTING=ON

      - name: Build Flash-Next and Volta GDN targets
        shell: bash
        run: |
          cmake --build build-sm70 -j --target \
            ninfer_volta_substrate_test \
            ninfer_gated_delta_net_volta_math_test \
            ninfer_gated_delta_net_volta_fused_test \
            ninfer_qwen3_8_flash_next_expert_bank_test \
            ninfer_qwen3_8_flash_next_cpu_expert_reference_test \
            ninfer_qwen3_8_flash_next_moe_test \
            ninfer_qwen3_8_flash_next_text_decode_test \
            ninfer_qwen3_8_flash_next_loader_test \
            ninfer_qwen3_8_flash_next_vertical_slice_test \
            ninfer_qwen3_8_flash_next_vertical_slice_real_test \
            ninfer_qwen3_8_flash_next_text_executor_test \
            ninfer_qwen3_8_flash_next_load_plan_test

      - name: Run hosted-runner checks
        shell: bash
        run: |
          # GitHub-hosted runners provide the CUDA toolkit but no physical NVIDIA
          # GPU. The GDN Volta math test executes its CPU-side mathematical checks
          # before returning the configured skip code for device-only SM70 checks.
          # A private V100 runner will later own physical-kernel correctness and
          # performance qualification.
          stub_src=/usr/local/cuda/targets/x86_64-linux/lib/stubs/libcuda.so
          stub_dir="$PWD/build-sm70/cuda-driver-stub"
          mkdir -p "$stub_dir"
          ln -sf "$stub_src" "$stub_dir/libcuda.so.1"
          LD_LIBRARY_PATH="$stub_dir:${LD_LIBRARY_PATH:-}" \
            ctest --test-dir build-sm70 --output-on-failure \
              -R "^(ninfer_gated_delta_net_volta_math_test|ninfer_gated_delta_net_volta_fused_test|ninfer_qwen3_8_flash_next_vertical_slice_test)$"


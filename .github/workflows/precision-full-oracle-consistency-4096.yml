name: Phase 11 Full Oracle Consistency 4096
'on':
  push:
    branches:
    - work/precision-matched-reference
    paths:
    - .github/workflows/precision-full-oracle-consistency-4096.yml
permissions:
  contents: read
concurrency:
  group: phase11-full-oracle-consistency-4096
  cancel-in-progress: false
jobs:
  compare:
    runs-on:
    - self-hosted
    - v100
    - sm70
    - cuda-12-8
    - ninfer-phase11
    timeout-minutes: 4320
    env:
      NINFER_ORACLE_DETERMINISTIC: '1'
      CUDA_VISIBLE_DEVICES: ''
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - name: Locate read-only inputs and CPU Python
      shell: bash
      run: |
        set -euo pipefail
        test -r /srv/ninfer/source/mixed/model.safetensors.index.json
        test -d /srv/ninfer/source/ple/ples_int4
        test -r /oracle/phase11/manifest.json
        test -r /oracle/phase11/token_ids.json
        python_bin="${NINFER_PHASE11_PYTHON:-}"
        if [[ -z "$python_bin" ]]; then
          for candidate in "$HOME/ninfer-v100/venv-oracle/bin/python" \
              /srv/ninfer/venv-oracle/bin/python python3; do
            if command -v "$candidate" >/dev/null 2>&1 && \
                "$candidate" -c 'import numpy, torch, transformers, safetensors' >/dev/null 2>&1; then
              python_bin="$candidate"
              break
            fi
          done
        fi
        echo "PRECISION_PYTHON=$python_bin" >> "$GITHUB_ENV"
    - name: Prepare Python if needed
      shell: bash
      run: |
        set -euo pipefail
        if [[ -n "$PRECISION_PYTHON" ]]; then exit 0; fi
        python3 -m venv "$GITHUB_WORKSPACE/precision-venv"
        "$GITHUB_WORKSPACE/precision-venv/bin/pip" install \
          torch --index-url https://download.pytorch.org/whl/cpu
        "$GITHUB_WORKSPACE/precision-venv/bin/pip" install \
          numpy safetensors 'transformers>=5.16,<6'
        echo "PRECISION_PYTHON=$GITHUB_WORKSPACE/precision-venv/bin/python" >> "$GITHUB_ENV"
    - name: Full FP32 oracle at 16 threads and identical-input routing
      shell: bash
      env:
        NINFER_ORACLE_THREADS: '16'
        OMP_NUM_THREADS: '16'
        MKL_NUM_THREADS: '16'
        OPENBLAS_NUM_THREADS: '16'
        NUMEXPR_NUM_THREADS: '16'
      run: |
        set -euo pipefail
        mkdir -p oracle-consistency/thread16
        "$PRECISION_PYTHON" tools/reference/qwen3_8_flash_next/oracle/check_full_oracle_consistency.py \
          --model-dir /srv/ninfer/source/mixed \
          --ple-dir /srv/ninfer/source/ple/ples_int4 \
          --oracle-root /oracle/phase11 \
          --out-dir oracle-consistency/thread16 2>&1 | tee oracle-consistency/thread16/run.log
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: phase11-full-oracle-consistency-thread16-4096
        path: |-
          oracle-consistency/thread16/*.json
          oracle-consistency/thread16/*.csv
          oracle-consistency/thread16/run.log
        if-no-files-found: warn
        retention-days: 21
    - name: Full FP32 oracle at 1 threads and identical-input routing
      shell: bash
      env:
        NINFER_ORACLE_THREADS: '1'
        OMP_NUM_THREADS: '1'
        MKL_NUM_THREADS: '1'
        OPENBLAS_NUM_THREADS: '1'
        NUMEXPR_NUM_THREADS: '1'
      run: |
        set -euo pipefail
        mkdir -p oracle-consistency/thread1
        "$PRECISION_PYTHON" tools/reference/qwen3_8_flash_next/oracle/check_full_oracle_consistency.py \
          --model-dir /srv/ninfer/source/mixed \
          --ple-dir /srv/ninfer/source/ple/ples_int4 \
          --oracle-root /oracle/phase11 \
          --out-dir oracle-consistency/thread1 \
          --prior-dir oracle-consistency/thread16 2>&1 | tee oracle-consistency/thread1/run.log
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: phase11-full-oracle-consistency-thread1-4096
        path: |-
          oracle-consistency/thread1/*.json
          oracle-consistency/thread1/*.csv
          oracle-consistency/thread1/run.log
        if-no-files-found: warn
        retention-days: 21

name: V100 SV7 Volta QSA Scores
on:
  push:
    branches: [perf/v100-strata-derived]
    paths:
      - '.github/workflows/v100-sv7-attention.yml'
      - 'src/targets/qwen3_8_flash_next/impl/qsa_attention_kernels.*'
      - 'tests/targets/qwen3_8_flash_next/test_volta_qsa_scores.cpp'
  workflow_dispatch:
permissions:
  contents: read
env:
  CMAKE_BUILD_PARALLEL_LEVEL: 32
jobs:
  hardware:
    runs-on: [self-hosted, v100, sm70, cuda-12-8, ninfer-phase11]
    concurrency:
      group: v100-sv0-hardware
      cancel-in-progress: false
    timeout-minutes: 90
    env:
      CUDA_VISIBLE_DEVICES: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          clean: false
      - name: Build the score oracle and target regression once
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p sv7-attention-results
          git rev-parse HEAD > sv7-attention-results/candidate-sha.txt
          nvidia-smi -q > sv7-attention-results/gpu.txt
          free_mib=$(nvidia-smi --id=0 --query-gpu=memory.free --format=csv,noheader,nounits | tr -d '[:space:]')
          if (( free_mib < 28000 )); then
            echo "::error::V100 lacks focused SV7 attention test headroom; no unrelated workloads were stopped."
            exit 1
          fi
          cmake -S . -B build-sv6 -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CUDA_COMPILER=/usr/local/cuda-12.8/bin/nvcc \
            -DCMAKE_CUDA_ARCHITECTURES=70 -DNINFER_BUILD_MEDIA=OFF \
            -DNINFER_BUILD_APPS=ON -DNINFER_BUILD_BENCHMARKS=OFF -DBUILD_TESTING=ON
          cmake --build build-sv6 --target ninfer_volta_qsa_scores_test ninfer_qwen3_8_flash_next_qsa_attention_test
      - name: Independent FP64 oracle, finite-range fallback and matched timing
        shell: bash
        run: |
          set -euo pipefail
          build-sv6/tests/ninfer_volta_qsa_scores_test 2>&1 | tee sv7-attention-results/oracle.log
      - name: Existing target regression with experimental score math
        shell: bash
        run: |
          set -uo pipefail
          NINFER_V100_QSA_SCORE_MMA=0 build-sv6/tests/ninfer_qwen3_8_flash_next_qsa_attention_test 2>&1 | tee sv7-attention-results/baseline-regression.log
          baseline=$?
          NINFER_V100_QSA_SCORE_MMA=1 build-sv6/tests/ninfer_qwen3_8_flash_next_qsa_attention_test 2>&1 | tee sv7-attention-results/regression.log
          candidate=$?
          echo "baseline=${baseline} candidate=${candidate}" | tee sv7-attention-results/regression-status.txt
          if (( baseline != 0 || candidate != 0 )); then
            echo "::error::Target regression remains unqualified; baseline=${baseline} candidate=${candidate}"
            exit 1
          fi
      - name: Preserve bounded SV7 attention evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v100-sv7-attention-${{ github.run_id }}-${{ github.run_attempt }}
          path: sv7-attention-results/
          retention-days: 30
          if-no-files-found: warn

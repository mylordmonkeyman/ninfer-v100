name: Phase 11 Position Zero Fused Profile Stage Report

on:
  push:
    branches:
      - work/precision-matched-reference
    paths:
      - .github/workflows/precision-pos0-fused-stage-report.yml

permissions:
  actions: read
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: cpu-fused-hyper-profile-reference-14
          run-id: 36250285355
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: cpu
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: v100-layer0-gdn-pos0-14
          run-id: 36251205720
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: gpu
      - name: Compare earliest position-zero precision boundaries
        run: |
          python3 - <<'PY' | tee position-zero-report.txt
          import math,struct
          from pathlib import Path
          cpu=Path('cpu/v100-phase11-storage/pos0000')
          gpu=Path('gpu/pos0000')
          stages=('L00_attn_block_input','L00_gdn_projected',
                  'L00_gdn_query','L00_gdn_key','L00_gdn_value',
                  'L00_gdn_g','L00_gdn_beta','L00_gdn_recurrent_output',
                  'L00_gdn_gated_output','L00_attn_block_output',
                  'L00_hyper_after_attn','L00_mlp_block_input',
                  'L00_mlp_block_output','L00_hyper_after_mlp',
                  'ple_injection','L01_attn_block_input_fp32')
          def read(path):
              raw=path.read_bytes();assert len(raw)%4==0,(path,len(raw))
              return struct.unpack('<'+str(len(raw)//4)+'f',raw)
          for stage in stages:
              a,b=read(cpu/(stage+'.bin')),read(gpu/(stage+'.bin'))
              assert len(a)==len(b),(stage,len(a),len(b))
              sq=math.fsum((x-y)**2 for x,y in zip(a,b))
              norm=math.fsum(x*x for x in a)
              print(stage,'count',len(a),'FMA_CPU_V100_NRMSE',
                    format(math.sqrt(sq/norm),'.12g'),
                    'exact',sum(x==y for x,y in zip(a,b)),
                    'max_abs',format(max(abs(x-y) for x,y in zip(a,b)),'.12g'))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: phase11-position-zero-fused-stage-report
          path: position-zero-report.txt
          retention-days: 14

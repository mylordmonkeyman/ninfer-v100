name: Phase 11 Bounded FP32 MoE Output 4096
permissions:
  actions: read
  contents: read
concurrency:
  group: phase11-v100-moe-output-4096
  cancel-in-progress: false
jobs:
  full-corpus:
    runs-on:
    - self-hosted
    - v100
    - sm70
    - cuda-12-8
    - ninfer-phase11
    timeout-minutes: 4320
    env:
      NINFER_ORACLE_DETERMINISTIC: '1'
      NINFER_ORACLE_THREADS: '16'
      OMP_NUM_THREADS: '16'
      MKL_NUM_THREADS: '16'
      OPENBLAS_NUM_THREADS: '16'
      NUMEXPR_NUM_THREADS: '16'
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: phase11-three-way-4096-report
        run-id: 36324622296
        github-token: ${{ github.token }}
        repository: ${{ github.repository }}
        path: frozen-three-way
    - name: Locate frozen assets and CPU Python
      shell: bash
      run: |
        set -euo pipefail
        model_dir="${NINFER_PHASE11_MODEL_DIR:-/srv/ninfer/source/mixed}"
        ple_dir="${NINFER_PHASE11_PLE_DIR:-/srv/ninfer/source/ple/ples_int4}"
        ids_file="${NINFER_PHASE11_IDS_FILE:-/oracle/phase11/token_ids.json}"
        for path in "$model_dir/model.safetensors.index.json" "$ple_dir" \
                    "$ids_file" /oracle/phase11/manifest.json; do
          test -r "$path"
        done
        python_bin="${NINFER_PHASE11_PYTHON:-}"
        if [[ -z "$python_bin" ]]; then
          for candidate in "$GITHUB_WORKSPACE/venv-oracle/bin/python" \
              "$HOME/ninfer-v100/venv-oracle/bin/python" \
              /srv/ninfer/venv-oracle/bin/python python3; do
            if command -v "$candidate" >/dev/null 2>&1 && \
                "$candidate" -c 'import numpy, torch, transformers, safetensors' >/dev/null 2>&1; then
              python_bin="$candidate"
              break
            fi
          done
        fi
        {
          echo "PRECISION_MODEL_DIR=$model_dir"
          echo "PRECISION_PLE_DIR=$ple_dir"
          echo "PRECISION_IDS_FILE=$ids_file"
          echo "PRECISION_PYTHON=$python_bin"
        } >> "$GITHUB_ENV"
    - name: Prepare CPU Python if needed
      shell: bash
      run: |
        set -euo pipefail
        if [[ -n "$PRECISION_PYTHON" ]]; then exit 0; fi
        python3 -m venv "$GITHUB_WORKSPACE/precision-venv"
        "$GITHUB_WORKSPACE/precision-venv/bin/pip" install \
          torch --index-url https://download.pytorch.org/whl/cpu
        "$GITHUB_WORKSPACE/precision-venv/bin/pip" install \
          numpy safetensors 'transformers>=5.16,<6'
        echo "PRECISION_PYTHON=$GITHUB_WORKSPACE/precision-venv/bin/python" >> "$GITHUB_ENV"
    - name: Preflight comparison and build before long CPU run
      shell: bash
      run: |
        set -euo pipefail
        "$PRECISION_PYTHON" -m py_compile tools/reference/qwen3_8_flash_next/oracle/compare_moe_output_fp32.py tools/reference/qwen3_8_flash_next/oracle/compare_full_prefix.py
        "$PRECISION_PYTHON" tools/reference/qwen3_8_flash_next/oracle/compare_moe_output_fp32.py --help >/dev/null
        "$PRECISION_PYTHON" tools/reference/qwen3_8_flash_next/oracle/compare_full_prefix.py --help >/dev/null
        test -r frozen-three-way/report/per_position.csv
    - name: Compile real V100 model test
      shell: bash
      run: |
        set -euo pipefail
        cmake -S . -B build-precision-v100 -G Ninja \
          -DCMAKE_BUILD_TYPE=RelWithDebInfo \
          -DCMAKE_CUDA_COMPILER=/usr/local/cuda-12.8/bin/nvcc \
          -DCMAKE_CUDA_ARCHITECTURES=70 \
          -DNINFER_BUILD_MEDIA=OFF \
          -DNINFER_BUILD_APPS=OFF \
          -DNINFER_BUILD_BENCHMARKS=OFF \
          -DBUILD_TESTING=ON
        cmake --build build-precision-v100 -j --target \
          ninfer_qwen3_8_flash_next_vertical_slice_real_test
    - name: Wait for free V100 memory
      shell: bash
      timeout-minutes: 60
      run: |
        set -euo pipefail
        for attempt in $(seq 1 120); do
          free_mib=$(nvidia-smi --id=0 --query-gpu=memory.free \
            --format=csv,noheader,nounits | tr -d '[:space:]')
          echo "Free V100 memory: $free_mib MiB"
          if (( free_mib >= 28000 )); then exit 0; fi
          if (( attempt < 120 )); then sleep 30; fi
        done
        echo "::error::V100 did not have 28000 MiB free within one hour"
        exit 1
    - name: Paired warmed baseline and FP32 output decode and prefill timing
      shell: bash
      env:
        NINFER_FLASH_NEXT_FP32_ROUTER_INPUT_LAYERS_32_47: '0'
        NINFER_FLASH_NEXT_FP32_ROUTER_INPUT: '0'
        NINFER_FLASH_NEXT_FP32_MOE_ROUTED_INPUT: '0'
        NINFER_FLASH_NEXT_FP32_MOE_SHARED_INPUT: '0'
        NINFER_FLASH_NEXT_CPU_EXPERT_FP32_INTERMEDIATE: '0'
        NINFER_FLASH_NEXT_MOE_SHARED_FP32_INTERMEDIATE: '0'
        NINFER_WEIGHTS: /models/qwen3-8b-flash-next
        NINFER_FLASH_NEXT_ORACLE_MANIFEST: /oracle/phase11/manifest.json
        NINFER_FLASH_NEXT_CPU_EXPERT_WORKERS: '32'
        NINFER_FLASH_NEXT_CPU_EXPERT_BACKEND: reference
        NINFER_FLASH_NEXT_FP32_HYPER_STATE: '1'
        NINFER_FLASH_NEXT_FP32_GDN_CONV: '1'
        NINFER_FLASH_NEXT_FP32_GDN_PROJECTION: '1'
        NINFER_FLASH_NEXT_FP32_GDN_READOUT: '1'
        NINFER_FLASH_NEXT_FP32_GDN_GATE: '1'
        NINFER_FLASH_NEXT_FP32_GDN_OUTPUT: '1'
        NINFER_FLASH_NEXT_FP32_GDN_OUTPUT_INPUT: '1'
        NINFER_FLASH_NEXT_FP32_HYPER_INJECT_INPUT: '1'
        NINFER_FLASH_NEXT_FP32_HYPER_INJECT_APPLY: '1'
        NINFER_FLASH_NEXT_FP32_MLP_HYPER_OUTPUT: '1'
        NINFER_FLASH_NEXT_FP32_MLP_HYPER_INPUT: '1'
        NINFER_FLASH_NEXT_FP32_MLP_HYPER_NORMALIZED: '1'
        NINFER_FLASH_NEXT_FP32_MLP_HYPER_LOW_RANK: '1'
        NINFER_FLASH_NEXT_FP32_MLP_HYPER_APPLY: '1'
        NINFER_FLASH_NEXT_FP32_MLP_HYPER_INJECTION: '1'
        NINFER_FLASH_NEXT_FP32_MOE_OUTPUT: '1'
        NINFER_PHASE11_MOE_OUTPUT_BENCHMARK: '1'
      run: |
        mkdir -p full-corpus
        unset NINFER_PHASE11_REPLAY_ORACLE_ROUTER_IDS NINFER_PHASE11_REPLAY_ORACLE_ROUTER_SCOPE NINFER_PHASE11_STAGE_ORACLE_ROOT NINFER_PHASE11_TRACE_POSITIONS
        set -euo pipefail
        unset NINFER_PHASE11_LOGITS_EXPORT_ROOT NINFER_PHASE11_ORACLE_SMOKE_POSITIONS NINFER_PHASE11_PREFILL_PROBE_POSITIONS
        ctest --test-dir build-precision-v100 -V \
          -R '^ninfer_qwen3_8_flash_next_vertical_slice_real_test$' \
          2>&1 | tee full-corpus/timing.log
        "$PRECISION_PYTHON" tools/reference/qwen3_8_flash_next/oracle/summarize_moe_output_timing.py full-corpus/timing.log full-corpus/timing.json
    - name: Check original 32-thread full FP32 oracle against frozen 4096
      shell: bash
      env:
        NINFER_ORACLE_THREADS: '32'
        OMP_NUM_THREADS: '32'
        MKL_NUM_THREADS: '32'
        OPENBLAS_NUM_THREADS: '32'
        NUMEXPR_NUM_THREADS: '32'
        CUDA_VISIBLE_DEVICES: ''
      run: |
        set -euo pipefail
        mkdir -p oracle-consistency/thread32
        "$PRECISION_PYTHON" tools/reference/qwen3_8_flash_next/oracle/check_full_oracle_consistency.py \
          --model-dir /srv/ninfer/source/mixed \
          --ple-dir /srv/ninfer/source/ple/ples_int4 \
          --oracle-root /oracle/phase11 \
          --out-dir oracle-consistency/thread32 2>&1 | tee oracle-consistency/thread32/run.log
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: phase11-full-oracle-consistency-thread32-4096
        path: |-
          oracle-consistency/thread32/*.json
          oracle-consistency/thread32/*.csv
          oracle-consistency/thread32/run.log
        if-no-files-found: warn
        retention-days: 21
    - name: Run matching natural FP32 MoE output CPU profile over 4096 prefixes
      shell: bash
      env:
        CUDA_VISIBLE_DEVICES: ''
      run: |
        set -euo pipefail
        mkdir -p full-corpus
        "$PRECISION_PYTHON" tools/reference/qwen3_8_flash_next/oracle/compare_moe_output_fp32.py \
          --model-dir "$PRECISION_MODEL_DIR" --ple-dir "$PRECISION_PLE_DIR" \
          --oracle-root /oracle/phase11 --out-dir full-corpus 2>&1 | tee full-corpus/cpu-run.log
        test "$(find full-corpus/cpu-logits -name '*.bf16' | wc -l)" -eq 4096
    - name: Run natural FP32 MoE output V100 over all 4096 oracle positions
      shell: bash
      env:
        NINFER_FLASH_NEXT_FP32_ROUTER_INPUT_LAYERS_32_47: '0'
        NINFER_FLASH_NEXT_FP32_ROUTER_INPUT: '0'
        NINFER_FLASH_NEXT_FP32_MOE_ROUTED_INPUT: '0'
        NINFER_FLASH_NEXT_FP32_MOE_SHARED_INPUT: '0'
        NINFER_FLASH_NEXT_CPU_EXPERT_FP32_INTERMEDIATE: '0'
        NINFER_FLASH_NEXT_MOE_SHARED_FP32_INTERMEDIATE: '0'
        NINFER_WEIGHTS: /models/qwen3-8b-flash-next
        NINFER_FLASH_NEXT_ORACLE_MANIFEST: /oracle/phase11/manifest.json
        NINFER_FLASH_NEXT_CPU_EXPERT_WORKERS: '32'
        NINFER_FLASH_NEXT_CPU_EXPERT_BACKEND: reference
        NINFER_FLASH_NEXT_FP32_HYPER_STATE: '1'
        NINFER_FLASH_NEXT_FP32_GDN_CONV: '1'
        NINFER_FLASH_NEXT_FP32_GDN_PROJECTION: '1'
        NINFER_FLASH_NEXT_FP32_GDN_READOUT: '1'
        NINFER_FLASH_NEXT_FP32_GDN_GATE: '1'
        NINFER_FLASH_NEXT_FP32_GDN_OUTPUT: '1'
        NINFER_FLASH_NEXT_FP32_GDN_OUTPUT_INPUT: '1'
        NINFER_FLASH_NEXT_FP32_HYPER_INJECT_INPUT: '1'
        NINFER_FLASH_NEXT_FP32_HYPER_INJECT_APPLY: '1'
        NINFER_FLASH_NEXT_FP32_MLP_HYPER_OUTPUT: '1'
        NINFER_FLASH_NEXT_FP32_MLP_HYPER_INPUT: '1'
        NINFER_FLASH_NEXT_FP32_MLP_HYPER_NORMALIZED: '1'
        NINFER_FLASH_NEXT_FP32_MLP_HYPER_LOW_RANK: '1'
        NINFER_FLASH_NEXT_FP32_MLP_HYPER_APPLY: '1'
        NINFER_FLASH_NEXT_FP32_MLP_HYPER_INJECTION: '1'
        NINFER_FLASH_NEXT_FP32_MOE_OUTPUT: '1'
      run: |
        unset NINFER_PHASE11_REPLAY_ORACLE_ROUTER_IDS NINFER_PHASE11_REPLAY_ORACLE_ROUTER_SCOPE NINFER_PHASE11_STAGE_ORACLE_ROOT NINFER_PHASE11_TRACE_POSITIONS
        unset NINFER_PHASE11_ORACLE_SMOKE_POSITIONS NINFER_PHASE11_PREFILL_PROBE_POSITIONS NINFER_PHASE11_MOE_OUTPUT_BENCHMARK NINFER_PHASE11_ROUTER_MEMBERSHIP_REPLAY_ROOT
        set -euo pipefail
        export NINFER_PHASE11_LOGITS_EXPORT_ROOT="$GITHUB_WORKSPACE/full-corpus/v100-logits"
        set +e
        ctest --test-dir build-precision-v100 -V \
          -R '^ninfer_qwen3_8_flash_next_vertical_slice_real_test$' \
          2>&1 | tee full-corpus/v100-test.log
        status=${PIPESTATUS[0]}
        set -e
        echo "$status" > full-corpus/v100-test-exit-code.txt
        echo "Unchanged 4096-position V100 CTest exit status: $status"
        test "$(find full-corpus/v100-logits -name '*.bf16' | wc -l)" -eq 4096
        grep -q 'phase11.host_expert.fp32_output_layer_calls=196608' full-corpus/v100-test.log
        grep -q 'phase11.host_expert.completed_layer_calls=196608' full-corpus/v100-test.log
    - name: Compare FP32 oracle, matching CPU profile, and modified V100
      shell: bash
      run: |
        set -euo pipefail
        "$PRECISION_PYTHON" tools/reference/qwen3_8_flash_next/oracle/compare_full_prefix.py \
          --oracle-root /oracle/phase11 \
          --cpu-root full-corpus \
          --v100-root full-corpus \
          --natural-baseline frozen-three-way/report/per_position.csv \
          --profile-description 'FP32 combined MoE output into master hyper state; unchanged BF16 router/expert inputs; natural routing' \
          --out-dir full-corpus/report \
          | tee full-corpus/comparison.log
        cp full-corpus/v100-test-exit-code.txt full-corpus/report/
        grep -E 'phase11.(mean_kl|p99_kl|top1_agreement|relative_mean_nll_delta|host_expert)' \
           full-corpus/v100-test.log > full-corpus/report/v100-gate-metrics.txt || true
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: phase11-v100-moe-output-4096
        path: |-
          full-corpus/report
          full-corpus/summary.json
          full-corpus/per_position.csv
          full-corpus/cpu-run.log
          full-corpus/cpu-vs-oracle.jsonl
          full-corpus/comparison.log
          full-corpus/v100-test.log

          full-corpus/timing.log
          full-corpus/timing.json
          full-corpus/v100-test-exit-code.txt
        if-no-files-found: ignore
        retention-days: 21
'on':
  push:
    branches:
    - work/precision-matched-reference
    paths:
    - .github/workflows/precision-v100-moe-output-4096.yml

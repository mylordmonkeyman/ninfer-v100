name: V100 Phase 16 Pinned Fill Staging
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v100-phase16-hybrid
  cancel-in-progress: false
jobs:
  pinned-staging:
    runs-on: [self-hosted, v100, sm70, cuda-12-8, ninfer-phase11]
    timeout-minutes: 180
    env:
      NINFER_WEIGHTS: /models/qwen3-8b-flash-next
      NINFER_FLASH_NEXT_ORACLE_MANIFEST: /oracle/phase11/manifest.json
      NINFER_FLASH_NEXT_CPU_EXPERT_WORKERS: '32'
      NINFER_FLASH_NEXT_CPU_EXPERT_BACKEND: auto
      NINFER_FLASH_NEXT_FP32_HYPER_STATE: '1'
      NINFER_FLASH_NEXT_FP32_GDN_CONV: '1'
      NINFER_FLASH_NEXT_FP32_GDN_PROJECTION: '1'
      NINFER_FLASH_NEXT_FP32_GDN_READOUT: '1'
      NINFER_FLASH_NEXT_FP32_GDN_GATE: '1'
      NINFER_FLASH_NEXT_FP32_GDN_OUTPUT: '1'
      NINFER_FLASH_NEXT_FP32_GDN_OUTPUT_INPUT: '1'
      NINFER_FLASH_NEXT_FP32_HYPER_INJECT_INPUT: '1'
      NINFER_FLASH_NEXT_FP32_HYPER_INJECT_APPLY: '1'
      NINFER_FLASH_NEXT_FP32_MLP_HYPER_OUTPUT: '1'
      NINFER_FLASH_NEXT_FP32_MLP_HYPER_INPUT: '1'
      NINFER_FLASH_NEXT_FP32_MLP_HYPER_NORMALIZED: '1'
      NINFER_FLASH_NEXT_FP32_MLP_HYPER_LOW_RANK: '1'
      NINFER_FLASH_NEXT_FP32_MLP_HYPER_APPLY: '1'
      NINFER_FLASH_NEXT_FP32_MLP_HYPER_INJECTION: '1'
      NINFER_FLASH_NEXT_FP32_MOE_OUTPUT: '1'
      NINFER_FLASH_NEXT_FP32_ROUTER_INPUT: '0'
      NINFER_FLASH_NEXT_FP32_ROUTER_INPUT_LAYERS_32_47: '0'
      NINFER_FLASH_NEXT_FP32_MOE_ROUTED_INPUT: '0'
      NINFER_FLASH_NEXT_FP32_MOE_SHARED_INPUT: '0'
      NINFER_FLASH_NEXT_CPU_EXPERT_FP32_INTERMEDIATE: '0'
      NINFER_FLASH_NEXT_MOE_SHARED_FP32_INTERMEDIATE: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          # Replay the measured candidate; active runtime retains ordinary staging.
          ref: b4b9f70f37bf2bc489f542b92e4426855693c4e0
          submodules: recursive
          persist-credentials: false
      - name: Build hybrid scheduler checks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p phase16-results
          nvidia-smi > phase16-results/gpu.txt
          cmake -S . -B build-phase16 -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CUDA_COMPILER=/usr/local/cuda-12.8/bin/nvcc \
            -DCMAKE_CUDA_ARCHITECTURES=70 -DNINFER_BUILD_MEDIA=OFF \
            -DNINFER_BUILD_APPS=OFF -DNINFER_BUILD_BENCHMARKS=OFF -DBUILD_TESTING=ON
          cmake --build build-phase16 -j --target \
            ninfer_qwen3_8_flash_next_expert_cache_test \
            ninfer_qwen3_8_flash_next_vertical_slice_real_test \
            ninfer_qwen3_8_flash_next_text_decode_test
      - name: Both pinned modes payload oracle joins and lifetime checks
        shell: bash
        run: |
          set -euo pipefail
          for wc in 0 1; do
            NINFER_FLASH_NEXT_EXPERT_CACHE_FILL_WRITE_COMBINED="$wc" \
            NINFER_FLASH_NEXT_EXPERT_CACHE_TIMING=1 \
              ctest --test-dir build-phase16 -V \
              -R '^ninfer_qwen3_8_flash_next_(expert_cache|text_decode)_test$' \
              | tee "phase16-results/cache-tests-$wc.log"
          done
          NINFER_FLASH_NEXT_EXPERT_CACHE_FILL_WRITE_COMBINED=1 \
            compute-sanitizer --tool memcheck --error-exitcode 1 \
            build-phase16/tests/ninfer_qwen3_8_flash_next_expert_cache_test \
            > phase16-results/cache-memcheck.log 2>&1
      - name: Admission active pinned staging ABBA and fixed cache controls
        shell: bash
        env:
          NINFER_PHASE11_ORACLE_SMOKE_POSITIONS: '128'
          NINFER_PHASE15_BENCHMARK: '1'
          NINFER_PHASE16_BENCHMARK: '1'
          NINFER_FLASH_NEXT_EXPERT_CACHE_TIMING: '1'
          NINFER_FLASH_NEXT_EXPERT_CACHE: '1'
          NINFER_FLASH_NEXT_EXPERT_CACHE_MAX_SLOTS: '512'
          NINFER_FLASH_NEXT_EXPERT_CACHE_ADMISSION_CAP: '1'
        run: |
          set -euo pipefail
          # Change only the upload buffer mode. Keep full derived capacity/cap one.
          configs=(0 1 1 0)
          for i in "${!configs[@]}"; do
            wc="${configs[$i]}"
            NINFER_FLASH_NEXT_EXPERT_CACHE_FILL_WRITE_COMBINED="$wc" \
              build-phase16/tests/ninfer_qwen3_8_flash_next_vertical_slice_real_test \
              > "phase16-results/$i-wc$wc.log" 2>&1
            cat "phase16-results/$i-wc$wc.log"
            grep -q 'PASS: Phase 15 active admission, finite logits, fixed-cache exact schedule parity' \
              "phase16-results/$i-wc$wc.log"
            grep -q 'PASS: Phase 16 decode-warmed prefill exact schedule parity' \
              "phase16-results/$i-wc$wc.log"
          done
      - name: Preserve scheduler evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase16-pinned-staging
          path: phase16-results
          retention-days: 30

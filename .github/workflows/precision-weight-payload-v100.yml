name: Phase 11 V100 Weight Audit

on:
  push:
    branches:
      - work/precision-matched-reference
    paths:
      - .github/workflows/precision-weight-payload-v100.yml

permissions:
  actions: read
  contents: read

jobs:
  gpu-memory-probe:
    if: contains(github.event.head_commit.message, '[v100-weight-probe]')
    runs-on: [self-hosted, v100, sm70, cuda-12-8, ninfer-phase11]
    timeout-minutes: 5
    steps:
      - name: Inspect device enumeration and memory check
        run: |
          set -euo pipefail
          nvidia-smi --query-gpu=index,name,uuid,pci.bus_id,memory.total,memory.used,memory.free \
            --format=csv,noheader,nounits
          for device_id in 0 1; do
            echo "device_id=$device_id"
            nvidia-smi --id="$device_id" \
              --query-gpu=index,name,memory.total,memory.used,memory.free \
              --format=csv,noheader,nounits
          done
          free_mib=$(nvidia-smi --id=0 --query-gpu=memory.free \
            --format=csv,noheader,nounits | tr -d '[:space:]')
          printf 'original_check_free_mib=%q threshold=28000\n' "$free_mib"
          if (( free_mib >= 28000 )); then
            echo 'Original memory check: pass'
          else
            echo 'Original memory check: fail'
          fi
  prepared-artifact-audit:
    if: '!contains(github.event.head_commit.message, ''[v100-weight-device]'') && !contains(github.event.head_commit.message, ''[v100-weight-probe]'')'
    runs-on: [self-hosted, v100, sm70, cuda-12-8, ninfer-phase11]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Compare prepared artifact planes with pinned source tensors
        run: |
          set -euo pipefail
          test -s /srv/ninfer/source/mixed/model.safetensors.index.json
          test -r /models/qwen3-8b-flash-next
          PYTHONPATH="$GITHUB_WORKSPACE" python3 \
            tools/reference/qwen3_8_flash_next/oracle/verify_v100_weight_payload.py \
            --source-root /srv/ninfer/source/mixed \
            --candidate-artifact /models/qwen3-8b-flash-next \
            --report prepared-artifact-summary.json \
            > prepared-artifact.log 2>&1 || {
              cat prepared-artifact.log
              exit 1
            }
          cat prepared-artifact.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: v100-prepared-weight-audit
          path: |
            prepared-artifact.log
            prepared-artifact-summary.json
          if-no-files-found: ignore
          retention-days: 14
  loaded-weight-audit:
    if: contains(github.event.head_commit.message, '[v100-weight-device]')
    runs-on: [self-hosted, v100, sm70, cuda-12-8, ninfer-phase11]
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build real-model diagnostic
        run: |
          set -euo pipefail
          cmake -S . -B build-precision-v100 -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_CUDA_COMPILER=/usr/local/cuda-12.8/bin/nvcc \
            -DCMAKE_CUDA_ARCHITECTURES=70 \
            -DNINFER_BUILD_MEDIA=OFF -DNINFER_BUILD_APPS=OFF \
            -DNINFER_BUILD_BENCHMARKS=OFF -DBUILD_TESTING=ON
          cmake --build build-precision-v100 -j --target \
            ninfer_qwen3_8_flash_next_vertical_slice_real_test
      - name: Wait for free V100 memory
        timeout-minutes: 19
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            free_mib=$(nvidia-smi --id=0 --query-gpu=memory.free \
              --format=csv,noheader,nounits | tr -d '[:space:]')
            if (( free_mib >= 28000 )); then exit 0; fi
            if (( attempt < 30 )); then sleep 30; fi
          done
          exit 1
      - name: Compare loaded device planes with pinned source tensors
        # This diagnostic exits after model loading, before the qualification gate.
        env:
          NINFER_WEIGHTS: /models/qwen3-8b-flash-next
          NINFER_FLASH_NEXT_ORACLE_MANIFEST: /oracle/phase11/manifest.json
          NINFER_PHASE11_ORACLE_SMOKE_POSITIONS: "14"
          NINFER_PHASE11_WEIGHT_AUDIT_ROOT: ${{ github.workspace }}/weight-audit
        run: |
          set -euo pipefail
          test -s /srv/ninfer/source/mixed/model.safetensors.index.json
          ctest --test-dir build-precision-v100 -V \
            -R '^ninfer_qwen3_8_flash_next_vertical_slice_real_test$' \
            > weight-audit.log 2>&1
          PYTHONPATH="$GITHUB_WORKSPACE" python3 \
            tools/reference/qwen3_8_flash_next/oracle/verify_v100_weight_payload.py \
            --source-root /srv/ninfer/source/mixed \
            --candidate-root weight-audit \
            --report weight-audit-summary.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: v100-loaded-weight-audit
          path: |
            weight-audit.log
            weight-audit-summary.json
          if-no-files-found: ignore
          retention-days: 14

name: Phase 11 CPU Hyper Injection Boundary

on:
  push:
    branches:
      - work/precision-matched-reference
    paths:
      - .github/workflows/precision-hyper-injection-cpu.yml

permissions:
  actions: read
  contents: read

concurrency:
  group: phase11-cpu-injection-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cpu-reference-14:
    name: CPU-only 14-position reference
    runs-on:
      - self-hosted
      - v100
      - sm70
      - cuda-12-8
      - ninfer-phase11
    timeout-minutes: 360
    env:
      CUDA_VISIBLE_DEVICES: ""
      NINFER_ORACLE_DETERMINISTIC: "1"
      NINFER_ORACLE_THREADS: "16"
      OMP_NUM_THREADS: "16"
      MKL_NUM_THREADS: "16"
      OPENBLAS_NUM_THREADS: "16"
      NUMEXPR_NUM_THREADS: "16"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Locate read-only input assets and CPU Python
        shell: bash
        run: |
          set -euo pipefail
          echo 'Mounted data path availability:'
          for root in /models /oracle /srv/ninfer/source /srv/ninfer/oracle \
              /home/runner/ninfer-v100; do
            if [[ -d "$root" ]]; then
              echo "Directory: $root"
              find "$root" -maxdepth 3 -type f \( -name model.safetensors.index.json \
                  -o -name 'shard_*.safetensors' -o -name token_ids.json \) \
                  -print -quit 2>/dev/null || true
            else
              echo "Absent: $root"
            fi
          done
          model_dir="${NINFER_PHASE11_MODEL_DIR:-/srv/ninfer/source/mixed}"
          ple_dir="${NINFER_PHASE11_PLE_DIR:-/srv/ninfer/source/ple/ples_int4}"
          oracle_dir="${NINFER_PHASE11_STAGE_ORACLE_ROOT:-/oracle/phase11-stage-trace14}"
          ids_file="${NINFER_PHASE11_IDS_FILE:-/oracle/phase11/token_ids.json}"
          missing=0
          for path in "$model_dir/model.safetensors.index.json" "$ple_dir" \
              "$oracle_dir/manifest.json" "$ids_file"; do
            if [[ ! -r "$path" ]]; then
              echo "::error::Missing readable CPU reference input: $path"
              missing=1
              continue
            fi
            echo "Readable: $path"
          done
          python_bin="${NINFER_PHASE11_PYTHON:-}"
          if [[ -z "$python_bin" ]]; then
            for candidate in "$GITHUB_WORKSPACE/venv-oracle/bin/python" \
                "$HOME/ninfer-v100/venv-oracle/bin/python" \
                /srv/ninfer/venv-oracle/bin/python python3; do
              if command -v "$candidate" >/dev/null 2>&1 && \
                  "$candidate" -c 'import numpy, torch, transformers, safetensors' >/dev/null 2>&1; then
                python_bin="$candidate"
                break
              fi
            done
          fi
          if (( missing )); then exit 1; fi
          {
            echo "PRECISION_PYTHON=$python_bin"
            echo "PRECISION_MODEL_DIR=$model_dir"
            echo "PRECISION_PLE_DIR=$ple_dir"
            echo "PRECISION_ORACLE_DIR=$oracle_dir"
            echo "PRECISION_IDS_FILE=$ids_file"
          } >> "$GITHUB_ENV"

      - name: Prepare CPU Python if needed
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$PRECISION_PYTHON" ]]; then
            echo "CPU Python: $PRECISION_PYTHON"
            exit 0
          fi
          python3 -m venv "$GITHUB_WORKSPACE/precision-venv"
          "$GITHUB_WORKSPACE/precision-venv/bin/pip" install \
            torch --index-url https://download.pytorch.org/whl/cpu
          "$GITHUB_WORKSPACE/precision-venv/bin/pip" install \
            numpy safetensors 'transformers>=5.16,<6'
          echo "PRECISION_PYTHON=$GITHUB_WORKSPACE/precision-venv/bin/python" >> "$GITHUB_ENV"

      - name: Recompute three 14-position prefixes and compare stages
        shell: bash
        run: |
          set -euo pipefail
          "$PRECISION_PYTHON" tests/targets/qwen3_8_flash_next/test_precision_profile.py
          "$PRECISION_PYTHON" tests/targets/qwen3_8_flash_next/test_precision_trace_compare.py
          "$PRECISION_PYTHON" tools/reference/qwen3_8_flash_next/oracle/run_precision_reference.py \
            --model-dir "$PRECISION_MODEL_DIR" \
            --ple-dir "$PRECISION_PLE_DIR" \
            --ids-file "$PRECISION_IDS_FILE" \
            --fp32-oracle "$PRECISION_ORACLE_DIR" \
            --positions 14 \
            --trace-hyper-layer0 \
            --trace-gdn-internals \
            --out-dir "$GITHUB_WORKSPACE/precision-reference-results"

      # Internal reference stages are labeled incremental FP32; frozen logits still gate parity.
      - name: Reconstruct CPU layer-zero attention injection at position 12
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYREPORT' > cpu-injection-report.txt
          from array import array
          import json
          import math
          from pathlib import Path
          root = Path('precision-reference-results')
          for profile in ('fp32', 'v100-phase11-storage'):
              folder = root/profile/'pos0012'
              def read(stage):
                  a = array('f')
                  a.frombytes((folder/stage).read_bytes())
                  return a
              before = read('L00_hyper_before_attn.bin')
              after = read('L00_hyper_after_attn.bin')
              output = read('L00_attn_block_output.bin')
              gates = read('L00_attn_injection.bin')
              embedding = read('embedding.bin')
              assert len(before)==len(after)==10240 and len(output)==len(embedding)==2560
              assert len(gates)==4
              print('profile',profile)
              for stream in range(4):
                  offset=stream*2560
                  observed = [float(after[offset+i])-float(before[offset+i])
                              for i in range(2560)]
                  delta = [float(output[i])*float(gates[stream]) for i in range(2560)]
                  norm = math.sqrt(math.fsum(float(y)**2 for y in output))
                  resid = math.sqrt(math.fsum((x-y)**2 for x,y in zip(observed,delta)))/norm
                  initial = math.sqrt(math.fsum((float(before[offset+i])-float(embedding[i]))**2
                                           for i in range(2560)))/max(math.sqrt(math.fsum(float(e)**2 for e in embedding)),1e-12)
                  print('stream',stream,'gate',float(gates[stream]),
                        'update_residual',resid,'prestate_vs_embedding',initial,flush=True)
          PYREPORT
          cat cpu-injection-report.txt

      - name: Upload compact CPU comparison
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cpu-hyper-injection-summary-14
          path: cpu-injection-report.txt
          if-no-files-found: ignore
          retention-days: 14

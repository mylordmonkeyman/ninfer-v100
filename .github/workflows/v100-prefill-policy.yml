name: V100 Prefill Policy
on:
  push:
    branches: [forwardport/v100-flash-next]
    paths:
      - 'src/targets/qwen3_8_flash_next/impl/**'
      - 'tests/targets/qwen3_8_flash_next/**'
      - '.github/workflows/v100-prefill-policy.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v100-prefill-policy
  cancel-in-progress: false
jobs:
  prefill-policy:
    runs-on: [self-hosted, v100, sm70, cuda-12-8, ninfer-phase11]
    timeout-minutes: 180
    env:
      NINFER_WEIGHTS: /models/qwen3-8b-flash-next
      NINFER_FLASH_NEXT_ORACLE_MANIFEST: /oracle/phase11/manifest.json
      NINFER_FLASH_NEXT_CPU_EXPERT_WORKERS: '32'
      NINFER_FLASH_NEXT_CPU_EXPERT_BACKEND: auto
      NINFER_FLASH_NEXT_FP32_HYPER_STATE: '1'
      NINFER_FLASH_NEXT_FP32_GDN_CONV: '1'
      NINFER_FLASH_NEXT_FP32_GDN_PROJECTION: '1'
      NINFER_FLASH_NEXT_FP32_GDN_READOUT: '1'
      NINFER_FLASH_NEXT_FP32_GDN_GATE: '1'
      NINFER_FLASH_NEXT_FP32_GDN_OUTPUT: '1'
      NINFER_FLASH_NEXT_FP32_GDN_OUTPUT_INPUT: '1'
      NINFER_FLASH_NEXT_FP32_HYPER_INJECT_INPUT: '1'
      NINFER_FLASH_NEXT_FP32_HYPER_INJECT_APPLY: '1'
      NINFER_FLASH_NEXT_FP32_MLP_HYPER_OUTPUT: '1'
      NINFER_FLASH_NEXT_FP32_MLP_HYPER_INPUT: '1'
      NINFER_FLASH_NEXT_FP32_MLP_HYPER_NORMALIZED: '1'
      NINFER_FLASH_NEXT_FP32_MLP_HYPER_LOW_RANK: '1'
      NINFER_FLASH_NEXT_FP32_MLP_HYPER_APPLY: '1'
      NINFER_FLASH_NEXT_FP32_MLP_HYPER_INJECTION: '1'
      NINFER_FLASH_NEXT_FP32_MOE_OUTPUT: '1'
      NINFER_FLASH_NEXT_FP32_ROUTER_INPUT: '0'
      NINFER_FLASH_NEXT_FP32_ROUTER_INPUT_LAYERS_32_47: '0'
      NINFER_FLASH_NEXT_FP32_MOE_ROUTED_INPUT: '0'
      NINFER_FLASH_NEXT_FP32_MOE_SHARED_INPUT: '0'
      NINFER_FLASH_NEXT_CPU_EXPERT_FP32_INTERMEDIATE: '0'
      NINFER_FLASH_NEXT_MOE_SHARED_FP32_INTERMEDIATE: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive
          persist-credentials: false
      - name: Build and focused correctness checks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p prefill-results
          nvidia-smi > prefill-results/gpu.txt
          cmake -S . -B build-prefill -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CUDA_COMPILER=/usr/local/cuda-12.8/bin/nvcc \
            -DCMAKE_CUDA_ARCHITECTURES=70 -DNINFER_BUILD_MEDIA=OFF \
            -DNINFER_BUILD_APPS=OFF -DNINFER_BUILD_BENCHMARKS=OFF -DBUILD_TESTING=ON
          cmake --build build-prefill -j --target \
            ninfer_qwen3_8_flash_next_expert_cache_test \
            ninfer_qwen3_8_flash_next_vertical_slice_real_test \
            ninfer_qwen3_8_flash_next_text_decode_test
          ctest --test-dir build-prefill -V \
            -R '^ninfer_qwen3_8_flash_next_(expert_cache|text_decode)_test$' \
            > prefill-results/unit-tests.log 2>&1
          compute-sanitizer --tool memcheck --error-exitcode 1 \
            build-prefill/tests/ninfer_qwen3_8_flash_next_expert_cache_test \
            > prefill-results/cache-memcheck.log 2>&1
      - name: Natural short and longer prompts with following generation
        shell: bash
        env:
          NINFER_PHASE11_ORACLE_SMOKE_POSITIONS: '1056'
          NINFER_PREFILL_POLICY_BENCHMARK: '1'
          NINFER_PREFILL_POLICY_GROUPED: '1'
          NINFER_FLASH_NEXT_EXPERT_CACHE_TIMING: '1'
        run: |
          set -euo pipefail
          configs=(1 1)
          for i in "${!configs[@]}"; do
            NINFER_FLASH_NEXT_EXPERT_CACHE="${configs[$i]}" \
              build-prefill/tests/ninfer_qwen3_8_flash_next_vertical_slice_real_test \
              > "prefill-results/$i-cache${configs[$i]}.log" 2>&1
            cat "prefill-results/$i-cache${configs[$i]}.log"
            grep -q 'PASS: prefill policy natural routing' "prefill-results/$i-cache${configs[$i]}.log"
          done
      - name: Admission active prefill and following generation
        shell: bash
        env:
          NINFER_PHASE11_ORACLE_SMOKE_POSITIONS: '1056'
          NINFER_PREFILL_POLICY_BENCHMARK: '1'
          NINFER_PREFILL_POLICY_ACTIVE: '1'
          NINFER_PREFILL_POLICY_GROUPED: '1'
          NINFER_FLASH_NEXT_EXPERT_CACHE: '1'
          NINFER_FLASH_NEXT_EXPERT_CACHE_TIMING: '1'
        run: |
          set -euo pipefail
          build-prefill/tests/ninfer_qwen3_8_flash_next_vertical_slice_real_test \
            > prefill-results/active.log 2>&1
          cat prefill-results/active.log
          grep -q 'PASS: prefill policy natural routing' prefill-results/active.log
      - name: Separate eager launch and kernel profile when Nsight is available
        shell: bash
        env:
          NINFER_PHASE11_ORACLE_SMOKE_POSITIONS: '160'
          NINFER_PREFILL_POLICY_BENCHMARK: '1'
          NINFER_PREFILL_POLICY_PROFILE: '1'
          NINFER_FLASH_NEXT_EXPERT_CACHE: '1'
          NINFER_FLASH_NEXT_EXPERT_CACHE_TIMING: '1'
        run: |
          set -euo pipefail
          if ! command -v nsys >/dev/null 2>&1; then
            for binary in /opt/nvidia/nsight-systems/*/bin/nsys /usr/local/cuda-12.8/bin/nsys; do
              if [[ -x "$binary" ]]; then export PATH="$(dirname "$binary"):$PATH"; break; fi
            done
          fi
          if command -v nsys >/dev/null 2>&1; then
            nsys profile --trace=cuda --sample=none --cpuctxsw=none \
              --capture-range=cudaProfilerApi --capture-range-end=stop \
              --force-overwrite=true -o prefill-results/eager \
              build-prefill/tests/ninfer_qwen3_8_flash_next_vertical_slice_real_test \
              > prefill-results/profile.log 2>&1
            nsys stats --report cuda_api_sum,cuda_gpu_kern_sum,cuda_gpu_mem_time_sum \
              prefill-results/eager.nsys-rep > prefill-results/profile-summary.txt 2>&1
          else
            echo 'Nsight unavailable; hit submission timers include driver backpressure and are not isolated launch overhead.' \
              > prefill-results/profile-summary.txt
          fi
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: prefill-policy
          path: prefill-results
          retention-days: 30

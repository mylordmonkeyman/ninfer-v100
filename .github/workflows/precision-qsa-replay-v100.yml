name: Phase 11 V100 Layer 15 QSA Replay

on:
  push:
    branches:
      - work/precision-matched-reference
    paths:
      - .github/workflows/precision-qsa-replay-v100.yml

permissions:
  contents: read

jobs:
  replay:
    runs-on: [self-hosted, v100, sm70, cuda-12-8, ninfer-phase11]
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build real-model test
        run: |
          set -euo pipefail
          test -r /models/qwen3-8b-flash-next
          test -r /oracle/phase11-stage-trace14/pos0002/L15_qsa_gated.bin
          test -r /oracle/phase11-stage-trace14/pos0002/L15_attn_block_output.bin
          cmake -S . -B build-precision-v100 -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_CUDA_COMPILER=/usr/local/cuda-12.8/bin/nvcc \
            -DCMAKE_CUDA_ARCHITECTURES=70 \
            -DNINFER_BUILD_MEDIA=OFF \
            -DNINFER_BUILD_APPS=OFF \
            -DNINFER_BUILD_BENCHMARKS=OFF \
            -DBUILD_TESTING=ON
          cmake --build build-precision-v100 -j --target \
            ninfer_qwen3_8_flash_next_vertical_slice_real_test
      - name: Wait for free V100 memory
        timeout-minutes: 19
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            free_mib=$(nvidia-smi --id=0 --query-gpu=memory.free \
              --format=csv,noheader,nounits | tr -d '[:space:]')
            echo "V100 free memory: ${free_mib} MiB (attempt ${attempt}/30)"
            if (( free_mib >= 28000 )); then exit 0; fi
            if (( attempt < 30 )); then sleep 30; fi
          done
          echo '::error::V100 needs at least 28000 MiB free'
          exit 1
      - name: Replay layer 15 with two oracle injection points
        env:
          NINFER_WEIGHTS: /models/qwen3-8b-flash-next
          NINFER_FLASH_NEXT_ORACLE_MANIFEST: /oracle/phase11/manifest.json
          NINFER_PHASE11_ORACLE_SMOKE_POSITIONS: "3"
          NINFER_FLASH_NEXT_CPU_EXPERT_WORKERS: "32"
          NINFER_FLASH_NEXT_CPU_EXPERT_BACKEND: reference
          NINFER_PHASE11_STAGE_ORACLE_ROOT: /oracle/phase11-stage-trace14
          NINFER_PHASE11_STAGE_ORACLE_POSITION: "2"
          NINFER_PHASE11_TRACE_POSITIONS: "1"
          NINFER_FLASH_NEXT_FP32_HYPER_STATE: "1"
          NINFER_FLASH_NEXT_FP32_GDN_CONV: "1"
          NINFER_FLASH_NEXT_FP32_GDN_PROJECTION: "1"
          NINFER_FLASH_NEXT_FP32_GDN_READOUT: "1"
          NINFER_FLASH_NEXT_FP32_GDN_GATE: "1"
          NINFER_FLASH_NEXT_FP32_GDN_OUTPUT: "1"
          NINFER_FLASH_NEXT_FP32_GDN_OUTPUT_INPUT: "1"
          NINFER_FLASH_NEXT_FP32_HYPER_INJECT_INPUT: "1"
          NINFER_FLASH_NEXT_FP32_HYPER_INJECT_APPLY: "1"
          NINFER_FLASH_NEXT_FP32_MLP_HYPER_OUTPUT: "1"
          NINFER_FLASH_NEXT_FP32_MLP_HYPER_INPUT: "1"
          NINFER_FLASH_NEXT_FP32_MLP_HYPER_NORMALIZED: "1"
          NINFER_FLASH_NEXT_FP32_MLP_HYPER_LOW_RANK: "1"
          NINFER_FLASH_NEXT_FP32_MLP_HYPER_APPLY: "1"
          NINFER_FLASH_NEXT_FP32_MLP_HYPER_INJECTION: "1"
        run: |
          set -euo pipefail
          mkdir -p qsa-replay
          for stage in L15_qsa_gated L15_attn_block_output; do
            export NINFER_PHASE11_ORACLE_INJECT_STAGE="$stage"
            set +e
            ctest --test-dir build-precision-v100 -V \
              -R '^ninfer_qwen3_8_flash_next_vertical_slice_real_test$' \
              > "qsa-replay/${stage}.log" 2>&1
            status=$?
            set -e
            echo "Replay stage: $stage; diagnostic CTest status: $status"
            python3 - "$stage" <<'PY'
          import sys
          from pathlib import Path

          stage = sys.argv[1]
          lines = Path(f'qsa-replay/{stage}.log').read_text().splitlines()
          needles = (
              f'phase11.oracle_injection.position=2 stage={stage} ',
              'phase11.error_decomposition.position=2 stage=L15_qsa_gated ',
              'phase11.error_decomposition.position=2 stage=L15_attn_block_output ',
              'phase11.error_decomposition.position=2 stage=L15_hyper_after_attn ',
              'phase11.error_decomposition.position=2 stage=L15_mlp_block_input_fp32 ',
              'phase11.error_decomposition.position=2 stage=L20_mlp_block_input ',
              'phase11.router_ids_mismatch.position=2 stage=L20_moe_router_ids ',
              'phase11.top1_agreement=', 'phase11.mean_kl=',
          )
          for line in lines:
              if any(needle in line for needle in needles):
                  print(line[:1100])
          if f'phase11.oracle_injection.position=2 stage={stage} ' not in '\n'.join(lines):
              raise SystemExit(f'injection did not occur: {stage}')
          if 'phase11.positions=3' not in '\n'.join(lines):
              raise SystemExit(f'three-position replay did not complete: {stage}')
          PY
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: v100-qsa-layer15-replay
          path: qsa-replay
          if-no-files-found: ignore
          retention-days: 14

name: V100 Telemetry Software Checks
on:
  push:
    branches: [perf/v100-strata-derived]
    paths:
      - '.github/workflows/**'
      - 'tools/telemetry/**'
      - 'tools/diagnostics/**'
      - 'src/targets/qwen3_8_flash_next/impl/**'
      - 'tests/targets/qwen3_8_flash_next/**'
      - 'docs/v100-cross-engine-telemetry-spec.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check Python tooling
        run: |
          python3 -m compileall -q tools/telemetry tools/diagnostics
          python3 -m unittest discover -s tools/diagnostics -p 'test_v100*.py'
          python3 -m unittest discover -s tools/telemetry -p 'test_*.py'
      - name: Check host telemetry and profiles
        run: |
          for test in perf_telemetry expert_heat expert_profile; do
            g++ -std=c++20 -O2 -DNDEBUG -Isrc -Ithird_party \
              "tests/targets/qwen3_8_flash_next/test_${test}.cpp" -o "/tmp/${test}"
            "/tmp/${test}"
          done
          g++ -std=c++20 -O2 -Wall -Wextra -Werror -Isrc \
            tests/targets/qwen3_8_flash_next/test_compare_telemetry.cpp -o /tmp/compare-telemetry
          for level in 1 2; do
            V100_COMPARE_TELEMETRY_LEVEL="$level" /tmp/compare-telemetry \
              > "/tmp/compare-record-$level.json" 2> "/tmp/compare-records-$level.jsonl"
            python3 tools/telemetry/validate_records.py "/tmp/compare-records-$level.jsonl"
            TEST_LEVEL="$level" python3 - <<'PYTEST'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, 'tools/telemetry')
          from validate_records import read_records
          level = int(os.environ['TEST_LEVEL'])
          raw = Path(f'/tmp/compare-records-{level}.jsonl').read_text()
          parsed = [json.loads(line) for line in raw.splitlines()]
          recorded = [layer for record in parsed for layer in record['layers']
                      if 'workers_compact' in layer or 'workers' in layer]
          assert recorded, 'fixture did not exercise actual worker output'
          assert all(('workers_compact' in layer) == (level == 1) for layer in recorded)
          canonical = read_records(f'/tmp/compare-records-{level}.jsonl')
          workers = [worker for record in canonical for layer in record['layers']
                     for worker in layer.get('workers', [])]
          assert workers and sum(w['gate_up_jobs'] for w in workers) == 2
          assert all('workers_compact' not in layer for record in canonical
                     for layer in record['layers'])
          PYTEST
          done
          git diff --check
      - name: Check NInfer CPU outputs and actual worker accounting
        run: |
          g++ -std=c++20 -O2 -pthread -Isrc -Iinclude -Ithird_party \
            tests/targets/qwen3_8_flash_next/test_cpu_expert_group.cpp \
            src/targets/qwen3_8_flash_next/impl/cpu_expert_pool.cpp \
            src/targets/qwen3_8_flash_next/impl/cpu_expert_reference.cpp \
            src/targets/qwen3_8_flash_next/impl/cpu_expert_avx2.cpp \
            src/artifact/storage_layouts.cpp -o /tmp/ninfer-cpu-pool
          for level in 0 1 2; do
            result=0
            V100_COMPARE_TELEMETRY_LEVEL="$level" /tmp/ninfer-cpu-pool \
              > /tmp/ninfer-pool.out 2> /tmp/ninfer-pool.jsonl || result=$?
            if [ "$result" = 77 ]; then
              echo '::notice::NInfer CPU fixture unavailable: AVX2/FMA missing; not qualified here.'
              break
            fi
            if [ "$result" != 0 ]; then cat /tmp/ninfer-pool.out /tmp/ninfer-pool.jsonl; exit "$result"; fi
            python3 tools/telemetry/check_worker_fixture.py ninfer "$level" /tmp/ninfer-pool.jsonl
          done
      - name: Check out frozen Strata CPU telemetry fixture
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: mylordmonkeyman/Strata-V100
          ref: 0430d397d907032fc9ab83c8bb7acff48a935b53
          path: strata-cpu-source
          persist-credentials: false
      - name: Check Strata round ownership and native token traces
        run: |
          g++ -std=c++20 -O2 -Wall -Wextra -Werror -Istrata-cpu-source/include \
            strata-cpu-source/tests/core/compare_round_test.cpp -o /tmp/strata-round-context
          for level in 0 1 2; do
            V100_COMPARE_TELEMETRY_LEVEL="$level" /tmp/strata-round-context \
              2> "/tmp/strata-round-$level.jsonl"
          done
          python3 - <<'PYTEST'
          import sys
          from pathlib import Path
          sys.path.insert(0, 'tools/telemetry')
          from validate_records import read_records
          assert Path('/tmp/strata-round-0.jsonl').read_text() == ''
          for level in (1, 2):
              records = read_records(f'/tmp/strata-round-{level}.jsonl')
              assert [r['status'] for r in records] == ['ok', 'ok', 'failed', 'failed']
              assert records[1]['phase'] == 'prefill'
              routed = records[1]['layers'][0]['counters']
              assert routed['routed_tokens'] == 2 and routed['total_routes'] == 20
              assert not any(k in routed for k in ('resident_routes', 'cpu_routes', 'nonresident_gpu_routes'))
              assert records[0]['round_id'].startswith('strata:caller:')
              context = records[0]['context']
              assert context['spans'][0]['first_token_index'] == 42
              assert ('input_token_ids' in context) == (level == 2)
              if level == 2:
                  assert context['input_token_ids'] == [101, 202]
                  assert context['sampled_token_ids'] == [303, 404]
          PYTEST
      - name: Check Strata CPU outputs and host/worker accounting
        run: |
          source=strata-cpu-source
          g++ -std=c++20 -O2 -I"$source/include" \
            -mavx512f -mavx512bw -mavx512vl -mavx512dq -mavx512vnni -mavx512vbmi -mf16c -mfma \
            -c "$source/src/kernels/cpu/expert.cpp" -o /tmp/strata-expert.o
          g++ -std=c++20 -O2 -I"$source/include" -mavx2 -mfma -mf16c \
            -c "$source/src/kernels/cpu/q2_avx2.cpp" -o /tmp/strata-q2.o
          g++ -std=c++20 -O2 -pthread -I"$source/include" \
            "$source/tests/core/compare_pool_test.cpp" "$source/src/kernels/cpu/pool.cpp" \
            "$source/src/kernels/cpu/expert_layout.cpp" /tmp/strata-expert.o /tmp/strata-q2.o \
            -o /tmp/strata-cpu-pool
          for level in 0 1 2; do
            result=0
            STRATA_POOL_SPIN_US=50 V100_COMPARE_TELEMETRY_LEVEL="$level" /tmp/strata-cpu-pool \
              > /tmp/strata-pool.out 2> /tmp/strata-pool.jsonl || result=$?
            if [ "$result" = 77 ]; then
              echo '::notice::Strata Q2 CPU fixture unavailable: AVX512-VNNI/VBMI missing; not qualified here.'
              break
            fi
            if [ "$result" != 0 ]; then cat /tmp/strata-pool.out /tmp/strata-pool.jsonl; exit "$result"; fi
            python3 tools/telemetry/check_worker_fixture.py strata "$level" /tmp/strata-pool.jsonl
          done
  cuda-host-syntax:
    defaults:
      run:
        shell: bash
    runs-on: ubuntu-24.04
    container: nvidia/cuda:12.8.1-devel-ubuntu24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify container compiler
        run: g++ --version
      - name: Compile changed CUDA host code without acquiring a GPU
        run: |
          includes=(-Iinclude -Isrc -Ithird_party -Ithird_party/utf8proc -I/usr/local/cuda/include)
          for directory in src/targets/*/export; do includes+=(-I"$directory"); done
          g++ -std=c++20 -fsyntax-only -DNINFER_VOLTA_BUILD "${includes[@]}" \
            src/targets/qwen3_8_flash_next/impl/expert_cache.cpp \
            tests/targets/qwen3_8_flash_next/test_expert_cache.cpp \
            src/targets/qwen3_8_flash_next/impl/moe.cpp \
            src/targets/qwen3_8_flash_next/impl/cpu_expert_pool.cpp \
            src/targets/qwen3_8_flash_next/impl/text_decode.cpp \
            src/targets/qwen3_8_flash_next/impl/text_executor.cpp \
            src/targets/qwen3_8_flash_next/impl/program.cpp
      - name: Check out frozen Strata telemetry fork
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: mylordmonkeyman/Strata-V100
          ref: 0430d397d907032fc9ab83c8bb7acff48a935b53
          path: strata-telemetry-source
          persist-credentials: false
      - name: Check shared schema and compile Strata telemetry
        run: |
          cmp docs/v100-cross-engine-telemetry-spec.md strata-telemetry-source/docs/v100-cross-engine-telemetry-spec.md
          cmp src/targets/qwen3_8_flash_next/impl/telemetry/compare_telemetry.h strata-telemetry-source/include/strata/telemetry/compare_telemetry.hpp
          sed 's/"compare_telemetry.hpp"/"compare_telemetry.h"/' strata-telemetry-source/include/strata/telemetry/lifecycle_telemetry.hpp | \
            cmp - src/targets/qwen3_8_flash_next/impl/telemetry/lifecycle_telemetry.h
          cd strata-telemetry-source
          g++ -std=c++20 -fsyntax-only -DSTRATA_VERSION='"0.1.36"' \
            -Iinclude -I/usr/local/cuda/include \
            src/core/expert_source.cpp src/core/session.cpp src/core/verify.cpp \
            src/kernels/cpu/pool.cpp \
            src/prefill/prefill.cpp src/program/generate.cpp

  evidence-replay:
    # One-time hosted analysis of the frozen 2026-10-07 V100 evidence.
    # Does not acquire the GPU runner or start either engine.
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[v100:evidence-replay]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Download frozen qualified hardware evidence (not models)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: v100-telemetry-qualification-37716164597-1
          run-id: 37716164597
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/qualification-source
      - name: Verify original evidence and classify indexed output parity
        shell: bash
        run: |
          set -euo pipefail
          (cd "$RUNNER_TEMP/qualification-source" && zip -qr "$RUNNER_TEMP/v100-evidence.zip" .)
          python3 tools/telemetry/replay_qualification.py "$RUNNER_TEMP/v100-evidence.zip" \
            --output "$RUNNER_TEMP/v100-evidence-replay.json" >/dev/null
          python3 - <<'PYREPLAY'
          import json, os
          from pathlib import Path
          report = json.loads((Path(os.environ['RUNNER_TEMP'])/'v100-evidence-replay.json').read_text())
          analysis = report['analysis']
          assert report['requests_verified'] == 48
          assert report['frozen_strict_fidelity_agreed']
          assert analysis['indexed_telemetry_output_parity_observed']
          assert not analysis['software_output_fidelity_passed']
          engines = {row['engine']: row for row in analysis['engines']}
          assert engines['ninfer']['baseline_output_stable']
          assert not engines['strata']['baseline_output_stable']
          assert all(row['compared_request_positions'] == 8 and
                     row['indexed_request_output_parity_passed']
                     for row in engines.values())
          print('PASS: verified all 48 saved HTTP responses without running GPU models')
          print('PASS: all 8 positions match across levels 0/1/2 in both engines')
          print('STRICT baseline-repeatability gate remains FAILED for Strata')
          for engine, row in engines.items():
              print(f"{engine}: median L1 overhead {100*row['level_1_overhead_fraction']:+.2f}%, "
                    f"timing gate qualified={row['overhead_qualified']}")
          PYREPLAY
          cp "$RUNNER_TEMP/v100-evidence-replay.json" "$GITHUB_STEP_SUMMARY"
      - name: Preserve small offline analysis only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v100-telemetry-offline-replay-37716164597
          path: ${{ runner.temp }}/v100-evidence-replay.json
          retention-days: 30

name: Phase 11 GDN Gate Recompute

on:
  push:
    branches:
      - work/precision-matched-reference
    paths:
      - .github/workflows/precision-gdn-gate-recompute.yml

permissions:
  actions: read
  contents: read

jobs:
  gate-14:
    runs-on: [self-hosted, v100, sm70, cuda-12-8, ninfer-phase11]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: v100-gdn-layer0-calibration-14
          run-id: 36061122886
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: v100-input
      - name: Recompute FP32 gate from captured recurrent output
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import math
          from pathlib import Path
          import struct

          model = Path('/srv/ninfer/source/mixed')
          index = json.loads((model/'model.safetensors.index.json').read_text())['weight_map']
          keys = [key for key in index if key.endswith('layers.0.linear_attn.norm.weight')]
          if len(keys) != 1:
              raise RuntimeError(f'Expected one layer-zero GDN norm weight; got {keys}')
          key = keys[0]
          with (model/index[key]).open('rb') as shard:
              header_size = struct.unpack('<Q', shard.read(8))[0]
              header = json.loads(shard.read(header_size))
              entry = header[key]
              if entry['shape'] != [128]:
                  raise RuntimeError(f'Unexpected GDN norm shape {entry["shape"]}')
              start, end = entry['data_offsets']
              shard.seek(8 + header_size + start)
              raw = shard.read(end - start)
          if entry['dtype'] == 'BF16':
              norm = [struct.unpack('<f', struct.pack('<I', word << 16))[0]
                      for word in struct.unpack('<128H', raw)]
          elif entry['dtype'] == 'F32':
              norm = struct.unpack('<128f', raw)
          else:
              raise RuntimeError(f'Unexpected norm dtype {entry["dtype"]}')
          root = Path('v100-input/candidate-stage')
          for pos in (0, 2, 12, 13):
              directory = root/f'pos{pos:04d}'
              def stage(name):
                  raw = (directory/f'L00_{name}.bin').read_bytes()
                  return struct.unpack('<6144f', raw)
              x = stage('gdn_recurrent_output')
              z = stage('gdn_z')
              actual = stage('gdn_gated_output')
              # Mirrors the FP32 diagnostic kernel: per-head RMSNorm then
              # sigmoid(BF16 z), retaining the unrounded gate product.
              expected = []
              for head in range(48):
                  start = head * 128
                  rms = math.sqrt(sum(value*value for value in x[start:start+128])/128 + 1e-6)
                  expected.extend(x[start+d] / rms * norm[d] /
                                  (1 + math.exp(-z[start+d])) for d in range(128))
              error = [a-b for a,b in zip(expected, actual)]
              nrmse = math.sqrt(sum(e*e for e in error) / sum(e*e for e in expected))
              print(f'gate position={pos} nrmse={nrmse:.9g} '
                    f'max_abs={max(map(abs,error)):.9g} '
                    f'count={len(error)}', flush=True)
              if not math.isfinite(nrmse):
                  raise RuntimeError('Nonfinite gate recomputation')
          PY

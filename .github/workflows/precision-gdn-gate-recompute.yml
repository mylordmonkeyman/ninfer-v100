name: Phase 11 GDN Gate Recompute

on:
  push:
    branches:
      - work/precision-matched-reference
    paths:
      - .github/workflows/precision-gdn-gate-recompute.yml

permissions:
  actions: read
  contents: read

jobs:
  gate-14:
    runs-on: [self-hosted, v100, sm70, cuda-12-8, ninfer-phase11]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: v100-gdn-layer0-calibration-14
          run-id: 36061122886
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: v100-input
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: cpu-gdn-history-reference-14
          run-id: 36097496115
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: cpu-input
      - name: Recompute FP32 gate from captured recurrent output
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import math
          from pathlib import Path
          import struct

          model = Path('/srv/ninfer/source/mixed')
          index = json.loads((model/'model.safetensors.index.json').read_text())['weight_map']
          keys = [key for key in index if key.endswith('layers.0.linear_attn.norm.weight')]
          if len(keys) != 1:
              raise RuntimeError(f'Expected one layer-zero GDN norm weight; got {keys}')
          key = keys[0]
          with (model/index[key]).open('rb') as shard:
              header_size = struct.unpack('<Q', shard.read(8))[0]
              header = json.loads(shard.read(header_size))
              entry = header[key]
              if entry['shape'] != [128]:
                  raise RuntimeError(f'Unexpected GDN norm shape {entry["shape"]}')
              start, end = entry['data_offsets']
              shard.seek(8 + header_size + start)
              raw = shard.read(end - start)
          if entry['dtype'] == 'BF16':
              norm = [struct.unpack('<f', struct.pack('<I', word << 16))[0]
                      for word in struct.unpack('<128H', raw)]
          elif entry['dtype'] == 'F32':
              norm = struct.unpack('<128f', raw)
          else:
              raise RuntimeError(f'Unexpected norm dtype {entry["dtype"]}')
          root = Path('v100-input/candidate-stage')
          cpu_root = Path('cpu-input/v100-phase11-storage')
          def gate(x, z):
              expected = []
              for head in range(48):
                  start = head * 128
                  rms = math.sqrt(sum(value*value for value in x[start:start+128])/128 + 1e-6)
                  expected.extend(x[start+d] / rms * norm[d] /
                                  (1 + math.exp(-z[start+d])) for d in range(128))
              return expected
          def nrmse(a,b):
              return math.sqrt(sum((x-y)**2 for x,y in zip(a,b)) / sum(x*x for x in a))
          for pos in (0, 2, 12, 13):
              directory = root/f'pos{pos:04d}'
              def stage(base,name):
                  raw = (base/f'pos{pos:04d}'/f'L00_{name}.bin').read_bytes()
                  return struct.unpack('<6144f', raw)
              x = stage(root, 'gdn_recurrent_output')
              z = stage(root, 'gdn_z')
              actual = stage(root, 'gdn_gated_output')
              cx = stage(cpu_root, 'gdn_recurrent_output')
              cz = stage(cpu_root, 'gdn_z')
              cpu_actual = stage(cpu_root, 'gdn_gated_output')
              # Mirrors the FP32 diagnostic kernel: per-head RMSNorm then
              # sigmoid(BF16 z), retaining the unrounded gate product.
              expected = gate(x,z)
              error = [a-b for a,b in zip(expected, actual)]
              measured = nrmse(expected, actual)
              print(f'gate position={pos} nrmse={measured:.9g} '
                    f'max_abs={max(map(abs,error)):.9g} '
                    f'count={len(error)}', flush=True)
              print(f'swap position={pos} cpu-own={nrmse(gate(cx,cz),cpu_actual):.9g} '
                    f'input-gap={nrmse(expected,gate(cx,cz)):.9g} '
                    f'cpu-x-v100-z={nrmse(expected,gate(cx,z)):.9g} '
                    f'v100-x-cpu-z={nrmse(expected,gate(x,cz)):.9g}', flush=True)
              if pos in (12, 13):
                  contributions = []
                  for head in range(48):
                      start = head * 128
                      end = start + 128
                      a, b = x[start:end], cx[start:end]
                      rms = math.sqrt(sum(v*v for v in a)/128)
                      difference = math.sqrt(sum((u-v)**2 for u,v in zip(a,b))/128)
                      gated_gap = math.sqrt(sum((u-v)**2 for u,v in
                                           zip(expected[start:end],gate(cx,z)[start:end])))
                      contributions.append((gated_gap,head,rms,difference))
                  for gap,head,rms,difference in sorted(contributions,reverse=True)[:5]:
                      print(f'head position={pos} head={head} gated_l2={gap:.9g} '
                            f'recurrent_rms={rms:.9g} recurrent_rmse={difference:.9g}', flush=True)
              if not math.isfinite(measured):
                  raise RuntimeError('Nonfinite gate recomputation')
          for pos in range(14):
              def recurrent(base):
                  raw = (base/f'pos{pos:04d}'/'L00_gdn_recurrent_output.bin').read_bytes()
                  return struct.unpack('<6144f',raw)
              x, cx = recurrent(root), recurrent(cpu_root)
              for head in (24, 25, 26):
                  a, b = x[head*128:(head+1)*128], cx[head*128:(head+1)*128]
                  rms = math.sqrt(sum(v*v for v in a)/128)
                  rmse = math.sqrt(sum((u-v)**2 for u,v in zip(a,b))/128)
                  print(f'history position={pos} head={head} recurrent_rms={rms:.9g} '
                        f'recurrent_rmse={rmse:.9g}', flush=True)
          for pos in (10, 11, 12):
              for name in ('attn_block_input', 'gdn_projected', 'gdn_z',
                           'gdn_g', 'gdn_beta', 'gdn_recurrent_output'):
                  def load(base):
                      raw = (base/f'pos{pos:04d}'/f'L00_{name}.bin').read_bytes()
                      return struct.unpack(f'<{len(raw)//4}f',raw)
                  a,b = load(root),load(cpu_root)
                  print(f'boundary position={pos} stage={name} nrmse={nrmse(a,b):.9g} '
                        f'count={len(a)}', flush=True)
              def load(base,name):
                  raw = (base/f'pos{pos:04d}'/f'L00_{name}.bin').read_bytes()
                  return struct.unpack(f'<{len(raw)//4}f',raw)
              gpu_z, cpu_z = load(root,'gdn_z'), load(cpu_root,'gdn_z')
              projected = load(root,'gdn_projected')
              # Projected layout is [q, k, v, z]; z starts at 10240.
              raw_z = projected[10240:]
              def bf16_round(x):
                  bits = struct.unpack('<I',struct.pack('<f',x))[0]
                  bits += 0x7fff + ((bits >> 16) & 1)
                  return struct.unpack('<f',struct.pack('<I',bits & 0xffff0000))[0]
              mismatches = [i for i,(a,b) in enumerate(zip(gpu_z,cpu_z)) if a != b]
              raw_mismatch = [i for i,(a,b) in enumerate(zip(raw_z,gpu_z))
                              if bf16_round(a) != b]
              print(f'z-round position={pos} cpu-gpu-mismatches={len(mismatches)} '
                    f'gpu-round-mismatches={len(raw_mismatch)} '
                    f'critical-head-mismatches={sum(24*128 <= i < 27*128 for i in mismatches)}',
                    flush=True)
              cpu_projected = load(cpu_root,'gdn_projected')
              gpu_projected = projected
              projected_flips = [i for i,(a,b) in enumerate(zip(gpu_projected,cpu_projected))
                                 if a != bf16_round(b)]
              for label,lo,hi in (('query',0,2048),('key',2048,4096),
                                  ('value',4096,10240),('value_heads24_26',7168,7552)):
                  print(f'projection-round position={pos} part={label} '
                        f'cpu-round-v100-mismatches={sum(lo <= i < hi for i in projected_flips)} '
                        f'count={hi-lo}',flush=True)
          PY

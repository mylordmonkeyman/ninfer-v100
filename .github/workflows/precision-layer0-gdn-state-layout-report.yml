name: Phase 11 Layer Zero GDN State Layout Report

on:
  push:
    branches:
      - work/precision-matched-reference
    paths:
      - .github/workflows/precision-layer0-gdn-state-layout-report.yml

permissions:
  actions: read
  contents: read

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: cpu-layer0-gdn-prior-state-shape
          run-id: 36183922098
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: cpu
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: v100-layer0-matched-state-13
          run-id: 36184223882
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: gpu
      - name: Check prior-state orientation against natural V100 baseline
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee layout-report.txt
          from array import array
          from pathlib import Path
          from math import fsum,sqrt
          name='L00_gdn_ssm_source_state.bin'
          cpu_path=next(Path('cpu').rglob(name))
          gpu_path=next(p for p in Path('gpu').rglob(name)
                        if p.parent.parent.name=='baseline')
          def read(path):
              data=array('f');data.frombytes(path.read_bytes());return data
          cpu=read(cpu_path);gpu=read(gpu_path)
          assert len(cpu)==len(gpu)==48*128*128
          den=fsum(float(x)**2 for x in cpu)
          def nrmse(values):
              return sqrt(fsum((float(a)-float(b))**2
                               for a,b in zip(values,gpu))/den)
          print('natural_raw_nrmse',nrmse(cpu))
          transposed=array('f',(cpu[h*16384+j*128+i]
                                 for h in range(48)
                                 for i in range(128)
                                 for j in range(128)))
          print('natural_transpose_last_two_nrmse',nrmse(transposed))
          print('cpu_norm',sqrt(den),'v100_norm',
                sqrt(fsum(float(x)**2 for x in gpu)))
          print('cpu_first_values',list(cpu[:8]))
          print('v100_first_values',list(gpu[:8]))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: layer0-gdn-state-layout-report
          path: layout-report.txt
          if-no-files-found: ignore
          retention-days: 14

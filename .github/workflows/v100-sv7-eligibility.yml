name: V100 SV7 Exact FP16 Weight Eligibility
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  CMAKE_BUILD_PARALLEL_LEVEL: 32
jobs:
  exact-conversion:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Exhaust every represented BF16 pattern against the finite FP16 oracle
        run: |
          set -euo pipefail
          g++ -std=c++20 -O2 -Isrc tests/ops/test_exact_bf16_fp16.cpp -o exact-fp16-test
          ./exact-fp16-test
  inventory:
    needs: exact-conversion
    runs-on: [self-hosted, v100, sm70, cuda-12-8, ninfer-phase11]
    concurrency:
      group: v100-sv0-hardware
      cancel-in-progress: false
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          clean: false
      - name: Inventory real BF16 matrix representation without starting GPU inference
        env:
          NINFER_WEIGHTS: /models/qwen3-8b-flash-next
        run: |
          set -euo pipefail
          mkdir -p sv7-eligibility-results
          git rev-parse HEAD > sv7-eligibility-results/candidate-sha.txt
          g++ -std=c++20 -O2 -Isrc -Ithird_party \
            tools/diagnostics/v100_sv7_weight_eligibility.cpp \
            src/artifact/reader.cpp src/artifact/storage_layouts.cpp \
            -o sv7-weight-eligibility
          ./sv7-weight-eligibility "$NINFER_WEIGHTS" > sv7-eligibility-results/weights.json
          python3 - <<'PY'
          import json, pathlib
          report = json.loads(pathlib.Path('sv7-eligibility-results/weights.json').read_text())
          rows = report['tensors']
          print(f"Exact FP16 eligible BF16 matrices: {sum(r['eligible'] for r in rows)}/{len(rows)}")
          print('Weight representation evidence only; no arithmetic or performance qualification.')
          PY
      - name: Preserve exact eligibility inventory
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v100-sv7-eligibility-${{ github.run_id }}-${{ github.run_attempt }}
          path: sv7-eligibility-results/
          retention-days: 30
          if-no-files-found: warn

name: V100 SV6 Queued PLE I/O
on:
  push:
    branches: [perf/v100-strata-derived]
    paths:
      - '.github/workflows/v100-sv6.yml'
      - 'src/artifact/materializer.*'
      - 'src/artifact/reader.*'
      - 'src/targets/qwen3_8_flash_next/impl/load/materialized.cpp'
      - 'src/targets/qwen3_8_flash_next/CMakeLists.txt'
      - 'src/targets/qwen3_8_flash_next/impl/perf_telemetry.h'
      - 'src/targets/qwen3_8_flash_next/impl/ple_*'
      - 'src/targets/qwen3_8_flash_next/impl/text_decode.*'
      - 'src/targets/qwen3_8_flash_next/impl/text_executor.cpp'
      - 'tests/targets/qwen3_8_flash_next/test_ple_pipeline.cpp'
      - 'tests/targets/qwen3_8_flash_next/test_ple_read_batch.cpp'
      - 'tests/targets/qwen3_8_flash_next/test_ple_direct_io.cpp'
      - 'tests/CMakeLists.txt'
      - 'tests/test_ninfer_artifact_reader.cpp'
      - 'tools/diagnostics/v100_sv6_runtime.py'
      - 'tools/diagnostics/test_v100_sv6_runtime.py'
      - 'docs/maintainer/v100-strata-performance.md'
  workflow_dispatch:
permissions:
  contents: read
env:
  CMAKE_BUILD_PARALLEL_LEVEL: 32
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check workflow and queued PLE diagnostics
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, yaml
          workflow = pathlib.Path('.github/workflows/v100-sv6.yml')
          yaml.safe_load(workflow.read_text())
          text = workflow.read_text()
          assert 'CMAKE_BUILD_PARALLEL_LEVEL: 32' in text
          build_lines = [line for line in text.splitlines()
                         if line.strip().startswith('cmake --build')]
          assert len(build_lines) == 1
          assert all(' -j' not in line for line in build_lines)
          PY
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover \
            -s tools/diagnostics -p 'test_v100*.py'
          git diff --check
  hardware:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[v100:') || contains(github.event.head_commit.message, '[v100:sv6]')
    needs: checks
    runs-on: [self-hosted, v100, sm70, cuda-12-8, ninfer-phase11]
    concurrency:
      group: v100-sv0-hardware
      cancel-in-progress: false
    timeout-minutes: 120
    env:
      CUDA_VISIBLE_DEVICES: '0'
      NINFER_WEIGHTS: /models/qwen3-8b-flash-next
      NINFER_FLASH_NEXT_ORACLE_MANIFEST: /oracle/phase11/manifest.json
      NINFER_FLASH_NEXT_CPU_EXPERT_WORKERS: '32'
      NINFER_FLASH_NEXT_FP32_HYPER_STATE: '1'
      NINFER_FLASH_NEXT_FP32_GDN_CONV: '1'
      NINFER_FLASH_NEXT_FP32_GDN_PROJECTION: '1'
      NINFER_FLASH_NEXT_FP32_GDN_READOUT: '1'
      NINFER_FLASH_NEXT_FP32_GDN_GATE: '1'
      NINFER_FLASH_NEXT_FP32_GDN_OUTPUT: '1'
      NINFER_FLASH_NEXT_FP32_GDN_OUTPUT_INPUT: '1'
      NINFER_FLASH_NEXT_FP32_HYPER_INJECT_INPUT: '1'
      NINFER_FLASH_NEXT_FP32_HYPER_INJECT_APPLY: '1'
      NINFER_FLASH_NEXT_FP32_MLP_HYPER_OUTPUT: '1'
      NINFER_FLASH_NEXT_FP32_MLP_HYPER_INPUT: '1'
      NINFER_FLASH_NEXT_FP32_MLP_HYPER_NORMALIZED: '1'
      NINFER_FLASH_NEXT_FP32_MLP_HYPER_LOW_RANK: '1'
      NINFER_FLASH_NEXT_FP32_MLP_HYPER_APPLY: '1'
      NINFER_FLASH_NEXT_FP32_MLP_HYPER_INJECTION: '1'
      NINFER_FLASH_NEXT_FP32_MOE_OUTPUT: '1'
      NINFER_FLASH_NEXT_FP32_ROUTER_INPUT: '0'
      NINFER_FLASH_NEXT_FP32_ROUTER_INPUT_LAYERS_32_47: '0'
      NINFER_FLASH_NEXT_FP32_MOE_ROUTED_INPUT: '0'
      NINFER_FLASH_NEXT_FP32_MOE_SHARED_INPUT: '0'
      NINFER_FLASH_NEXT_CPU_EXPERT_FP32_INTERMEDIATE: '0'
      NINFER_FLASH_NEXT_MOE_SHARED_FP32_INTERMEDIATE: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          clean: false
      - name: Check V100 headroom without stopping other workloads
        shell: bash
        run: |
          set -euo pipefail
          free_mib=$(nvidia-smi --id=0 --query-gpu=memory.free --format=csv,noheader,nounits | tr -d '[:space:]')
          if (( free_mib < 28000 )); then
            echo '::error::V100 lacks SV6 test headroom; no unrelated workloads were stopped.'
            exit 1
          fi
      - name: Build the SV6 candidate once
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build-sv6 -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CUDA_COMPILER=/usr/local/cuda-12.8/bin/nvcc \
            -DCMAKE_CUDA_ARCHITECTURES=70 -DNINFER_BUILD_MEDIA=OFF \
            -DNINFER_BUILD_APPS=OFF -DNINFER_BUILD_BENCHMARKS=OFF -DBUILD_TESTING=ON
          cmake --build build-sv6 --target \
            ninfer_artifact_reader_test \
            ninfer_qwen3_8_flash_next_ple_read_batch_test \
            ninfer_qwen3_8_flash_next_ple_direct_io_test \
            ninfer_qwen3_8_flash_next_ple_pipeline_test \
            ninfer_qwen3_8_flash_next_vertical_slice_real_test
      - name: Verify artifact lease, async lifetime and exact PLE output
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p sv6-results
          find sv6-results -mindepth 1 -delete
          git rev-parse HEAD > sv6-results/candidate-sha.txt
          nvidia-smi -q > sv6-results/gpu.txt
          /usr/local/cuda-12.8/bin/nvcc --version > sv6-results/cuda.txt
          build-sv6/tests/ninfer_artifact_reader_test 2>&1 | tee sv6-results/reader.log
          build-sv6/tests/ninfer_qwen3_8_flash_next_ple_read_batch_test \
            2>&1 | tee sv6-results/read-batch.log
          build-sv6/tests/ninfer_qwen3_8_flash_next_ple_direct_io_test \
            2>&1 | tee sv6-results/direct-io.log
          build-sv6/tests/ninfer_qwen3_8_flash_next_ple_pipeline_test \
            2>&1 | tee sv6-results/ple-pipeline.log
      - name: Compare mapped and direct queued PLE gathering
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/diagnostics/v100_sv6_runtime.py \
            --executable build-sv6/tests/ninfer_qwen3_8_flash_next_vertical_slice_real_test \
            --output sv6-results/runtime --positions 512 --repeats 3 \
            | tee sv6-results/runtime.log
          cat sv6-results/runtime/sv6-runtime.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve SV6 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v100-sv6-${{ github.run_id }}-${{ github.run_attempt }}
          path: sv6-results/
          retention-days: 30
          if-no-files-found: warn

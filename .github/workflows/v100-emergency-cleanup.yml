name: Emergency cleanup of oversized V100 telemetry upload
on:
  push:
    branches: [perf/v100-strata-derived]
    paths: ['.github/workflows/v100-emergency-cleanup.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  cancel-and-clean:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[v100:cancel-oversize]')) }}
    runs-on: ubuntu-latest
    concurrency:
      # Cleanup must NOT wait for the V100 hardware group it is trying to cancel.
      # Separate emergency run ID so cancellation cannot queue behind stale cleanup jobs.
      group: v100-emergency-force-${{ github.run_id }}
      cancel-in-progress: false
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
      BAD_RUN_ID: '37707932845'
    steps:
      - name: Cancel oversized run and delete its GitHub artifacts only
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions"
          headers=(-H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")
          status="$(curl -sS -o /tmp/v100-cancel-result -w '%{http_code}' -X POST "${headers[@]}" "${api}/runs/${BAD_RUN_ID}/cancel")"
          echo "Cancel API HTTP status: ${status} (202 means accepted; 409 means already stopped)"
          if [[ "${status}" != '202' && "${status}" != '409' ]]; then
            cat /tmp/v100-cancel-result
            exit 1
          fi
          for attempt in $(seq 1 5); do
            state="$(curl -fsS "${headers[@]}" "${api}/runs/${BAD_RUN_ID}" | jq -r '.status')"
            echo "Run status: ${state}"
            if [[ "${state}" == 'completed' ]]; then break; fi
            sleep 5
          done
          if [[ "${state}" != 'completed' ]]; then
            echo "Normal cancel has not stopped the upload; attempting GitHub force-cancel."
            force_status="$(curl -sS -o /tmp/v100-force-result -w '%{http_code}' -X POST "${headers[@]}" "${api}/runs/${BAD_RUN_ID}/force-cancel")"
            echo "Force-cancel API HTTP status: ${force_status}"
            [[ "${force_status}" == '202' || "${force_status}" == '409' ]] || { cat /tmp/v100-force-result; exit 1; }
          fi
          for attempt in $(seq 1 60); do
            state="$(curl -fsS "${headers[@]}" "${api}/runs/${BAD_RUN_ID}" | jq -r '.status')"
            echo "Run status: ${state}"
            if [[ "${state}" == 'completed' ]]; then break; fi
            sleep 5
          done
          [[ "${state}" == 'completed' ]] || { echo "Run has not stopped; refuse to claim artifact cleanup complete"; exit 1; }
          artifacts="$(curl -fsS "${headers[@]}" "${api}/runs/${BAD_RUN_ID}/artifacts?per_page=100")"
          echo "${artifacts}" | jq -r '.artifacts[] | "Artifact id=\(.id) name=\(.name) bytes=\(.size_in_bytes)"'
          while read -r id; do
            [[ -n "${id}" ]] || continue
            code="$(curl -sS -o /tmp/v100-delete-result -w '%{http_code}' -X DELETE "${headers[@]}" "${api}/artifacts/${id}")"
            echo "Deleted artifact ${id}: HTTP ${code}"
            [[ "${code}" == '204' || "${code}" == '404' ]] || { cat /tmp/v100-delete-result; exit 1; }
          done < <(echo "${artifacts}" | jq -r '.artifacts[] | select(.name | startswith("v100-telemetry-qualification-37707932845-")) | .id')
          echo "Cleanup of GitHub artifacts for run ${BAD_RUN_ID} completed"

name: V100 SV6 Production PLE TTFT
on:
  push:
    branches: [perf/v100-strata-derived]
    paths:
      - '.github/workflows/v100-sv6-serve.yml'
      - 'src/artifact/reader.*'
      - 'src/targets/qwen3_8_flash_next/impl/load/materialized.cpp'
      - 'src/targets/qwen3_8_flash_next/impl/ple_*'
      - 'tests/test_ninfer_artifact_reader.cpp'
      - 'tools/diagnostics/v100_sv6_serve.py'
      - 'tools/diagnostics/test_v100_sv6_serve.py'
      - 'docs/maintainer/v100-strata-performance.md'
  workflow_dispatch:
permissions:
  contents: read
env:
  CMAKE_BUILD_PARALLEL_LEVEL: 32
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check TTFT workflow and diagnostics
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, yaml
          path = pathlib.Path('.github/workflows/v100-sv6-serve.yml')
          yaml.safe_load(path.read_text())
          text = path.read_text()
          assert 'CMAKE_BUILD_PARALLEL_LEVEL: 32' in text
          builds = [line for line in text.splitlines()
                    if line.strip().startswith('cmake --build')]
          assert len(builds) == 1 and all(' -j' not in line for line in builds)
          PY
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover \
            -s tools/diagnostics -p 'test_v100*.py'
          git diff --check
  hardware:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[v100:') || contains(github.event.head_commit.message, '[v100:sv6-serve]')
    needs: checks
    runs-on: [self-hosted, v100, sm70, cuda-12-8, ninfer-phase11]
    concurrency:
      group: v100-sv0-hardware
      cancel-in-progress: false
    timeout-minutes: 120
    env:
      CUDA_VISIBLE_DEVICES: '0'
      NINFER_WEIGHTS: /models/qwen3-8b-flash-next
      NINFER_FLASH_NEXT_CPU_EXPERT_WORKERS: '32'
      NINFER_FLASH_NEXT_FP32_HYPER_STATE: '1'
      NINFER_FLASH_NEXT_FP32_GDN_CONV: '1'
      NINFER_FLASH_NEXT_FP32_GDN_PROJECTION: '1'
      NINFER_FLASH_NEXT_FP32_GDN_READOUT: '1'
      NINFER_FLASH_NEXT_FP32_GDN_GATE: '1'
      NINFER_FLASH_NEXT_FP32_GDN_OUTPUT: '1'
      NINFER_FLASH_NEXT_FP32_GDN_OUTPUT_INPUT: '1'
      NINFER_FLASH_NEXT_FP32_HYPER_INJECT_INPUT: '1'
      NINFER_FLASH_NEXT_FP32_HYPER_INJECT_APPLY: '1'
      NINFER_FLASH_NEXT_FP32_MLP_HYPER_OUTPUT: '1'
      NINFER_FLASH_NEXT_FP32_MLP_HYPER_INPUT: '1'
      NINFER_FLASH_NEXT_FP32_MLP_HYPER_NORMALIZED: '1'
      NINFER_FLASH_NEXT_FP32_MLP_HYPER_LOW_RANK: '1'
      NINFER_FLASH_NEXT_FP32_MLP_HYPER_APPLY: '1'
      NINFER_FLASH_NEXT_FP32_MLP_HYPER_INJECTION: '1'
      NINFER_FLASH_NEXT_FP32_MOE_OUTPUT: '1'
      NINFER_FLASH_NEXT_FP32_ROUTER_INPUT: '0'
      NINFER_FLASH_NEXT_FP32_ROUTER_INPUT_LAYERS_32_47: '0'
      NINFER_FLASH_NEXT_FP32_MOE_ROUTED_INPUT: '0'
      NINFER_FLASH_NEXT_FP32_MOE_SHARED_INPUT: '0'
      NINFER_FLASH_NEXT_CPU_EXPERT_FP32_INTERMEDIATE: '0'
      NINFER_FLASH_NEXT_MOE_SHARED_FP32_INTERMEDIATE: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          clean: false
      - name: Digest previous incomplete SV6 serve evidence if present
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -f sv6-serve-results/runtime.log ] && [ ! -f sv6-serve-results/runtime/report.json ]; then
            echo "::warning::previous SV6 serve run did not complete; preserving its evidence as public annotations (base64)"
            listing=$( { ls -la sv6-serve-results; ls -la sv6-serve-results/runtime; } 2>&1 | base64 -w0)
            echo "::warning::sv6-serve previous-run evidence listing base64=${listing}"
            payload=$(tail -c 30000 sv6-serve-results/runtime.log | base64 -w0)
            echo "::warning::sv6-serve previous-run runtime.log tail base64=${payload}"
            latest_log=$(ls -t sv6-serve-results/runtime/*.log 2>/dev/null | head -1 || true)
            if [ -n "${latest_log:-}" ]; then
              payload=$(tail -c 30000 "$latest_log" | base64 -w0)
              echo "::warning::sv6-serve previous-run server log $(basename "$latest_log") tail base64=${payload}"
            fi
          fi
      - name: Reserve the V100 from llama-swap
        shell: bash
        run: |
          set -uo pipefail
          # This runner shares the V100 with the agent's own inference model,
          # which llama-swap (127.0.0.1:9292) keeps loaded (~30 GiB) while the
          # agent session is active. Unload it for the duration of the run;
          # llama-swap lazily reloads it on the agent's next inference
          # request, so the agent must stay silent while the screen runs.
          swap_base=http://127.0.0.1:9292
          agent_models="qwen3.8-27b-ninfer qwen3.8-27b-omp"
          unload() {
            for model in $agent_models; do
              code=$(curl -s -m 10 -X POST -o /tmp/unload-response.json -w '%{http_code}' \
                "$swap_base/api/models/unload/$model" || true)
              echo "unload $model -> HTTP $code: $(head -c 200 /tmp/unload-response.json 2>/dev/null)"
            done
          }
          swap_reachable=1
          unload
          if [ "${code:-000}" = "000" ]; then
            swap_reachable=0
            echo "WARNING: llama-swap (127.0.0.1:9292) is not reachable from the runner netns; the agent host must keep the agent model unloaded."
            echo "::warning::llama-swap unreachable from the runner; relying on the agent-host pre-unload"
          fi
          required_free_mib=28000
          deadline=$(( $(date +%s) + 900 ))
          last_unload=0
          while :; do
            free_mib=$(nvidia-smi --id=0 --query-gpu=memory.free --format=csv,noheader,nounits | head -n1 | tr -d '[:space:]')
            echo "GPU 0 free memory: ${free_mib} MiB (need at least ${required_free_mib} MiB)"
            if [ -n "$free_mib" ] && [ "$free_mib" -ge "$required_free_mib" ]; then
              echo "V100 reserved for the SV6 serve screen."
              break
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "ERROR: GPU 0 free memory stayed below ${required_free_mib} MiB for 15 minutes after unloading the agent model." >&2
              echo "The V100 is contended (the agent model is loaded or the agent is actively in use). Keep the agent idle and re-trigger the SV6 serve screen." >&2
              exit 1
            fi
            now=$(date +%s)
            if [ "$swap_reachable" = "1" ] && [ $(( now - last_unload )) -ge 60 ]; then
              last_unload=$now
              unload
            fi
            sleep 15
          done
      - name: Prepare exact model alias and evidence directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p sv6-serve-results sv6-serve-source
          find sv6-serve-results -mindepth 1 -delete
          find sv6-serve-source -mindepth 1 -delete
          test -f "$NINFER_WEIGHTS"
          test -r "$NINFER_WEIGHTS"
          ln -s "$NINFER_WEIGHTS" sv6-serve-source/model.ninfer
          git rev-parse HEAD > sv6-serve-results/candidate-sha.txt
          nvidia-smi -q > sv6-serve-results/gpu.txt
          /usr/local/cuda-12.8/bin/nvcc --version > sv6-serve-results/cuda.txt
          free_mib=$(nvidia-smi --id=0 --query-gpu=memory.free --format=csv,noheader,nounits | tr -d '[:space:]')
          if (( free_mib < 28000 )); then
            echo '::error::V100 lacks SV6 server-test headroom; no unrelated workloads were stopped.'
            exit 1
          fi
      - name: Build server and cache-control test once
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build-sv6 -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CUDA_COMPILER=/usr/local/cuda-12.8/bin/nvcc \
            -DCMAKE_CUDA_ARCHITECTURES=70 -DNINFER_BUILD_MEDIA=OFF \
            -DNINFER_BUILD_APPS=ON -DNINFER_BUILD_BENCHMARKS=OFF -DBUILD_TESTING=ON
          cmake --build build-sv6 --target ninfer-serve ninfer_artifact_reader_test
          build-sv6/tests/ninfer_artifact_reader_test 2>&1 | tee sv6-serve-results/reader.log
      - name: Measure verified warm mmap, file-cold mmap and strict direct TTFT
        shell: bash
        run: |
          set -uo pipefail
          emit_digest() {
            label=$1; file=$2
            [ -f "$file" ] || return 0
            payload=$(tail -c 30000 "$file" | base64 -w0)
            echo "::error::sv6-serve ${label} base64=${payload}"
          }
          python3 tools/diagnostics/v100_sv6_serve.py \
            --executable build-sv6/apps/ninfer-serve \
            --artifact sv6-serve-source/model.ninfer \
            --output sv6-serve-results/runtime --repeats 3 \
            | tee sv6-serve-results/runtime.log
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "::error::SV6 serve screen failed (exit ${status}); publishing evidence digest as public annotations"
            latest_log=$(ls -t sv6-serve-results/runtime/*.log 2>/dev/null | head -1 || true)
            {
              echo "## SV6 serve screen failed (exit ${status})"
              echo ""
              echo '<details open><summary>harness runtime log (tail)</summary>'
              echo ""
              echo '```'
              tail -c 48000 sv6-serve-results/runtime.log 2>/dev/null || true
              echo '```'
              echo ""
              echo '</details>'
              if [ -n "${latest_log:-}" ]; then
                echo "<details open><summary>server log: $(basename "$latest_log") (tail)</summary>"
                echo ""
                echo '```'
                tail -c 48000 "$latest_log" 2>/dev/null || true
                echo '```'
                echo ""
                echo '</details>'
              fi
            } >> "$GITHUB_STEP_SUMMARY"
            emit_digest "runtime.log tail" "sv6-serve-results/runtime.log"
            if [ -n "${latest_log:-}" ]; then
              emit_digest "server log $(basename "$latest_log") tail" "$latest_log"
            fi
            exit "$status"
          fi
          cat sv6-serve-results/runtime/sv6-serve.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve SV6 production evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v100-sv6-serve-${{ github.run_id }}-${{ github.run_attempt }}
          path: sv6-serve-results/
          retention-days: 30
          if-no-files-found: warn

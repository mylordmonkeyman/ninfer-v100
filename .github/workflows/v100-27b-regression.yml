name: V100 27B Regression
on:
  push:
    branches: [forwardport/v100-flash-next]
    paths:
      - '.github/workflows/v100-27b-regression.yml'
      - 'src/ops/**'
      - 'src/targets/qwen3_6_27b/**'
      - 'src/CMakeLists.txt'
      - 'CMakeLists.txt'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v100-27b-regression
  cancel-in-progress: false
jobs:
  real-27b:
    runs-on: [self-hosted, v100, sm70, cuda-12-8, ninfer-phase11]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive
          persist-credentials: false
      - name: Check recorded 27B artifact
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p regression-results
          nvidia-smi > regression-results/gpu.txt
          if [[ ! -f /models/qwen3_8_27b_nvfp4.ninfer ]]; then
            echo 'Recorded 27B artifact is not mounted at /models/qwen3_8_27b_nvfp4.ninfer' | tee regression-results/prerequisite.txt
            exit 1
          fi
          stat --format='%n %s bytes' /models/qwen3_8_27b_nvfp4.ninfer > regression-results/prerequisite.txt
      - name: Install media build prerequisites when missing
        shell: bash
        run: |
          set -euo pipefail
          if ! pkg-config --exists libavformat libavcodec libavutil libswscale libcurl; then
            if [[ $(id -u) -eq 0 ]]; then elevate=(); else elevate=(sudo); fi
            "${elevate[@]}" apt-get update
            "${elevate[@]}" env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
              pkg-config libavformat-dev libavcodec-dev libavutil-dev libswscale-dev libcurl4-openssl-dev
          fi
      - name: Build existing whole-model scoring regression
        id: build
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B ../build-27b -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CUDA_COMPILER=/usr/local/cuda-12.8/bin/nvcc \
            -DCMAKE_CUDA_ARCHITECTURES=70 -DNINFER_BUILD_MEDIA=ON \
            -DNINFER_BUILD_APPS=ON -DNINFER_BUILD_BENCHMARKS=ON -DBUILD_TESTING=ON
          cmake --build ../build-27b -j --target ninfer ninfer-serve ninfer_bench \
            ninfer_qwen3_6_27b_score_real_test ninfer_qwen3_6_27b_prefix_real_test \
            ninfer_qwen3_6_27b_mtp_round_bench \
            ninfer_qwen3_8_flash_next_vertical_slice_real_test \
            ninfer_qwen3_8_flash_next_expert_cache_test \
            ninfer_qwen3_8_flash_next_text_decode_test -- -k 0 2>&1 | tee regression-results/build.log
          ctest --test-dir ../build-27b -V \
            -R '^ninfer_qwen3_8_flash_next_(expert_cache|text_decode)_test$' \
            > regression-results/flash-next-unit.log 2>&1
      - name: Score real 27B and check fresh-state repeatability
        id: candidate
        shell: bash
        env:
          NINFER_QWEN3_6_27B_WEIGHTS: /models/qwen3_8_27b_nvfp4.ninfer
        run: |
          set -euo pipefail
          ../build-27b/tests/ninfer_qwen3_6_27b_score_real_test 2>&1 | tee regression-results/candidate.log
      - name: Preserve scoring evidence immediately
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v100-27b-scoring
          path: regression-results/candidate.log
          retention-days: 7
      - name: Real generation with graphs and MTP
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        id: generation
        shell: bash
        run: |
          set -euo pipefail
          args=(--weights /models/qwen3_8_27b_nvfp4.ninfer --desktop-reserve-gib 0 --kv-dtype int8 -pg 1024,64 -r 2 --warmup 1 -o json)
          ../build-27b/bench/ninfer_bench "${args[@]}" --no-cuda-graph --output-file regression-results/eager.json > regression-results/eager.log 2>&1
          ../build-27b/bench/ninfer_bench "${args[@]}" --output-file regression-results/graph.json > regression-results/graph.log 2>&1
          for drafts in 1 3 7; do
            ../build-27b/bench/ninfer_bench "${args[@]}" --spec mtp --draft-tokens "$drafts" --lm-head-draft \
              --output-file "regression-results/mtp-$drafts.json" > "regression-results/mtp-$drafts.log" 2>&1
          done
      - name: Real speculative state and vision regression
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        env:
          NINFER_QWEN3_8_27B_NVFP4_WEIGHTS: /models/qwen3_8_27b_nvfp4.ninfer
        run: |
          set -euo pipefail
          for scenario in speculative-page-boundary rewrite-checkpoint vision; do
            NINFER_PREFIX_REAL_SCENARIO="$scenario" \
              ../build-27b/tests/ninfer_qwen3_6_27b_prefix_real_test \
              2>&1 | tee "regression-results/$scenario.log"
          done
      - name: Preserve dense runtime diagnostics immediately
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v100-27b-runtime-diagnostics
          path: regression-results/*.log
          retention-days: 7
      - name: Preserve real Flash-Next grouped prefill behavior
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        env:
          NINFER_WEIGHTS: /models/qwen3-8b-flash-next
          NINFER_FLASH_NEXT_ORACLE_MANIFEST: /oracle/phase11/manifest.json
          NINFER_FLASH_NEXT_CPU_EXPERT_WORKERS: '32'
          NINFER_FLASH_NEXT_CPU_EXPERT_BACKEND: auto
          NINFER_FLASH_NEXT_FP32_HYPER_STATE: '1'
          NINFER_FLASH_NEXT_FP32_GDN_CONV: '1'
          NINFER_FLASH_NEXT_FP32_GDN_PROJECTION: '1'
          NINFER_FLASH_NEXT_FP32_GDN_READOUT: '1'
          NINFER_FLASH_NEXT_FP32_GDN_GATE: '1'
          NINFER_FLASH_NEXT_FP32_GDN_OUTPUT: '1'
          NINFER_FLASH_NEXT_FP32_GDN_OUTPUT_INPUT: '1'
          NINFER_FLASH_NEXT_FP32_HYPER_INJECT_INPUT: '1'
          NINFER_FLASH_NEXT_FP32_HYPER_INJECT_APPLY: '1'
          NINFER_FLASH_NEXT_FP32_MLP_HYPER_OUTPUT: '1'
          NINFER_FLASH_NEXT_FP32_MLP_HYPER_INPUT: '1'
          NINFER_FLASH_NEXT_FP32_MLP_HYPER_NORMALIZED: '1'
          NINFER_FLASH_NEXT_FP32_MLP_HYPER_LOW_RANK: '1'
          NINFER_FLASH_NEXT_FP32_MLP_HYPER_APPLY: '1'
          NINFER_FLASH_NEXT_FP32_MLP_HYPER_INJECTION: '1'
          NINFER_FLASH_NEXT_FP32_MOE_OUTPUT: '1'
          NINFER_FLASH_NEXT_FP32_ROUTER_INPUT: '0'
          NINFER_FLASH_NEXT_FP32_ROUTER_INPUT_LAYERS_32_47: '0'
          NINFER_FLASH_NEXT_FP32_MOE_ROUTED_INPUT: '0'
          NINFER_FLASH_NEXT_FP32_MOE_SHARED_INPUT: '0'
          NINFER_FLASH_NEXT_CPU_EXPERT_FP32_INTERMEDIATE: '0'
          NINFER_FLASH_NEXT_MOE_SHARED_FP32_INTERMEDIATE: '0'
          NINFER_PHASE11_ORACLE_SMOKE_POSITIONS: '1056'
          NINFER_PREFILL_POLICY_BENCHMARK: '1'
          NINFER_PREFILL_POLICY_DEFAULT: '1'
          NINFER_FLASH_NEXT_EXPERT_CACHE: '1'
        run: |
          set -euo pipefail
          ../build-27b/tests/ninfer_qwen3_8_flash_next_vertical_slice_real_test \
            2>&1 | tee regression-results/flash-next-real.log
          grep -q 'PASS: prefill policy natural routing' regression-results/flash-next-real.log
      - name: Checkout working V100 fork for comparison
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: geoffwatts/ninfer-v100
          ref: b37d0dd3e1163b9d802d8bccfa89918bf68d793e
          path: baseline
          submodules: recursive
          persist-credentials: false
      - name: Compare original V100 fork on the same artifact and corpus
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        env:
          NINFER_QWEN3_6_27B_WEIGHTS: /models/qwen3_8_27b_nvfp4.ninfer
        run: |
          set -euo pipefail
          cmake -S baseline -B ../build-27b-baseline -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CUDA_COMPILER=/usr/local/cuda-12.8/bin/nvcc \
            -DCMAKE_CUDA_ARCHITECTURES=70 -DNINFER_BUILD_MEDIA=OFF \
            -DNINFER_BUILD_APPS=OFF -DNINFER_BUILD_BENCHMARKS=ON -DBUILD_TESTING=ON
          cmake --build ../build-27b-baseline -j --target ninfer_qwen3_6_27b_score_real_test ninfer_bench
          baseline_score_status=0
          ../build-27b-baseline/tests/ninfer_qwen3_6_27b_score_real_test 2>&1 | tee regression-results/baseline.log || baseline_score_status=$?
          args=(--weights /models/qwen3_8_27b_nvfp4.ninfer --corpus bench/fixtures/bench_corpus.ids --kv-dtype int8 -pg 1024,64 -r 2 --warmup 1 -o json)
          ../build-27b-baseline/bench/ninfer_bench "${args[@]}" --output-file regression-results/baseline-graph.json > regression-results/baseline-graph.log 2>&1
          ../build-27b-baseline/bench/ninfer_bench "${args[@]}" --spec mtp --draft-tokens 3 --lm-head-draft \
            --output-file regression-results/baseline-mtp-3.json > regression-results/baseline-mtp-3.log 2>&1
          exit "$baseline_score_status"
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v100-27b-regression
          path: regression-results
          retention-days: 30

name: V100 SV7 Full Batched Prefix Oracle
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  CMAKE_BUILD_PARALLEL_LEVEL: 32
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Run host diagnostic checks
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover \
            -s tools/diagnostics -p 'test_v100*.py'
          git diff --check
  hardware:
    needs: checks
    runs-on: [self-hosted, v100, sm70, cuda-12-8, ninfer-phase11]
    concurrency:
      group: v100-sv0-hardware
      cancel-in-progress: false
    timeout-minutes: 120
    env:
      CUDA_VISIBLE_DEVICES: '0'
      NINFER_WEIGHTS: /models/qwen3-8b-flash-next
      NINFER_FLASH_NEXT_ORACLE_MANIFEST: /oracle/phase11/manifest.json
      NINFER_FLASH_NEXT_CPU_EXPERT_WORKERS: '32'
      NINFER_FLASH_NEXT_CPU_EXPERT_BACKEND: auto
      NINFER_FLASH_NEXT_FP32_HYPER_STATE: '1'
      NINFER_FLASH_NEXT_FP32_GDN_CONV: '1'
      NINFER_FLASH_NEXT_FP32_GDN_PROJECTION: '1'
      NINFER_FLASH_NEXT_FP32_GDN_READOUT: '1'
      NINFER_FLASH_NEXT_FP32_GDN_GATE: '1'
      NINFER_FLASH_NEXT_FP32_GDN_OUTPUT: '1'
      NINFER_FLASH_NEXT_FP32_GDN_OUTPUT_INPUT: '1'
      NINFER_FLASH_NEXT_FP32_HYPER_INJECT_INPUT: '1'
      NINFER_FLASH_NEXT_FP32_HYPER_INJECT_APPLY: '1'
      NINFER_FLASH_NEXT_FP32_MLP_HYPER_OUTPUT: '1'
      NINFER_FLASH_NEXT_FP32_MLP_HYPER_INPUT: '1'
      NINFER_FLASH_NEXT_FP32_MLP_HYPER_NORMALIZED: '1'
      NINFER_FLASH_NEXT_FP32_MLP_HYPER_LOW_RANK: '1'
      NINFER_FLASH_NEXT_FP32_MLP_HYPER_APPLY: '1'
      NINFER_FLASH_NEXT_FP32_MLP_HYPER_INJECTION: '1'
      NINFER_FLASH_NEXT_FP32_MOE_OUTPUT: '1'
      NINFER_FLASH_NEXT_FP32_ROUTER_INPUT: '0'
      NINFER_FLASH_NEXT_FP32_ROUTER_INPUT_LAYERS_32_47: '0'
      NINFER_FLASH_NEXT_FP32_MOE_ROUTED_INPUT: '0'
      NINFER_FLASH_NEXT_FP32_MOE_SHARED_INPUT: '0'
      NINFER_FLASH_NEXT_CPU_EXPERT_FP32_INTERMEDIATE: '0'
      NINFER_FLASH_NEXT_MOE_SHARED_FP32_INTERMEDIATE: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          clean: false
      - name: Prepare full-prefix numerical evidence
        run: |
          mkdir -p sv7-oracle-results
          find sv7-oracle-results -mindepth 1 -delete
      - name: Build the full-prefix oracle once and check V100 headroom
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD > sv7-oracle-results/candidate-sha.txt
          nvidia-smi -q > sv7-oracle-results/gpu.txt
          /usr/local/cuda-12.8/bin/nvcc --version > sv7-oracle-results/cuda.txt
          numactl --hardware > sv7-oracle-results/numa.txt
          test -f "$NINFER_WEIGHTS"
          test -r "$NINFER_WEIGHTS"
          free_mib=$(nvidia-smi --id=0 --query-gpu=memory.free \
            --format=csv,noheader,nounits | tr -d '[:space:]')
          if (( free_mib < 28000 )); then
            echo '::error::V100 lacks test headroom; no unrelated workloads were stopped.'
            exit 1
          fi
          cmake -S . -B build-sv6 -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CUDA_COMPILER=/usr/local/cuda-12.8/bin/nvcc \
            -DCMAKE_CUDA_ARCHITECTURES=70 -DNINFER_BUILD_MEDIA=OFF \
            -DNINFER_BUILD_APPS=ON -DNINFER_BUILD_BENCHMARKS=OFF -DBUILD_TESTING=ON
          cmake --build build-sv6 --target ninfer_qwen3_8_flash_next_vertical_slice_real_test \
            ninfer_qwen3_8_flash_next_vertical_slice_test
          build-sv6/tests/ninfer_qwen3_8_flash_next_vertical_slice_test \
            2>&1 | tee sv7-oracle-results/contracts.log
      - name: Unchanged Phase 11 criteria on all batched prefix positions in both arms
        shell: bash
        run: |
          set +e
          set -uo pipefail
          export NINFER_V100_SV7_BATCHED_ORACLE=1
          export NINFER_FLASH_NEXT_EXPERT_CACHE=0
          export NINFER_V100_TELEMETRY=1
          export NINFER_V100_PLE_IO=mmap
          export NINFER_V100_QSA_SCORE_COMPARE=0
          export NINFER_FLASH_NEXT_QSA_PREFILL_MMA=1
          unset NINFER_PHASE11_ORACLE_SMOKE_POSITIONS NINFER_PHASE11_PREFILL_PROBE_POSITIONS
          NINFER_V100_QSA_SCORE_MMA=0 build-sv6/tests/ninfer_qwen3_8_flash_next_vertical_slice_real_test \
            2>&1 | tee sv7-oracle-results/simt.log
          simt=$?
          NINFER_V100_QSA_SCORE_MMA=1 build-sv6/tests/ninfer_qwen3_8_flash_next_vertical_slice_real_test \
            2>&1 | tee sv7-oracle-results/mma.log
          mma=$?
          echo "simt=${simt} mma=${mma}" | tee sv7-oracle-results/status.txt
          python3 - <<'PYCODE'
          import json, pathlib
          for mode in ('simt','mma'):
              text=pathlib.Path('sv7-oracle-results/'+mode+'.log').read_text()
              rows=[]
              for line in text.splitlines():
                  try: row=json.loads(line)
                  except json.JSONDecodeError: continue
                  if row.get('kind')=='qsa_score_dispatch':rows.append(row)
              assert len(rows)==96, (mode, 'expected 12 QSA layers x 8 chunks',len(rows))
              assert all(row['tokens']==512 and row['fp8'] and row['mma']==(mode=='mma') for row in rows)
              assert 'phase11.positions=4096' in text and text.count('endpoint_logits_exact=1')==8
          PYCODE
          coverage=$?
          if (( simt != 0 || mma != 0 || coverage != 0 )); then
            echo "::error::Full independent oracle remains failed; simt=${simt} mma=${mma} coverage=${coverage}"
            exit 1
          fi
      - name: Preserve independent numerical evidence including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v100-sv7-oracle-${{ github.run_id }}-${{ github.run_attempt }}
          path: sv7-oracle-results/
          retention-days: 30
          if-no-files-found: warn

name: V100 Phase 11 Runtime

on:
  push:
    branches:
      - forwardport/v100-flash-next
  workflow_dispatch:

concurrency:
  group: v100-phase11-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  v100-phase11:
    name: V100 Phase 11 Runtime
    runs-on:
      - self-hosted
      - v100
      - sm70
      - cuda-12-8
      - ninfer-phase11

    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      # The Phase 11 targets link ninfer_ops, which makes Ninja compile every
      # ops translation unit. These attention kernels are Ampere-only and are
      # not part of the Phase 11 vertical slice. Keep this compile gate scoped
      # to Phase 11 rather than broadening the Volta port into unrelated work.
      - name: Isolate unrelated Ampere-only attention kernels
        shell: bash
        run: |
          set -euxo pipefail

          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/ops/softmax_attention/selected_block/selected_block_attention.cu')
          text = path.read_text()
          text = text.replace(
              '#include "prefill.cuh"',
              '#if !defined(NINFER_VOLTA_BUILD)\n#include "prefill.cuh"\n#endif'
          )

          marker = 'void selected_block_attention(const Tensor& query, const Tensor& positions,\n                                      int table_row,'
          start = text.index(marker)
          end = text.index('\n} // namespace ninfer::ops', start)

          body = text[start:end]

          text = (
              text[:start]
              + '#if !defined(NINFER_VOLTA_BUILD)\n'
              + body
              + '\n#endif\n'
              + text[end:]
          )

          path.write_text(text)

          cmake = Path('src/CMakeLists.txt')
          text = cmake.read_text()

          for source in (
              'ops/softmax_attention/dense/causal_cache/small_t.cu',
              'ops/softmax_attention/dense/causal_cache/small_t_fp8.cu',
              'ops/softmax_attention/dense/causal_cache/small_t_nvfp4.cu',
              'ops/softmax_attention/dense/causal_cache/small_t_k8v4.cu',
              'ops/softmax_attention/dense/causal_cache/prompt.cu',
              'ops/softmax_attention/dense/causal_cache/prompt_fp8.cu',
          ):
              text = text.replace(f'  {source}\n', '')

          cmake.write_text(text)
          PY

      - name: Verify V100 environment
        shell: bash
        run: |
          set -euxo pipefail

          echo "=== Git ==="
          git rev-parse HEAD
          git status --short

          echo "=== GPU ==="
          nvidia-smi

          echo "=== GPU details ==="
          nvidia-smi --query-gpu=name,uuid,memory.total,driver_version --format=csv

          echo "=== CUDA ==="
          nvcc --version

          echo "=== CMake ==="
          cmake --version

          echo "=== Ninja ==="
          ninja --version

          echo "=== CPU ==="
          lscpu

          echo "=== NUMA ==="
          numactl --hardware

          echo "=== PCI ==="
          lspci | grep -i -E 'nvidia|vga|3d'

          echo "=== Models ==="
          find /models -maxdepth 3 -type f | head -100

          echo "=== Oracle ==="
          find /oracle -maxdepth 3 -type f | head -100

          echo "=== Filesystems ==="
          df -h

          echo "=== Memory ==="
          free -h

      - name: Configure CUDA 12.8 SM70
        shell: bash
        run: |
          set -euxo pipefail

          cmake \
            -S . \
            -B build-v100 \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_CUDA_COMPILER=/usr/local/cuda-12.8/bin/nvcc \
            -DCMAKE_CUDA_ARCHITECTURES=70 \
            -DNINFER_BUILD_MEDIA=OFF \
            -DNINFER_BUILD_APPS=OFF \
            -DNINFER_BUILD_BENCHMARKS=OFF \
            -DBUILD_TESTING=ON

      - name: Build Phase 11 targets
        shell: bash
        run: |
          set -euxo pipefail

          cmake --build build-v100 \
            --target \
              ninfer_qwen3_8_flash_next_vertical_slice_test \
              ninfer_qwen3_8_flash_next_vertical_slice_real_test \
              ninfer_qwen3_8_flash_next_text_executor_test \
              ninfer_qwen3_8_flash_next_load_plan_test \
              ninfer_qwen3_8_flash_next_reference \
            -j "$(nproc)"

      - name: Run Phase 11 contract test
        shell: bash
        run: |
          set -euxo pipefail

          ctest \
            --test-dir build-v100 \
            --output-on-failure \
            -R '^ninfer_qwen3_8_flash_next_vertical_slice_test$'

      - name: Run physical V100 one-position smoke
        shell: bash
        env:
          NINFER_FLASH_NEXT_ORACLE_CHAT23_MAX_POSITIONS: "1"
        run: |
          set -euxo pipefail

          smoke_dir="${RUNNER_TEMP}/phase11-v100-smoke"
          rm -rf "$smoke_dir"
          mkdir -p "$smoke_dir"

          build-v100/tools/reference/qwen3_8_flash_next/ninfer_qwen3_8_flash_next_reference \
            -m /models/qwen3-8b-flash-next \
            --oracle-chat23-logits "$smoke_dir"

          test -s "$smoke_dir/pos0000_logits.bin"
          test "$(stat -c '%s' "$smoke_dir/pos0000_logits.bin")" -eq 496640

          echo "=== Smoke output ==="
          ls -lh "$smoke_dir"
          echo "=== GPU after smoke ==="
          nvidia-smi

      - name: Upload V100 smoke output
        uses: actions/upload-artifact@v4
        with:
          name: v100-phase11-smoke-${{ github.sha }}
          path: ${{ runner.temp }}/phase11-v100-smoke/
          if-no-files-found: error
          retention-days: 7

      - name: Report Phase 11 acceptance-oracle status
        shell: bash
        run: |
          set -euxo pipefail

          echo "The physical V100 runtime smoke above executed real model code."
          echo "The final Phase 11 correctness gate still requires a >=4096-position"
          echo "FP32 teacher-forced oracle manifest via NINFER_FLASH_NEXT_ORACLE_MANIFEST."
          echo "The 23-position BF16 chat diagnostic dump is not that acceptance oracle."

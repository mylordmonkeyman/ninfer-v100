name: V100 Phase 11 Runtime

on:
  push:
    branches:
      - forwardport/v100-flash-next
  workflow_dispatch:
    inputs:
      full_phase11:
        description: Run the full >=4096-position Phase 11 qualification oracle
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: v100-phase11-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  v100-phase11:
    name: V100 Phase 11 Runtime
    if: ${{ github.actor == github.repository_owner }}
    runs-on:
      - self-hosted
      - v100
      - sm70
      - cuda-12-8
      - ninfer-phase11

    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Validate oracle helper syntax
        shell: bash
        run: |
          set -euxo pipefail
          python3 -m py_compile \
            tools/reference/qwen3_8_flash_next/oracle/run_oracle.py \
            tools/reference/qwen3_8_flash_next/oracle/make_phase11_corpus.py \
            tools/reference/qwen3_8_flash_next/oracle/validate_phase11_oracle.py
          bash -n tools/reference/qwen3_8_flash_next/oracle/generate_phase11_oracle.sh

      - name: Verify V100 environment
        shell: bash
        run: |
          set -euxo pipefail

          git rev-parse HEAD
          nvidia-smi
          nvcc --version
          cmake --version
          ninja --version
          numactl --hardware
          test -r /models/qwen3-8b-flash-next
          test -r /oracle/cpu_seq/manifest.json

      - name: Validate mounted CPU oracle smoke
        shell: bash
        run: |
          set -euxo pipefail

          python3 - <<'PY'
          import json
          from pathlib import Path

          manifest = Path("/oracle/cpu_seq/manifest.json")
          root = json.loads(manifest.read_text())
          positions = root["positions"]
          expected = [248045, 846, 198, 20206]
          if len(positions) < len(expected):
              raise SystemExit(f"oracle has only {len(positions)} positions")

          for i, token_id in enumerate(expected):
              rec = positions[i]
              if rec["position"] != i:
                  raise SystemExit(f"oracle position {i} is not contiguous")
              if rec["token_id"] != token_id:
                  raise SystemExit(
                      f"oracle token {i}: expected {token_id}, got {rec['token_id']}"
                  )
              logits = next(
                  (t for t in rec["tensors"] if t["name"] == "logits"),
                  None,
              )
              if logits is None or logits["dtype"] != "FP32":
                  raise SystemExit(f"oracle position {i} is missing FP32 logits")
              path = manifest.parent / logits["file"]
              expected_bytes = int(logits["shape"][0]) * 4
              if not path.is_file() or path.stat().st_size != expected_bytes:
                  raise SystemExit(f"oracle logits file is invalid: {path}")

          print("Validated 4-position independent CPU FP32 oracle")
          PY

      - name: Configure CUDA 12.8 SM70
        shell: bash
        run: |
          set -euxo pipefail

          cmake \
            -S . \
            -B build-v100 \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_CUDA_COMPILER=/usr/local/cuda-12.8/bin/nvcc \
            -DCMAKE_CUDA_ARCHITECTURES=70 \
            -DNINFER_BUILD_MEDIA=OFF \
            -DNINFER_BUILD_APPS=OFF \
            -DNINFER_BUILD_BENCHMARKS=OFF \
            -DBUILD_TESTING=ON

      - name: Build Phase 11 targets
        shell: bash
        run: |
          set -euxo pipefail

          cmake --build build-v100 \
            --target \
              ninfer_qwen3_8_flash_next_vertical_slice_test \
              ninfer_qwen3_8_flash_next_vertical_slice_real_test \
              ninfer_qwen3_8_flash_next_text_executor_test \
              ninfer_qwen3_8_flash_next_load_plan_test \
              ninfer_selected_block_attention_test \
            -j "$(nproc)"

      - name: Run Phase 11 contract test
        shell: bash
        run: |
          set -euxo pipefail

          ctest \
            --test-dir build-v100 \
            --output-on-failure \
            -R '^ninfer_qwen3_8_flash_next_vertical_slice_test$'

      - name: Run selected-block attention FP64 oracle test
        shell: bash
        run: |
          set -euxo pipefail
          ctest \
            --test-dir build-v100 \
            --output-on-failure \
            -R '^ninfer_selected_block_attention_test$'

      - name: Compare baseline vs FP32 router input positions 0-6
        continue-on-error: true
        shell: bash
        env:
          NINFER_WEIGHTS: /models/qwen3-8b-flash-next
          NINFER_FLASH_NEXT_ORACLE_MANIFEST: /oracle/phase11/manifest.json
          NINFER_PHASE11_ORACLE_SMOKE_POSITIONS: "7"
          NINFER_FLASH_NEXT_CPU_EXPERT_WORKERS: "32"
          NINFER_FLASH_NEXT_CPU_EXPERT_BACKEND: reference
          NINFER_PHASE11_STAGE_ORACLE_ROOT: /oracle/phase11-stage-trace7
          NINFER_PHASE11_STAGE_ORACLE_ALL_POSITIONS: "1"
          NINFER_PHASE11_TRACE_POSITIONS: "1"
          NINFER_FLASH_NEXT_FP32_HYPER_STATE: "1"
          NINFER_FLASH_NEXT_FP32_GDN_CONV: "1"
          NINFER_FLASH_NEXT_FP32_GDN_PROJECTION: "1"
          NINFER_FLASH_NEXT_FP32_GDN_READOUT: "1"
          NINFER_FLASH_NEXT_FP32_GDN_GATE: "1"
          NINFER_FLASH_NEXT_FP32_GDN_OUTPUT: "1"
          NINFER_FLASH_NEXT_FP32_GDN_OUTPUT_INPUT: "1"
          NINFER_FLASH_NEXT_FP32_HYPER_INJECT_INPUT: "1"
          NINFER_FLASH_NEXT_FP32_HYPER_INJECT_APPLY: "1"
          NINFER_FLASH_NEXT_FP32_MLP_HYPER_OUTPUT: "1"
          NINFER_FLASH_NEXT_FP32_MLP_HYPER_INPUT: "1"
          NINFER_FLASH_NEXT_FP32_MLP_HYPER_NORMALIZED: "1"
          NINFER_FLASH_NEXT_FP32_MLP_HYPER_LOW_RANK: "1"
          NINFER_FLASH_NEXT_FP32_MLP_HYPER_APPLY: "1"
        run: |
          set -euxo pipefail
          test -r /oracle/phase11-stage-trace7/manifest.json
          test -r /oracle/phase11-stage-trace7/provenance.json
          result_dir="${GITHUB_WORKSPACE}/.v100-phase11-results/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$result_dir"
          : > "$result_dir/stage-localize-pos0-6.log"

          echo "=== baseline MoE intermediates ===" | tee -a "$result_dir/stage-localize-pos0-6.log"
          ctest --test-dir build-v100 -V \
            -R '^ninfer_qwen3_8_flash_next_vertical_slice_real_test$' \
            2>&1 | tee -a "$result_dir/stage-localize-pos0-6.log" || true

          echo "=== FP32 router input ===" | tee -a "$result_dir/stage-localize-pos0-6.log"
          NINFER_FLASH_NEXT_FP32_ROUTER_INPUT=1 \
            ctest --test-dir build-v100 -V \
              -R '^ninfer_qwen3_8_flash_next_vertical_slice_real_test$' \
              2>&1 | tee -a "$result_dir/stage-localize-pos0-6.log" || true

      - name: Generate 11-position CPU stage trace
        shell: bash
        env:
          NINFER_PHASE11_CORPUS: /oracle/phase11/token_ids.json
          NINFER_PHASE11_STAGE_POSITIONS: "11"
        run: |
          set -euxo pipefail

          test -x "$HOME/ninfer-v100/venv-oracle/bin/python"
          test -d /srv/ninfer/source/mixed
          test -d /srv/ninfer/source/ple/ples_int4
          trace_root="${RUNNER_TEMP}/phase11-stage-trace11"
          rm -rf -- "$trace_root"
          NINFER_PHASE11_PYTHON="$HOME/ninfer-v100/venv-oracle/bin/python" NINFER_PHASE11_STAGE_TRACE_DIR="$trace_root" tools/reference/qwen3_8_flash_next/oracle/generate_phase11_stage_trace.sh
          test -r "$trace_root/manifest.json"
          test -r "$trace_root/provenance.json"
          test -r "$trace_root/pos0010/logits.bin"

      - name: Localize positions 7-10 against CPU stage trace
        continue-on-error: true
        shell: bash
        env:
          NINFER_WEIGHTS: /models/qwen3-8b-flash-next
          NINFER_FLASH_NEXT_ORACLE_MANIFEST: /oracle/phase11/manifest.json
          NINFER_PHASE11_ORACLE_SMOKE_POSITIONS: "11"
          NINFER_FLASH_NEXT_CPU_EXPERT_WORKERS: "32"
          NINFER_FLASH_NEXT_CPU_EXPERT_BACKEND: reference
          NINFER_PHASE11_STAGE_ORACLE_ALL_POSITIONS: "1"
          NINFER_PHASE11_TRACE_POSITIONS: "1"
          NINFER_FLASH_NEXT_FP32_HYPER_STATE: "1"
          NINFER_FLASH_NEXT_FP32_GDN_CONV: "1"
          NINFER_FLASH_NEXT_FP32_GDN_PROJECTION: "1"
          NINFER_FLASH_NEXT_FP32_GDN_READOUT: "1"
          NINFER_FLASH_NEXT_FP32_GDN_GATE: "1"
          NINFER_FLASH_NEXT_FP32_GDN_OUTPUT: "1"
          NINFER_FLASH_NEXT_FP32_GDN_OUTPUT_INPUT: "1"
          NINFER_FLASH_NEXT_FP32_HYPER_INJECT_INPUT: "1"
          NINFER_FLASH_NEXT_FP32_HYPER_INJECT_APPLY: "1"
          NINFER_FLASH_NEXT_FP32_MLP_HYPER_OUTPUT: "1"
          NINFER_FLASH_NEXT_FP32_MLP_HYPER_INPUT: "1"
          NINFER_FLASH_NEXT_FP32_MLP_HYPER_NORMALIZED: "1"
          NINFER_FLASH_NEXT_FP32_MLP_HYPER_LOW_RANK: "1"
          NINFER_FLASH_NEXT_FP32_MLP_HYPER_APPLY: "1"
        run: |
          set -euxo pipefail
          export NINFER_PHASE11_STAGE_ORACLE_ROOT="${RUNNER_TEMP}/phase11-stage-trace11"
          test -r "$NINFER_PHASE11_STAGE_ORACLE_ROOT/pos0007/logits.bin"
          test -r "$NINFER_PHASE11_STAGE_ORACLE_ROOT/pos0010/logits.bin"
          result_dir="${GITHUB_WORKSPACE}/.v100-phase11-results/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$result_dir"
          : > "$result_dir/stage-localize-pos7-10.log"

          echo "=== 11-position strong baseline ===" | tee -a "$result_dir/stage-localize-pos7-10.log"
          ctest --test-dir build-v100 -V -R '^ninfer_qwen3_8_flash_next_vertical_slice_real_test$' 2>&1 | tee -a "$result_dir/stage-localize-pos7-10.log" || true

          echo "=== 11-position FP32 router input ===" | tee -a "$result_dir/stage-localize-pos7-10.log"
          NINFER_FLASH_NEXT_FP32_ROUTER_INPUT=1 ctest --test-dir build-v100 -V -R '^ninfer_qwen3_8_flash_next_vertical_slice_real_test$' 2>&1 | tee -a "$result_dir/stage-localize-pos7-10.log" || true

      - name: Compare 32-position strong baseline vs FP32 router input
        continue-on-error: true
        shell: bash
        env:
          NINFER_WEIGHTS: /models/qwen3-8b-flash-next
          NINFER_FLASH_NEXT_ORACLE_MANIFEST: /oracle/phase11/manifest.json
          NINFER_PHASE11_ORACLE_SMOKE_POSITIONS: "32"
          NINFER_PHASE11_TRACE_POSITIONS: "1"
          NINFER_FLASH_NEXT_CPU_EXPERT_WORKERS: "32"
          NINFER_FLASH_NEXT_CPU_EXPERT_BACKEND: reference
          NINFER_FLASH_NEXT_FP32_HYPER_STATE: "1"
          NINFER_FLASH_NEXT_FP32_GDN_CONV: "1"
          NINFER_FLASH_NEXT_FP32_GDN_PROJECTION: "1"
          NINFER_FLASH_NEXT_FP32_GDN_READOUT: "1"
          NINFER_FLASH_NEXT_FP32_GDN_GATE: "1"
          NINFER_FLASH_NEXT_FP32_GDN_OUTPUT: "1"
          NINFER_FLASH_NEXT_FP32_GDN_OUTPUT_INPUT: "1"
          NINFER_FLASH_NEXT_FP32_HYPER_INJECT_INPUT: "1"
          NINFER_FLASH_NEXT_FP32_HYPER_INJECT_APPLY: "1"
          NINFER_FLASH_NEXT_FP32_MLP_HYPER_OUTPUT: "1"
          NINFER_FLASH_NEXT_FP32_MLP_HYPER_INPUT: "1"
          NINFER_FLASH_NEXT_FP32_MLP_HYPER_NORMALIZED: "1"
          NINFER_FLASH_NEXT_FP32_MLP_HYPER_LOW_RANK: "1"
          NINFER_FLASH_NEXT_FP32_MLP_HYPER_APPLY: "1"
        run: |
          set -euxo pipefail
          test -r /oracle/phase11/manifest.json
          python3 tools/reference/qwen3_8_flash_next/oracle/validate_phase11_oracle.py --corpus /oracle/phase11/token_ids.json --manifest /oracle/phase11/manifest.json --minimum 4096
          result_dir="${GITHUB_WORKSPACE}/.v100-phase11-results/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$result_dir"

          echo "=== 32-position strong baseline ===" | tee "$result_dir/oracle-32-strong-trace.log"
          ctest --test-dir build-v100 -V \
            -R '^ninfer_qwen3_8_flash_next_vertical_slice_real_test$' \
            2>&1 | tee -a "$result_dir/oracle-32-strong-trace.log" || true

          echo "=== 32-position FP32 router input ===" | tee -a "$result_dir/oracle-32-strong-trace.log"
          NINFER_FLASH_NEXT_FP32_ROUTER_INPUT=1 \
            ctest --test-dir build-v100 -V \
              -R '^ninfer_qwen3_8_flash_next_vertical_slice_real_test$' \
              2>&1 | tee -a "$result_dir/oracle-32-strong-trace.log" || true

      - name: Isolate layer-0 GDN causal convolution
        continue-on-error: true
        shell: bash
        env:
          NINFER_WEIGHTS: /models/qwen3-8b-flash-next
          NINFER_FLASH_NEXT_ORACLE_MANIFEST: /oracle/phase11/manifest.json
          NINFER_PHASE11_ORACLE_SMOKE_POSITIONS: "7"
          NINFER_PHASE11_GDN_CONV_ISOLATION_ROOT: /oracle/phase11-stage-trace7
        run: |
          set -euxo pipefail
          test -r /oracle/phase11-stage-trace7/pos0000/L00_gdn_projected.bin
          test -r /oracle/phase11-stage-trace7/pos0000/L00_gdn_query.bin
          test -r /oracle/phase11-stage-trace7/pos0000/L00_gdn_key.bin
          test -r /oracle/phase11-stage-trace7/pos0000/L00_gdn_value.bin
          result_dir="${GITHUB_WORKSPACE}/.v100-phase11-results/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$result_dir"
          ctest --test-dir build-v100 -V \
            -R '^ninfer_qwen3_8_flash_next_vertical_slice_real_test$' \
            2>&1 | tee "$result_dir/gdn-conv-isolation-pos0.log"

      # A [full-phase11] push opts into the expensive full-oracle qualification.
      - name: Validate full Phase 11 oracle
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.full_phase11) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[full-phase11]')) }}
        shell: bash
        run: |
          set -euxo pipefail

          test -r /oracle/phase11/manifest.json
          test -r /oracle/phase11/token_ids.json
          test -r /oracle/phase11/provenance.json
          python3 tools/reference/qwen3_8_flash_next/oracle/validate_phase11_oracle.py \
            --corpus /oracle/phase11/token_ids.json \
            --manifest /oracle/phase11/manifest.json \
            --minimum 4096

      - name: Run full Phase 11 qualification
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.full_phase11) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[full-phase11]')) }}
        shell: bash
        env:
          NINFER_WEIGHTS: /models/qwen3-8b-flash-next
          NINFER_FLASH_NEXT_ORACLE_MANIFEST: /oracle/phase11/manifest.json
        run: |
          set -euxo pipefail

          result_dir="${GITHUB_WORKSPACE}/.v100-phase11-results/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$result_dir"

          ctest \
            --test-dir build-v100 \
            -V \
            -R '^ninfer_qwen3_8_flash_next_vertical_slice_real_test$' \
            2>&1 | tee "$result_dir/oracle-full.log"

      - name: Capture final GPU state
        if: always()
        shell: bash
        run: |
          set +e
          result_dir="${GITHUB_WORKSPACE}/.v100-phase11-results/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$result_dir"
          nvidia-smi | tee "$result_dir/nvidia-smi.txt"
          git rev-parse HEAD | tee "$result_dir/commit.txt"

      - name: Upload Phase 11 results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v100-phase11-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ github.workspace }}/.v100-phase11-results/${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: warn
          retention-days: 14

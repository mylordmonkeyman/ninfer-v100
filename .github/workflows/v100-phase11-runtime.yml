name: V100 Phase 11 Runtime

on:
  push:
    branches:
      - forwardport/v100-flash-next
  workflow_dispatch:
    inputs:
      full_phase11:
        description: Run the full >=4096-position Phase 11 qualification oracle
        required: false
        default: false
        type: boolean

concurrency:
  group: v100-phase11-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  v100-phase11:
    name: V100 Phase 11 Runtime
    runs-on:
      - self-hosted
      - v100
      - sm70
      - cuda-12-8
      - ninfer-phase11

    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Validate oracle helper syntax
        shell: bash
        run: |
          set -euxo pipefail
          python3 -m py_compile tools/reference/qwen3_8_flash_next/oracle/run_oracle.py

      # The Phase 11 targets link ninfer_ops, which makes Ninja compile every
      # ops translation unit. These attention kernels are Ampere-only and are
      # not part of the Phase 11 vertical slice. Keep this compile gate scoped
      # to Phase 11 rather than broadening the Volta port into unrelated work.
      - name: Isolate unrelated Ampere-only attention kernels
        shell: bash
        run: |
          set -euxo pipefail

          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/ops/softmax_attention/selected_block/selected_block_attention.cu')
          text = path.read_text()
          text = text.replace(
              '#include "prefill.cuh"',
              '#if !defined(NINFER_VOLTA_BUILD)\n#include "prefill.cuh"\n#endif'
          )

          marker = 'void selected_block_attention(const Tensor& query, const Tensor& positions,\n                                      int table_row,'
          start = text.index(marker)
          end = text.index('\n} // namespace ninfer::ops', start)

          body = text[start:end]

          text = (
              text[:start]
              + '#if !defined(NINFER_VOLTA_BUILD)\n'
              + body
              + '\n#endif\n'
              + text[end:]
          )

          path.write_text(text)

          cmake = Path('src/CMakeLists.txt')
          text = cmake.read_text()

          for source in (
              'ops/softmax_attention/dense/causal_cache/small_t.cu',
              'ops/softmax_attention/dense/causal_cache/small_t_fp8.cu',
              'ops/softmax_attention/dense/causal_cache/small_t_nvfp4.cu',
              'ops/softmax_attention/dense/causal_cache/small_t_k8v4.cu',
              'ops/softmax_attention/dense/causal_cache/prompt.cu',
              'ops/softmax_attention/dense/causal_cache/prompt_fp8.cu',
          ):
              text = text.replace(f'  {source}\n', '')

          cmake.write_text(text)
          PY

      - name: Verify V100 environment
        shell: bash
        run: |
          set -euxo pipefail

          git rev-parse HEAD
          nvidia-smi
          nvcc --version
          cmake --version
          ninja --version
          numactl --hardware
          test -r /models/qwen3-8b-flash-next
          test -r /oracle/cpu_seq/manifest.json

      - name: Validate mounted CPU oracle smoke
        shell: bash
        run: |
          set -euxo pipefail

          python3 - <<'PY'
          import json
          from pathlib import Path

          manifest = Path("/oracle/cpu_seq/manifest.json")
          root = json.loads(manifest.read_text())
          positions = root["positions"]
          expected = [248045, 846, 198, 20206]
          if len(positions) < len(expected):
              raise SystemExit(f"oracle has only {len(positions)} positions")

          for i, token_id in enumerate(expected):
              rec = positions[i]
              if rec["position"] != i:
                  raise SystemExit(f"oracle position {i} is not contiguous")
              if rec["token_id"] != token_id:
                  raise SystemExit(
                      f"oracle token {i}: expected {token_id}, got {rec['token_id']}"
                  )
              logits = next(
                  (t for t in rec["tensors"] if t["name"] == "logits"),
                  None,
              )
              if logits is None or logits["dtype"] != "FP32":
                  raise SystemExit(f"oracle position {i} is missing FP32 logits")
              path = manifest.parent / logits["file"]
              expected_bytes = int(logits["shape"][0]) * 4
              if not path.is_file() or path.stat().st_size != expected_bytes:
                  raise SystemExit(f"oracle logits file is invalid: {path}")

          print("Validated 4-position independent CPU FP32 oracle")
          PY

      - name: Configure CUDA 12.8 SM70
        shell: bash
        run: |
          set -euxo pipefail

          cmake \
            -S . \
            -B build-v100 \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_CUDA_COMPILER=/usr/local/cuda-12.8/bin/nvcc \
            -DCMAKE_CUDA_ARCHITECTURES=70 \
            -DNINFER_BUILD_MEDIA=OFF \
            -DNINFER_BUILD_APPS=OFF \
            -DNINFER_BUILD_BENCHMARKS=OFF \
            -DBUILD_TESTING=ON

      - name: Build Phase 11 targets
        shell: bash
        run: |
          set -euxo pipefail

          cmake --build build-v100 \
            --target \
              ninfer_qwen3_8_flash_next_vertical_slice_test \
              ninfer_qwen3_8_flash_next_vertical_slice_real_test \
              ninfer_qwen3_8_flash_next_text_executor_test \
              ninfer_qwen3_8_flash_next_load_plan_test \
            -j "$(nproc)"

      - name: Run Phase 11 contract test
        shell: bash
        run: |
          set -euxo pipefail

          ctest \
            --test-dir build-v100 \
            --output-on-failure \
            -R '^ninfer_qwen3_8_flash_next_vertical_slice_test$'

      - name: Run 4-position independent CPU-oracle smoke
        shell: bash
        env:
          NINFER_WEIGHTS: /models/qwen3-8b-flash-next
          NINFER_FLASH_NEXT_ORACLE_MANIFEST: /oracle/cpu_seq/manifest.json
          NINFER_PHASE11_ORACLE_SMOKE_POSITIONS: "4"
        run: |
          set -euxo pipefail

          result_dir="${GITHUB_WORKSPACE}/.v100-phase11-results/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$result_dir"

          ctest \
            --test-dir build-v100 \
            -V \
            -R '^ninfer_qwen3_8_flash_next_vertical_slice_real_test$' \
            2>&1 | tee "$result_dir/oracle-smoke.log"

      - name: Validate full Phase 11 oracle
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.full_phase11 }}
        shell: bash
        run: |
          set -euxo pipefail

          test -r /oracle/phase11/manifest.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          manifest = Path("/oracle/phase11/manifest.json")
          positions = json.loads(manifest.read_text())["positions"]
          if len(positions) < 4096:
              raise SystemExit(
                  f"full Phase 11 oracle has only {len(positions)} positions"
              )
          print(f"Validated full Phase 11 oracle metadata: {len(positions)} positions")
          PY

      - name: Run full Phase 11 qualification
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.full_phase11 }}
        shell: bash
        env:
          NINFER_WEIGHTS: /models/qwen3-8b-flash-next
          NINFER_FLASH_NEXT_ORACLE_MANIFEST: /oracle/phase11/manifest.json
        run: |
          set -euxo pipefail

          result_dir="${GITHUB_WORKSPACE}/.v100-phase11-results/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$result_dir"

          ctest \
            --test-dir build-v100 \
            -V \
            -R '^ninfer_qwen3_8_flash_next_vertical_slice_real_test$' \
            2>&1 | tee "$result_dir/oracle-full.log"

      - name: Capture final GPU state
        if: always()
        shell: bash
        run: |
          set +e
          result_dir="${GITHUB_WORKSPACE}/.v100-phase11-results/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$result_dir"
          nvidia-smi | tee "$result_dir/nvidia-smi.txt"
          git rev-parse HEAD | tee "$result_dir/commit.txt"

      - name: Upload Phase 11 results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v100-phase11-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ github.workspace }}/.v100-phase11-results/${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: warn
          retention-days: 14

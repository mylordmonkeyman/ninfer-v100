name: V100 Phase 11 Runtime

on:
  push:
    branches:
      - forwardport/v100-flash-next-omp
  workflow_dispatch:
    inputs:
      full_phase11:
        description: Run the full >=4096-position Phase 11 qualification oracle
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: v100-phase11-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  v100-phase11:
    name: V100 Phase 11 Runtime
    if: ${{ github.actor == github.repository_owner }}
    environment: "Oh my pi"
    runs-on:
      - self-hosted
      - v100
      - sm70
      - cuda-12-8
      - ninfer-phase11

    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Validate oracle helper syntax
        shell: bash
        run: |
          set -euxo pipefail
          python3 -m py_compile \
            tools/reference/qwen3_8_flash_next/oracle/analyze_error_decomposition.py \
            tools/reference/qwen3_8_flash_next/oracle/analyze_flip_margins.py \
            tools/reference/qwen3_8_flash_next/oracle/run_oracle.py \
            tools/reference/qwen3_8_flash_next/oracle/make_phase11_corpus.py \
            tools/reference/qwen3_8_flash_next/oracle/audit_qsa_oproj_host.py \
            tools/reference/qwen3_8_flash_next/oracle/validate_phase11_oracle.py
          bash -n tools/reference/qwen3_8_flash_next/oracle/generate_phase11_oracle.sh

      - name: Verify V100 environment
        shell: bash
        run: |
          set -euxo pipefail

          git rev-parse HEAD
          nvidia-smi
          nvcc --version
          cmake --version
          ninja --version
          numactl --hardware
          test -r /models/qwen3-8b-flash-next
          test -r /oracle/cpu_seq/manifest.json

      - name: Validate mounted CPU oracle smoke
        shell: bash
        run: |
          set -euxo pipefail

          python3 - <<'PY'
          import json
          from pathlib import Path

          manifest = Path("/oracle/cpu_seq/manifest.json")
          root = json.loads(manifest.read_text())
          positions = root["positions"]
          expected = [248045, 846, 198, 20206]
          if len(positions) < len(expected):
              raise SystemExit(f"oracle has only {len(positions)} positions")

          for i, token_id in enumerate(expected):
              rec = positions[i]
              if rec["position"] != i:
                  raise SystemExit(f"oracle position {i} is not contiguous")
              if rec["token_id"] != token_id:
                  raise SystemExit(
                      f"oracle token {i}: expected {token_id}, got {rec['token_id']}"
                  )
              logits = next(
                  (t for t in rec["tensors"] if t["name"] == "logits"),
                  None,
              )
              if logits is None or logits["dtype"] != "FP32":
                  raise SystemExit(f"oracle position {i} is missing FP32 logits")
              path = manifest.parent / logits["file"]
              expected_bytes = int(logits["shape"][0]) * 4
              if not path.is_file() or path.stat().st_size != expected_bytes:
                  raise SystemExit(f"oracle logits file is invalid: {path}")

          print("Validated 4-position independent CPU FP32 oracle")
          PY

      - name: Reserve the GPU from llama-swap
        shell: bash
        run: |
          set -euxo pipefail

          # This runner shares the V100 with the agent's own inference model,
          # which llama-swap (127.0.0.1:9292) keeps loaded (~30 GiB). Unload it
          # and wait for the GPU here: the agent typically goes idle between
          # sessions, so the run waits in place (up to 90 minutes, re-issuing
          # the unload every 60 s) instead of failing and burning the run.
          swap_base=http://127.0.0.1:9292
          agent_model=qwen3.8-27b-omp

          unload() {
            code=$(curl -s -m 10 -X POST -o /tmp/unload-response.json -w '%{http_code}' \
              "$swap_base/api/models/unload/$agent_model" || true)
            echo "unload $agent_model -> HTTP $code: $(head -c 200 /tmp/unload-response.json 2>/dev/null)"
          }
          unload
          case "$code" in
            200|204|404) ;;  # 404: not loaded (or unknown name)
            000) echo "WARNING: llama-swap (127.0.0.1:9292) is not reachable from the runner (separate network namespace)."
                 echo "The agent side must have pre-unloaded the model; the nvidia-smi poll below is the real gate." ;;
            *) echo "WARNING: llama-swap unload request failed (HTTP $code); the nvidia-smi poll below is the real gate." ;;
          esac

          required_free_mib=20480
          deadline=$(( $(date +%s) + 5400 ))
          last_unload=0
          while :; do
            free_mib=$(nvidia-smi --query-gpu=memory.free --format=csv,noheader,nounits | head -n1 | tr -d '[:space:]')
            echo "GPU free memory: ${free_mib} MiB (need at least ${required_free_mib} MiB)"
            if [ "$free_mib" -ge "$required_free_mib" ]; then
              echo "GPU is available; proceeding"
              break
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "ERROR: GPU free memory stayed below ${required_free_mib} MiB for 90 minutes after unloading the agent model." >&2
              echo "The V100 is contended (the agent model is loaded or the agent is actively in use). Keep the agent on this V100 idle and re-run this workflow." >&2
              exit 1
            fi
            now=$(date +%s)
            if [ $(( now - last_unload )) -ge 60 ]; then
              last_unload=$now
              unload
            fi
            sleep 15
          done

      - name: Configure CUDA 12.8 SM70
        shell: bash
        run: |
          set -euxo pipefail

          cmake \
            -S . \
            -B build-v100 \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_CUDA_COMPILER=/usr/local/cuda-12.8/bin/nvcc \
            -DCMAKE_CUDA_ARCHITECTURES=70 \
            -DNINFER_BUILD_MEDIA=OFF \
            -DNINFER_BUILD_APPS=OFF \
            -DNINFER_BUILD_BENCHMARKS=OFF \
            -DBUILD_TESTING=ON

      - name: Build Phase 11 targets
        shell: bash
        run: |
          set -euxo pipefail

          cmake --build build-v100 \
            --target \
              ninfer_qwen3_8_flash_next_vertical_slice_test \
              ninfer_qwen3_8_flash_next_vertical_slice_real_test \
              ninfer_qwen3_8_flash_next_text_executor_test \
              ninfer_qwen3_8_flash_next_load_plan_test \
              ninfer_selected_block_attention_test \
            -j "$(nproc)"

      - name: Run Phase 11 contract test
        shell: bash
        run: |
          set -euxo pipefail

          ctest \
            --test-dir build-v100 \
            --output-on-failure \
            -R '^ninfer_qwen3_8_flash_next_vertical_slice_test$'

      - name: Run selected-block attention FP64 oracle test
        shell: bash
        run: |
          set -euxo pipefail
          ctest \
            --test-dir build-v100 \
            --output-on-failure \
            -R '^ninfer_selected_block_attention_test$'

      - name: Verify mounted 14-position CPU stage trace
        shell: bash
        run: |
          set -euxo pipefail

          test -r /oracle/phase11-stage-trace14/manifest.json
          test -r /oracle/phase11-stage-trace14/provenance.json
          test -r /oracle/phase11-stage-trace14/pos0013/logits.bin
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path("/oracle/phase11-stage-trace14")
          manifest = json.loads((root / "manifest.json").read_text())
          positions = manifest["positions"]
          if len(positions) != 14:
              raise SystemExit(f"expected 14 stage-trace positions, got {len(positions)}")
          if positions[-1]["position"] != 13:
              raise SystemExit("stage trace does not end at position 13")
          tensors = positions[-1].get("tensors", [])
          if len(tensors) < 800:
              raise SystemExit(f"position 13 stage trace is unexpectedly sparse: {len(tensors)} tensors")
          print(f"Validated mounted 14-position CPU stage trace with {len(tensors)} position-13 tensors")
          PY

      - name: Analyze oracle top-1 margins at measured flip positions
        shell: bash
        run: |
          set -euxo pipefail

          test -r /oracle/phase11/manifest.json
          result_dir="${GITHUB_WORKSPACE}/.v100-phase11-results/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$result_dir"
          python3 tools/reference/qwen3_8_flash_next/oracle/analyze_flip_margins.py \
            --manifest /oracle/phase11/manifest.json \
            --trace tools/reference/qwen3_8_flash_next/oracle/phase11_trace_4096_f6ba1ed3.csv \
            --out "$result_dir/flip-margins.txt"

      - name: Measure full-layer error decomposition
        shell: bash
        env:
          NINFER_WEIGHTS: /models/qwen3-8b-flash-next
          NINFER_FLASH_NEXT_ORACLE_MANIFEST: /oracle/phase11/manifest.json
          NINFER_PHASE11_ORACLE_SMOKE_POSITIONS: "14"
          NINFER_FLASH_NEXT_CPU_EXPERT_WORKERS: "32"
          NINFER_FLASH_NEXT_CPU_EXPERT_BACKEND: reference
          NINFER_PHASE11_STAGE_ORACLE_ROOT: /oracle/phase11-stage-trace14
          NINFER_PHASE11_STAGE_ORACLE_POSITION: "13"
          NINFER_PHASE11_STAGE_ORACLE_ALL_POSITIONS: "1"
          NINFER_PHASE11_TRACE_POSITIONS: "1"
          NINFER_FLASH_NEXT_FP32_HYPER_STATE: "1"
          NINFER_FLASH_NEXT_FP32_GDN_CONV: "1"
          NINFER_FLASH_NEXT_FP32_GDN_PROJECTION: "1"
          NINFER_FLASH_NEXT_FP32_GDN_READOUT: "1"
          NINFER_FLASH_NEXT_FP32_GDN_GATE: "1"
          NINFER_FLASH_NEXT_FP32_GDN_OUTPUT: "1"
          NINFER_FLASH_NEXT_FP32_GDN_OUTPUT_INPUT: "1"
          NINFER_FLASH_NEXT_FP32_HYPER_INJECT_INPUT: "1"
          NINFER_FLASH_NEXT_FP32_HYPER_INJECT_APPLY: "1"
          NINFER_FLASH_NEXT_FP32_MLP_HYPER_OUTPUT: "1"
          NINFER_FLASH_NEXT_FP32_MLP_HYPER_INPUT: "1"
          NINFER_FLASH_NEXT_FP32_MLP_HYPER_NORMALIZED: "1"
          NINFER_FLASH_NEXT_FP32_MLP_HYPER_LOW_RANK: "1"
          NINFER_FLASH_NEXT_FP32_MLP_HYPER_APPLY: "1"
          NINFER_FLASH_NEXT_FP32_MLP_HYPER_INJECTION: "1"
        run: |
          set -euxo pipefail
          result_dir="${GITHUB_WORKSPACE}/.v100-phase11-results/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$result_dir"
          preflight_log="$result_dir/error-decomposition-preflight.log"
          {
            echo "llama-swap /v1/models:"
            curl -s -m 10 http://127.0.0.1:9292/v1/models || echo "(llama-swap unreachable)"
            echo
            echo "nvidia-smi:"
            nvidia-smi
          } > "$preflight_log" 2>&1 || true
          # Fail fast if the agent model was reloaded mid-run: any chat request
          # to the agent lazy-loads qwen3.8-27b-omp back onto this V100 and
          # would contend with the test.
          if curl -s -m 10 http://127.0.0.1:9292/v1/models \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); sys.exit(0 if any(m["id"]=="qwen3.8-27b-omp" and m.get("status",{}).get("value")=="loaded" for m in d["data"]) else 1)'; then
            echo "ERROR: agent model qwen3.8-27b-omp was reloaded during this run; the GPU is contended." >&2
            echo "Re-run the workflow when the agent is idle." >&2
            cat "$preflight_log" >&2
            loaded=$(curl -s -m 10 http://127.0.0.1:9292/v1/models \
              | python3 -c 'import json,sys; d=json.load(sys.stdin); print(",".join(m["id"] for m in d["data"] if m.get("status",{}).get("value")=="loaded") or "none")' \
              2>/dev/null || echo "llama-swap unreachable")
            gpu=$(nvidia-smi --query-gpu=memory.used,memory.total --format=csv,noheader 2>/dev/null | head -1 || true)
            echo "::error file=.github/workflows/v100-phase11-runtime.yml::GPU contended at decomposition preflight; loaded models: ${loaded}; gpu: ${gpu:-n/a}"
            exit 1
          fi
          oracle_root="${NINFER_PHASE11_STAGE_ORACLE_ROOT:-UNSET}"
          if ! test -r "${oracle_root}/pos0013/L00_mlp_block_input.bin"; then
            root_listing=$(ls -la "${oracle_root}/" 2>/dev/null | head -12 | tr '\n' ';' | tr -s ' ' || true)
            pos_listing=$(ls -la "${oracle_root}/pos0013/" 2>/dev/null | head -20 | tr '\n' ';' | tr -s ' ' || true)
            mounts=$(grep oracle /proc/mounts 2>/dev/null | head -5 | tr '\n' ';' || true)
            echo "::error file=.github/workflows/v100-phase11-runtime.yml::stage oracle unreadable: ${oracle_root}/pos0013/L00_mlp_block_input.bin; root: ${root_listing:-<unlistable>}; pos0013: ${pos_listing:-<unlistable>}; mounts: ${mounts:-<no oracle entry in /proc/mounts>}"
            echo "ERROR: stage oracle file is unreadable: ${oracle_root}/pos0013/L00_mlp_block_input.bin" >&2
            exit 1
          fi
          result_log="$result_dir/error-decomposition.log"
          ctest --test-dir build-v100 -V \
            -R '^ninfer_qwen3_8_flash_next_vertical_slice_real_test$' \
            2>&1 | tee "$result_log" || true
          gpu_end=$(nvidia-smi --query-gpu=memory.used,memory.total --format=csv,noheader 2>/dev/null | head -1 || true)
          models_end=$(curl -s -m 10 http://127.0.0.1:9292/v1/models \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); print(",".join(m["id"] for m in d["data"] if m.get("status",{}).get("value")=="loaded") or "none")' \
            2>/dev/null || echo "llama-swap unreachable")
          mem_end=$(free -m 2>/dev/null | awk '/^Mem:/{print $3"MiB/"$2"MiB used"}' || true)
          NINFER_DIAG_GPU="${gpu_end:-n/a}" NINFER_DIAG_MODELS="${models_end:-n/a}" NINFER_DIAG_MEM="${mem_end:-n/a}" \
          python3 - "$result_log" <<'PY'
          from pathlib import Path
          import os
          import sys
          diag = (f"gpu: {os.environ.get('NINFER_DIAG_GPU', 'n/a')}; "
                  f"loaded models after run: {os.environ.get('NINFER_DIAG_MODELS', 'n/a')}; "
                  f"host mem: {os.environ.get('NINFER_DIAG_MEM', 'n/a')}")
          log_path = Path(sys.argv[1])
          if not log_path.exists():
              print("::error file=.github/workflows/v100-phase11-runtime.yml::decomposition log missing; ctest produced no file at " + sys.argv[1] + "; " + diag)
              raise SystemExit("error-decomposition.log missing")
          data = log_path.read_text()
          lines = [line.strip() for line in data.splitlines()]
          tail = " | ".join(line for line in lines if line)[-2500:]
          decomposition = [line for line in lines
                           if "phase11.error_decomposition.position=" in line]
          position_13 = [line for line in decomposition
                         if "phase11.error_decomposition.position=13 " in line]
          if len(decomposition) < 9000:
              print("::error file=.github/workflows/v100-phase11-runtime.yml::decomposition coverage "
                    f"{len(decomposition)}/9000 (log {len(data)} bytes); {diag}; tail: {tail}")
              raise SystemExit(
                  f"Expected full-layer decomposition coverage, got {len(decomposition)} stage lines")
          if len(position_13) < 700:
              print("::error file=.github/workflows/v100-phase11-runtime.yml::position-13 coverage "
                    f"{len(position_13)}/700 (decomposition {len(decomposition)}); {diag}; tail: {tail}")
              raise SystemExit(
                  f"Position-13 decomposition coverage is unexpectedly sparse: {len(position_13)} stages")
          if "phase11.stage_trace.position=13 stage=L24_attn_block_input" not in data or \
             "phase11.top1_agreement=" not in data:
              print("::error file=.github/workflows/v100-phase11-runtime.yml::decomposition run did not reach position 13 (log "
                    f"{len(data)} bytes); {diag}; tail: {tail}")
              raise SystemExit("Error decomposition run did not reach position 13")
          PY
          python3 tools/reference/qwen3_8_flash_next/oracle/analyze_error_decomposition.py \
            --log "$result_log" --out-dir "$result_dir" \
            | tee "$result_dir/error-decomposition-summary.txt"

      - name: Audit QSA o_proj stage error on host (pure FP64)
        continue-on-error: true
        shell: bash
        run: |
          set -euxo pipefail

          result_dir="${GITHUB_WORKSPACE}/.v100-phase11-results/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          result_log="$result_dir/error-decomposition.log"
          test -r "$result_log"
          # Fresh device NRMSE for the audited stage from this run's decomposition
          # (same configuration, same position), so the host/device comparison is
          # self-consistent.
          device_nrmse=$(sed -n 's/^[0-9]\{1,\}: *phase11\.stage_trace\.position=2 stage=L15_attn_block_output cosine=[^ ]* nrmse=\([0-9.]*\).*/\1/p' "$result_log")
          if [ -z "$device_nrmse" ]; then
            echo "ERROR: no stage_trace line for position=2 stage=L15_attn_block_output in $result_log" >&2
            exit 1
          fi
          echo "device nrmse(L15_attn_block_output, position=2) = $device_nrmse"
          model_dir="${NINFER_AUDIT_MODEL:-/srv/ninfer/source/mixed}"
          stage_root="${NINFER_AUDIT_STAGES:-/oracle/phase11-stage-trace14}"
          test -r "$stage_root/pos0002/L15_qsa_gated.bin"
          test -r "$stage_root/pos0002/L15_attn_block_output.bin"
          test -r "$stage_root/pos0002/L15_attn_block_input.bin"
          if ! ls "$model_dir"/*.safetensors >/dev/null 2>&1; then
            echo "ERROR: no readable safetensors under $model_dir; make the mixed source checkpoint readable to the runner user" >&2
            exit 1
          fi
          python3 tools/reference/qwen3_8_flash_next/oracle/audit_qsa_oproj_host.py \
            15 2 --device-nrmse "$device_nrmse" \
            | tee "$result_dir/qsa-oproj-audit-l15-pos2.txt"

      - name: Replay oracle PLE injection across 14 positions
        continue-on-error: true
        shell: bash
        env:
          NINFER_WEIGHTS: /models/qwen3-8b-flash-next
          NINFER_FLASH_NEXT_ORACLE_MANIFEST: /oracle/phase11/manifest.json
          NINFER_PHASE11_ORACLE_SMOKE_POSITIONS: "14"
          NINFER_FLASH_NEXT_CPU_EXPERT_WORKERS: "32"
          NINFER_FLASH_NEXT_CPU_EXPERT_BACKEND: reference
          NINFER_PHASE11_STAGE_ORACLE_ROOT: /oracle/phase11-stage-trace14
          NINFER_PHASE11_STAGE_ORACLE_POSITION: "13"
          NINFER_PHASE11_STAGE_ORACLE_ALL_POSITIONS: "1"
          NINFER_PHASE11_ORACLE_INJECT_ALL_POSITIONS: "1"
          NINFER_PHASE11_ORACLE_INJECT_STAGE: ple_injection
          NINFER_PHASE11_TRACE_POSITIONS: "1"
          NINFER_FLASH_NEXT_FP32_HYPER_STATE: "1"
          NINFER_FLASH_NEXT_FP32_GDN_CONV: "1"
          NINFER_FLASH_NEXT_FP32_GDN_PROJECTION: "1"
          NINFER_FLASH_NEXT_FP32_GDN_READOUT: "1"
          NINFER_FLASH_NEXT_FP32_GDN_GATE: "1"
          NINFER_FLASH_NEXT_FP32_GDN_OUTPUT: "1"
          NINFER_FLASH_NEXT_FP32_GDN_OUTPUT_INPUT: "1"
          NINFER_FLASH_NEXT_FP32_HYPER_INJECT_INPUT: "1"
          NINFER_FLASH_NEXT_FP32_HYPER_INJECT_APPLY: "1"
          NINFER_FLASH_NEXT_FP32_MLP_HYPER_OUTPUT: "1"
          NINFER_FLASH_NEXT_FP32_MLP_HYPER_INPUT: "1"
          NINFER_FLASH_NEXT_FP32_MLP_HYPER_NORMALIZED: "1"
          NINFER_FLASH_NEXT_FP32_MLP_HYPER_LOW_RANK: "1"
          NINFER_FLASH_NEXT_FP32_MLP_HYPER_APPLY: "1"
          NINFER_FLASH_NEXT_FP32_MLP_HYPER_INJECTION: "1"
        run: |
          set -euxo pipefail
          test -r "$NINFER_PHASE11_STAGE_ORACLE_ROOT/pos0013/ple_injection.bin"
          result_dir="${GITHUB_WORKSPACE}/.v100-phase11-results/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$result_dir"
          result_log="$result_dir/ple-injection-all-14.log"
          ctest --test-dir build-v100 -V \
            -R '^ninfer_qwen3_8_flash_next_vertical_slice_real_test$' \
            2>&1 | tee "$result_log" || true
          python3 - "$result_log" <<'PY'
          from pathlib import Path
          import sys
          data = Path(sys.argv[1]).read_text()
          injected = [line for line in data.splitlines()
                      if "phase11.oracle_injection.position=" in line
                      and " stage=ple_injection " in line]
          positions = {int(line.split("phase11.oracle_injection.position=", 1)[1].split()[0])
                       for line in injected}
          if positions != set(range(14)) or len(injected) != 14:
              raise SystemExit(f"Expected 14 verified PLE injections, got {sorted(positions)}")
          required = ("phase11.stage_trace.position=13 stage=L01_attn_block_input",
                      "phase11.stage_trace.position=13 stage=L24_attn_block_input",
                      "phase11.top1_agreement=")
          if any(value not in data for value in required):
              raise SystemExit("PLE replay did not reach the final stage and summary")
          PY

      - name: Measure QSA block and LM-head local error under exact-input injection
        continue-on-error: true
        shell: bash
        env:
          NINFER_WEIGHTS: /models/qwen3-8b-flash-next
          NINFER_FLASH_NEXT_ORACLE_MANIFEST: /oracle/phase11/manifest.json
          NINFER_PHASE11_ORACLE_SMOKE_POSITIONS: "14"
          NINFER_FLASH_NEXT_CPU_EXPERT_WORKERS: "32"
          NINFER_FLASH_NEXT_CPU_EXPERT_BACKEND: reference
          NINFER_PHASE11_STAGE_ORACLE_ROOT: /oracle/phase11-stage-trace14
          NINFER_PHASE11_STAGE_ORACLE_POSITION: "13"
          NINFER_PHASE11_STAGE_ORACLE_ALL_POSITIONS: "1"
          NINFER_PHASE11_ORACLE_INJECT_ALL_POSITIONS: "1"
          NINFER_PHASE11_ORACLE_INJECT_STAGE: final_hidden
          NINFER_PHASE11_ORACLE_INJECT_SECOND_STAGE: L03_attn_block_input
          NINFER_PHASE11_TRACE_POSITIONS: "1"
          NINFER_FLASH_NEXT_FP32_HYPER_STATE: "1"
          NINFER_FLASH_NEXT_FP32_GDN_CONV: "1"
          NINFER_FLASH_NEXT_FP32_GDN_PROJECTION: "1"
          NINFER_FLASH_NEXT_FP32_GDN_READOUT: "1"
          NINFER_FLASH_NEXT_FP32_GDN_GATE: "1"
          NINFER_FLASH_NEXT_FP32_GDN_OUTPUT: "1"
          NINFER_FLASH_NEXT_FP32_GDN_OUTPUT_INPUT: "1"
          NINFER_FLASH_NEXT_FP32_HYPER_INJECT_INPUT: "1"
          NINFER_FLASH_NEXT_FP32_HYPER_INJECT_APPLY: "1"
          NINFER_FLASH_NEXT_FP32_MLP_HYPER_OUTPUT: "1"
          NINFER_FLASH_NEXT_FP32_MLP_HYPER_INPUT: "1"
          NINFER_FLASH_NEXT_FP32_MLP_HYPER_NORMALIZED: "1"
          NINFER_FLASH_NEXT_FP32_MLP_HYPER_LOW_RANK: "1"
          NINFER_FLASH_NEXT_FP32_MLP_HYPER_APPLY: "1"
          NINFER_FLASH_NEXT_FP32_MLP_HYPER_INJECTION: "1"
        run: |
          set -euxo pipefail

          test -r "$NINFER_PHASE11_STAGE_ORACLE_ROOT/pos0013/final_hidden.bin"
          test -r "$NINFER_PHASE11_STAGE_ORACLE_ROOT/pos0013/L03_attn_block_input.bin"
          result_dir="${GITHUB_WORKSPACE}/.v100-phase11-results/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$result_dir"
          result_log="$result_dir/local-error-injection.log"
          ctest --test-dir build-v100 -V \
            -R '^ninfer_qwen3_8_flash_next_vertical_slice_real_test$' \
            2>&1 | tee "$result_log" || true
          python3 - "$result_log" <<'PY'
          from pathlib import Path
          import sys
          data = Path(sys.argv[1]).read_text()
          fh = [line for line in data.splitlines()
                if "phase11.oracle_injection.position=" in line
                and " stage=final_hidden " in line]
          positions = {int(line.split("phase11.oracle_injection.position=", 1)[1].split()[0])
                       for line in fh}
          if positions != set(range(14)) or len(fh) != 14:
              raise SystemExit(
                  f"Expected 14 verified final_hidden injections, got {sorted(positions)}")
          l03 = [line for line in data.splitlines()
                 if "phase11.oracle_injection.position=" in line
                 and " stage=L03_attn_block_input " in line]
          if len(l03) != 1 or "position=13" not in l03[0]:
              raise SystemExit(f"Expected exactly one L03 injection at position 13, got {l03}")
          logits_lines = [line for line in data.splitlines()
                          if "phase11.error_decomposition.position=" in line
                          and " stage=logits " in line]
          if len(logits_lines) != 14:
              raise SystemExit(
                  f"Expected 14 logits decomposition lines, got {len(logits_lines)}")
          required = (
              "phase11.error_decomposition.position=13 stage=L03_qsa_query",
              "phase11.error_decomposition.position=13 stage=L03_qsa_key",
              "phase11.error_decomposition.position=13 stage=L03_qsa_value",
              "phase11.error_decomposition.position=13 stage=L03_attn_block_output",
              "phase11.top1_agreement=",
          )
          if any(value not in data for value in required):
              raise SystemExit("local-error run did not produce the QSA stage lines")
          PY

      - name: Recheck 32-position best-known MLP-injection baseline
        shell: bash
        env:
          NINFER_WEIGHTS: /models/qwen3-8b-flash-next
          NINFER_FLASH_NEXT_ORACLE_MANIFEST: /oracle/phase11/manifest.json
          NINFER_PHASE11_ORACLE_SMOKE_POSITIONS: "32"
          NINFER_PHASE11_TRACE_POSITIONS: "1"
          NINFER_FLASH_NEXT_CPU_EXPERT_WORKERS: "32"
          NINFER_FLASH_NEXT_CPU_EXPERT_BACKEND: reference
          NINFER_FLASH_NEXT_FP32_HYPER_STATE: "1"
          NINFER_FLASH_NEXT_FP32_GDN_CONV: "1"
          NINFER_FLASH_NEXT_FP32_GDN_PROJECTION: "1"
          NINFER_FLASH_NEXT_FP32_GDN_READOUT: "1"
          NINFER_FLASH_NEXT_FP32_GDN_GATE: "1"
          NINFER_FLASH_NEXT_FP32_GDN_OUTPUT: "1"
          NINFER_FLASH_NEXT_FP32_GDN_OUTPUT_INPUT: "1"
          NINFER_FLASH_NEXT_FP32_HYPER_INJECT_INPUT: "1"
          NINFER_FLASH_NEXT_FP32_HYPER_INJECT_APPLY: "1"
          NINFER_FLASH_NEXT_FP32_MLP_HYPER_OUTPUT: "1"
          NINFER_FLASH_NEXT_FP32_MLP_HYPER_INPUT: "1"
          NINFER_FLASH_NEXT_FP32_MLP_HYPER_NORMALIZED: "1"
          NINFER_FLASH_NEXT_FP32_MLP_HYPER_LOW_RANK: "1"
          NINFER_FLASH_NEXT_FP32_MLP_HYPER_APPLY: "1"
          NINFER_FLASH_NEXT_FP32_MLP_HYPER_INJECTION: "1"
        run: |
          set -euxo pipefail
          if curl -s -m 10 http://127.0.0.1:9292/v1/models \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); sys.exit(0 if any(m["id"]=="qwen3.8-27b-omp" and m.get("status",{}).get("value")=="loaded" for m in d["data"]) else 1)'; then
            echo "ERROR: agent model qwen3.8-27b-omp was reloaded during this run; the GPU is contended." >&2
            echo "Re-run the workflow when the agent is idle." >&2
            exit 1
          fi
          test -r /oracle/phase11/manifest.json
          python3 tools/reference/qwen3_8_flash_next/oracle/validate_phase11_oracle.py \
            --corpus /oracle/phase11/token_ids.json \
            --manifest /oracle/phase11/manifest.json \
            --minimum 4096
          result_dir="${GITHUB_WORKSPACE}/.v100-phase11-results/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$result_dir"

          ctest --test-dir build-v100 -V \
            -R '^ninfer_qwen3_8_flash_next_vertical_slice_real_test$' \
            2>&1 | tee "$result_dir/oracle-32-best-known.log" || true

      # A [full-phase11] push opts into the expensive full-oracle qualification.
      - name: Validate full Phase 11 oracle
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.full_phase11) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[full-phase11]')) }}
        shell: bash
        run: |
          set -euxo pipefail

          test -r /oracle/phase11/manifest.json
          test -r /oracle/phase11/token_ids.json
          test -r /oracle/phase11/provenance.json
          python3 tools/reference/qwen3_8_flash_next/oracle/validate_phase11_oracle.py \
            --corpus /oracle/phase11/token_ids.json \
            --manifest /oracle/phase11/manifest.json \
            --minimum 4096

      - name: Run full Phase 11 qualification
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.full_phase11) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[full-phase11]')) }}
        shell: bash
        env:
          NINFER_WEIGHTS: /models/qwen3-8b-flash-next
          NINFER_FLASH_NEXT_ORACLE_MANIFEST: /oracle/phase11/manifest.json
          NINFER_FLASH_NEXT_CPU_EXPERT_WORKERS: "32"
          NINFER_FLASH_NEXT_CPU_EXPERT_BACKEND: reference
          NINFER_PHASE11_TRACE_POSITIONS: "1"
          NINFER_FLASH_NEXT_FP32_HYPER_STATE: "1"
          NINFER_FLASH_NEXT_FP32_GDN_CONV: "1"
          NINFER_FLASH_NEXT_FP32_GDN_PROJECTION: "1"
          NINFER_FLASH_NEXT_FP32_GDN_READOUT: "1"
          NINFER_FLASH_NEXT_FP32_GDN_GATE: "1"
          NINFER_FLASH_NEXT_FP32_GDN_OUTPUT: "1"
          NINFER_FLASH_NEXT_FP32_GDN_OUTPUT_INPUT: "1"
          NINFER_FLASH_NEXT_FP32_HYPER_INJECT_INPUT: "1"
          NINFER_FLASH_NEXT_FP32_HYPER_INJECT_APPLY: "1"
          NINFER_FLASH_NEXT_FP32_MLP_HYPER_OUTPUT: "1"
          NINFER_FLASH_NEXT_FP32_MLP_HYPER_INPUT: "1"
          NINFER_FLASH_NEXT_FP32_MLP_HYPER_NORMALIZED: "1"
          NINFER_FLASH_NEXT_FP32_MLP_HYPER_LOW_RANK: "1"
          NINFER_FLASH_NEXT_FP32_MLP_HYPER_APPLY: "1"
          NINFER_FLASH_NEXT_FP32_MLP_HYPER_INJECTION: "1"
        run: |
          set -euxo pipefail

          result_dir="${GITHUB_WORKSPACE}/.v100-phase11-results/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$result_dir"
          preflight_log="$result_dir/oracle-full-preflight.log"
          {
            echo "llama-swap /v1/models:"
            curl -s -m 10 http://127.0.0.1:9292/v1/models || echo "(llama-swap unreachable)"
            echo
            echo "nvidia-smi:"
            nvidia-smi
          } > "$preflight_log" 2>&1 || true

          # Fail fast if the agent model was reloaded mid-run: any chat request
          # to the agent lazy-loads qwen3.8-27b-omp back onto this V100 and
          # would contend with the ~4.5 h qualification run.
          if curl -s -m 10 http://127.0.0.1:9292/v1/models \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); sys.exit(0 if any(m["id"]=="qwen3.8-27b-omp" and m.get("status",{}).get("value")=="loaded" for m in d["data"]) else 1)'; then
            echo "ERROR: agent model qwen3.8-27b-omp is loaded on the V100; the GPU is contended." >&2
            echo "Re-run the workflow when the agent is idle." >&2
            cat "$preflight_log" >&2
            exit 1
          fi

          ctest \
            --test-dir build-v100 \
            -V \
            -R '^ninfer_qwen3_8_flash_next_vertical_slice_real_test$' \
            2>&1 | tee "$result_dir/oracle-full.log"

      - name: Capture final GPU state
        if: always()
        shell: bash
        run: |
          set +e
          result_dir="${GITHUB_WORKSPACE}/.v100-phase11-results/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$result_dir"
          nvidia-smi | tee "$result_dir/nvidia-smi.txt"
          git rev-parse HEAD | tee "$result_dir/commit.txt"

      - name: Upload Phase 11 results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v100-phase11-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ github.workspace }}/.v100-phase11-results/${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: warn
          retention-days: 14

name: Phase 11 Controlled Router Membership Replay

on:
  push:
    branches:
      - work/precision-matched-reference
    paths:
      - .github/workflows/precision-router-replay-cpu.yml
      - tools/reference/qwen3_8_flash_next/oracle/precision_profile.py
      - tools/reference/qwen3_8_flash_next/oracle/run_precision_reference.py
      - tools/reference/qwen3_8_flash_next/oracle/compare_precision_traces.py

permissions:
  actions: read
  contents: read

concurrency:
  group: phase11-cpu-router-replay-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cpu-reference-14:
    name: CPU-only 14-position reference
    runs-on:
      - self-hosted
      - v100
      - sm70
      - cuda-12-8
      - ninfer-phase11
    timeout-minutes: 360
    env:
      CUDA_VISIBLE_DEVICES: ""
      NINFER_ORACLE_DETERMINISTIC: "1"
      NINFER_ORACLE_THREADS: "16"
      OMP_NUM_THREADS: "16"
      MKL_NUM_THREADS: "16"
      OPENBLAS_NUM_THREADS: "16"
      NUMEXPR_NUM_THREADS: "16"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Download completed V100 prefix trace
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: v100-mlp-raw-layer1-14
          run-id: 36078905618
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: v100-input

      - name: Locate read-only input assets and CPU Python
        shell: bash
        run: |
          set -euo pipefail
          echo 'Mounted data path availability:'
          for root in /models /oracle /srv/ninfer/source /srv/ninfer/oracle \
              /home/runner/ninfer-v100; do
            if [[ -d "$root" ]]; then
              echo "Directory: $root"
              find "$root" -maxdepth 3 -type f \( -name model.safetensors.index.json \
                  -o -name 'shard_*.safetensors' -o -name token_ids.json \) \
                  -print -quit 2>/dev/null || true
            else
              echo "Absent: $root"
            fi
          done
          model_dir="${NINFER_PHASE11_MODEL_DIR:-/srv/ninfer/source/mixed}"
          ple_dir="${NINFER_PHASE11_PLE_DIR:-/srv/ninfer/source/ple/ples_int4}"
          oracle_dir="${NINFER_PHASE11_STAGE_ORACLE_ROOT:-/oracle/phase11-stage-trace14}"
          ids_file="${NINFER_PHASE11_IDS_FILE:-/oracle/phase11/token_ids.json}"
          missing=0
          for path in "$model_dir/model.safetensors.index.json" "$ple_dir" \
              "$oracle_dir/manifest.json" "$ids_file"; do
            if [[ ! -r "$path" ]]; then
              echo "::error::Missing readable CPU reference input: $path"
              missing=1
              continue
            fi
            echo "Readable: $path"
          done
          python_bin="${NINFER_PHASE11_PYTHON:-}"
          if [[ -z "$python_bin" ]]; then
            for candidate in "$GITHUB_WORKSPACE/venv-oracle/bin/python" \
                "$HOME/ninfer-v100/venv-oracle/bin/python" \
                /srv/ninfer/venv-oracle/bin/python python3; do
              if command -v "$candidate" >/dev/null 2>&1 && \
                  "$candidate" -c 'import numpy, torch, transformers, safetensors' >/dev/null 2>&1; then
                python_bin="$candidate"
                break
              fi
            done
          fi
          if (( missing )); then exit 1; fi
          test -s "$GITHUB_WORKSPACE/v100-input/candidate-stage/stages.jsonl"
          {
            echo "PRECISION_PYTHON=$python_bin"
            echo "PRECISION_MODEL_DIR=$model_dir"
            echo "PRECISION_PLE_DIR=$ple_dir"
            echo "PRECISION_ORACLE_DIR=$oracle_dir"
            echo "PRECISION_IDS_FILE=$ids_file"
          } >> "$GITHUB_ENV"

      - name: Prepare CPU Python if needed
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$PRECISION_PYTHON" ]]; then
            echo "CPU Python: $PRECISION_PYTHON"
            exit 0
          fi
          python3 -m venv "$GITHUB_WORKSPACE/precision-venv"
          "$GITHUB_WORKSPACE/precision-venv/bin/pip" install \
            torch --index-url https://download.pytorch.org/whl/cpu
          "$GITHUB_WORKSPACE/precision-venv/bin/pip" install \
            numpy safetensors 'transformers>=5.16,<6'
          echo "PRECISION_PYTHON=$GITHUB_WORKSPACE/precision-venv/bin/python" >> "$GITHUB_ENV"

      - name: Recompute three 14-position prefixes and compare stages
        shell: bash
        run: |
          set -euo pipefail
          "$PRECISION_PYTHON" tests/targets/qwen3_8_flash_next/test_precision_profile.py
          "$PRECISION_PYTHON" tests/targets/qwen3_8_flash_next/test_precision_trace_compare.py
          "$PRECISION_PYTHON" tools/reference/qwen3_8_flash_next/oracle/run_precision_reference.py \
            --model-dir "$PRECISION_MODEL_DIR" \
            --ple-dir "$PRECISION_PLE_DIR" \
            --ids-file "$PRECISION_IDS_FILE" \
            --fp32-oracle "$PRECISION_ORACLE_DIR" \
            --positions 14 \
            --trace-mlp-layer0 \
            --trace-moe-routing-layer0 \
            --replay-router-ids \
            --ablate-mlp-block-input-bf16 \
            --v100-trace "$GITHUB_WORKSPACE/v100-input/candidate-stage" \
            --out-dir "$GITHUB_WORKSPACE/precision-reference-results"

      - name: Summarize controlled routing replay
        if: success()
        run: |
          python3 - <<'PYREPLAY'
          import json
          from pathlib import Path
          report = json.loads(Path('precision-reference-results/precision_report.json').read_text())
          print('Normal CPU oracle KL', report['mean_kl'])
          print('Normal CPU/V100 KL', report['three_way']['cpu_vs_v100_mean_kl'])
          print('V100 oracle KL', report['three_way']['oracle_vs_v100_mean_kl'])
          upgrade = report['mlp_block_input_fp32_ablation']
          print('Hypothetical FP32 MLP input CPU oracle KL',
                upgrade['oracle_mean_kl'], 'top1',
                upgrade['oracle_top1_agreement'], '/', report['positions'],
                'router sets', upgrade['router_set_counts'])
          for source, rows in report['router_replay']['source'].items():
              print(source, 'forced CPU oracle KL', rows['oracle_mean_kl'],
                    'forced CPU/V100 KL', rows['cpu_vs_v100_mean_kl'],
                    'top1 agreement', rows['oracle_top1_agreement'])
              for position in (0, 2, 6, 10, 12, 13):
                  print(source, 'position', position,
                        'oracle KL', rows['per_position_oracle'][position]['kl'],
                        'CPU/V100 KL', rows['per_position_cpu_vs_v100'][position]['kl'])
          PYREPLAY

      - name: Summarize early V100 calibration
        if: success()
        run: |
          python3 - <<'PY'
          import csv
          import json
          from pathlib import Path

          root = Path('precision-reference-results')
          report = json.loads((root / 'precision_report.json').read_text())
          print('Three-way prefix results:', json.dumps(report['three_way'],
                                                   sort_keys=True)[:2500])
          rows = list(csv.DictReader((root / 'comparison/stage_comparison.csv').open()))
          for position in (0, 12, 13):
              for stage in ('L00_attn_block_input', 'L00_mlp_block_input',
                            'L00_moe_router_alpha', 'L00_moe_shared_scale',
                            'L00_mlp_block_output', 'L00_hyper_after_mlp',
                            'L01_attn_block_input',
                            'L02_attn_block_input', 'L02_mlp_block_input', 'logits'):
                  item = next(r for r in rows if int(r['position']) == position
                              and r['stage'] == stage)
                  print('Calibration', position, stage,
                        'cpu-oracle', item['cpu_vs_oracle_nrmse'],
                        'v100-oracle', item['v100_vs_oracle_nrmse'],
                        'cpu-v100', item['v100_vs_cpu_nrmse'])
          PY

      - name: Upload CPU results and mismatch diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cpu-router-replay-14
          path: precision-reference-results
          if-no-files-found: ignore
          retention-days: 14

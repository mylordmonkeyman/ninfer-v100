name: Phase 11 Layer Zero GDN Precision Report

on:
  push:
    branches:
      - work/precision-matched-reference
    paths:
      - .github/workflows/precision-layer0-gdn-report.yml

permissions:
  actions: read
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: cpu-layer0-gdn-reference-14
          run-id: 36214521162
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: cpu
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: v100-layer0-gdn-pos7-14
          run-id: 36214528016
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: gpu
      - name: Compare matched profile inputs and layer-zero master boundaries
        run: |
          python3 - <<'PY' | tee layer0-gdn-report.txt
          import math,struct
          from pathlib import Path
          cpu=Path('cpu/v100-phase11-storage/pos0007')
          gpu=Path('gpu/pos0007')
          stages=('L00_attn_block_input','L00_attn_block_output','L00_hyper_after_attn',
                  'L00_mlp_block_input','L00_mlp_block_output',
                  'L00_hyper_after_mlp','ple_injection',
                  'L01_attn_block_input_fp32','L01_attn_block_input')
          def read(root,name):
              raw=(root/(name+'.bin')).read_bytes()
              assert len(raw)%4==0,(root,name,len(raw))
              return struct.unpack('<'+str(len(raw)//4)+'f',raw)
          for stage in stages:
              a,b=read(cpu,stage),read(gpu,stage)
              assert len(a)==len(b),(stage,len(a),len(b))
              norm=math.fsum(x*x for x in a)
              err=math.fsum((x-y)**2 for x,y in zip(a,b))
              print(stage,'count',len(a),
                    'CPU_V100_NRMSE',format(math.sqrt(err/norm),'.12g'),
                    'exact_values',sum(x==y for x,y in zip(a,b)),
                    'max_abs',format(max(abs(x-y) for x,y in zip(a,b)),'.12g'))
          shared=sorted(set(p.stem for p in cpu.glob('L00_gdn*.bin')) &
                        set(p.stem for p in gpu.glob('L00_gdn*.bin')))
          print('shared_GDN_stages',shared)
          for stage in shared:
              a,b=read(cpu,stage),read(gpu,stage)
              assert len(a)==len(b),(stage,len(a),len(b))
              norm=math.fsum(x*x for x in a)
              err=math.fsum((x-y)**2 for x,y in zip(a,b))
              print(stage,'count',len(a),
                    'CPU_V100_NRMSE',format(math.sqrt(err/norm),'.12g'),
                    'exact_values',sum(x==y for x,y in zip(a,b)),
                    'max_abs',format(max(abs(x-y) for x,y in zip(a,b)),'.12g'))
          left,right=read(cpu,'L00_gdn_projected'),read(gpu,'L00_gdn_projected')
          def bf16(value):
              bits=struct.unpack('<I',struct.pack('<f',value))[0]
              assert bits&0x7f800000!=0x7f800000
              bits=(bits+0x7fff+((bits>>16)&1))&0xffffffff
              return struct.unpack('<f',struct.pack('<I',bits&0xffff0000))[0]
          for title,lo,hi in (('conv_qkv',0,10240),('z',10240,16384)):
              a,b=left[lo:hi],right[lo:hi]
              mismatch=[i+lo for i,(x,y) in enumerate(zip(a,b)) if bf16(x)!=y]
              norm=math.fsum(x*x for x in a)
              err=math.fsum((x-y)**2 for x,y in zip(a,b))
              print('projection_segment',title,'NRMSE',
                    format(math.sqrt(err/norm),'.12g'),
                    'CPU_bf16_vs_gpu_mismatches',len(mismatch),
                    'first_mismatches',mismatch[:12])
              for i in mismatch:
                  print('projection_BF16_threshold',title,i,
                        'cpu_raw',format(left[i],'.12g'),
                        'cpu_rounded',format(bf16(left[i]),'.12g'),
                        'gpu',format(right[i],'.12g'),
                        'raw_minus_gpu',format(left[i]-right[i],'.12g'))
              largest=sorted(range(len(a)),key=lambda i:abs(a[i]-b[i]),reverse=True)[:4]
              for i in largest:
                  print('projection_large_delta',title,lo+i,
                        'cpu_raw',format(a[i],'.10g'),
                        'cpu_rounded',format(bf16(a[i]),'.10g'),
                        'gpu',format(b[i],'.10g'))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: phase11-layer0-gdn-precision-report
          path: layer0-report.txt
          retention-days: 14

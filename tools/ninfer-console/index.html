<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>NInfer Console</title>
<style>
  :root {
    --bg:#0b0d10; --panel:#13171c; --panel-2:#181d24; --line:#242b34;
    --ink:#e6eaf0; --dim:#8a94a3; --faint:#5b6472;
    --accent:#5eb0ff; --good:#4ade80; --warn:#fbbf24; --bad:#f87171;
    --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; margin:0; }
  body {
    background:var(--bg); color:var(--ink);
    font:15px/1.5 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    display:flex; flex-direction:column;
    padding-bottom:env(safe-area-inset-bottom);
  }

  header {
    display:flex; align-items:center; gap:10px; padding:10px 12px;
    background:var(--panel); border-bottom:1px solid var(--line);
    position:sticky; top:0; z-index:20;
  }
  header h1 { font-size:15px; margin:0; font-weight:600; letter-spacing:.2px; flex:1; }
  .dot { width:9px; height:9px; border-radius:50%; background:var(--faint); flex:none; }
  .dot.ok { background:var(--good); box-shadow:0 0 8px #4ade8066; }
  .dot.bad { background:var(--bad); box-shadow:0 0 8px #f8717166; }
  .btn {
    background:var(--panel-2); color:var(--ink); border:1px solid var(--line);
    border-radius:9px; padding:8px 12px; font-size:14px; cursor:pointer; font-family:inherit;
  }
  .btn:active { background:#222a34; }
  .btn.primary { background:var(--accent); color:#04121f; border-color:transparent; font-weight:600; }
  .btn:disabled { opacity:.45; }

  /* ---- settings ---- */
  #settings { background:var(--panel); border-bottom:1px solid var(--line); padding:12px; display:none; }
  #settings.open { display:block; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .full { grid-column:1/-1; }
  label { display:block; font-size:11px; color:var(--dim); text-transform:uppercase;
          letter-spacing:.6px; margin-bottom:4px; }
  input,select {
    width:100%; background:var(--bg); color:var(--ink); border:1px solid var(--line);
    border-radius:8px; padding:9px 10px; font-size:15px; font-family:inherit;
  }
  input[type=password] { font-family:var(--mono); }
  .hint { font-size:12px; color:var(--faint); margin-top:6px; line-height:1.45; }
  .hint b { color:var(--warn); font-weight:600; }

  /* ---- thread ---- */
  #thread { flex:1; overflow-y:auto; padding:14px 12px 4px; -webkit-overflow-scrolling:touch; }
  .msg { margin-bottom:16px; max-width:100%; }
  .who { font-size:11px; color:var(--dim); text-transform:uppercase;
         letter-spacing:.7px; margin-bottom:5px; }
  .bubble {
    background:var(--panel); border:1px solid var(--line); border-radius:12px;
    padding:11px 13px; white-space:pre-wrap; word-wrap:break-word; overflow-wrap:anywhere;
  }
  .msg.user .bubble { background:#16222e; border-color:#22405c; }
  .msg.err .bubble { background:#2a1618; border-color:#5c2a2e; color:#ffc9cb; }

  /* thinking is collapsed by default: it is long, and it is not the answer */
  details.think { margin-top:8px; }
  details.think summary {
    cursor:pointer; font-size:12px; color:var(--dim); padding:5px 0; list-style:none;
  }
  details.think summary::-webkit-details-marker { display:none; }
  details.think summary::before { content:'▸ '; }
  details.think[open] summary::before { content:'▾ '; }
  details.think .body {
    font-size:13px; color:var(--dim); border-left:2px solid var(--line);
    padding:6px 0 6px 10px; margin-top:4px; white-space:pre-wrap;
  }

  /* ---- the point of this tool: per-message engine facts ---- */
  .stats { display:flex; flex-wrap:wrap; gap:5px; margin-top:8px; }
  .stat {
    font:11px/1 var(--mono); background:var(--panel-2); border:1px solid var(--line);
    border-radius:6px; padding:5px 7px; color:var(--dim);
  }
  .stat b { color:var(--ink); font-weight:600; }
  .stat.good { border-color:#2b5c3d; } .stat.good b { color:var(--good); }
  .stat.warn { border-color:#5c4a1e; } .stat.warn b { color:var(--warn); }
  .note { font-size:12px; color:var(--warn); margin-top:7px; }

  /* ---- composer ---- */
  #composer {
    border-top:1px solid var(--line); background:var(--panel); padding:10px 12px;
    display:flex; gap:8px; align-items:flex-end;
  }
  #prompt {
    flex:1; resize:none; max-height:140px; background:var(--bg); color:var(--ink);
    border:1px solid var(--line); border-radius:10px; padding:10px;
    font:15px/1.4 inherit; font-family:inherit;
  }
  #bar {
    display:flex; gap:8px; padding:0 12px 8px; align-items:center;
    background:var(--panel); font-size:12px; color:var(--dim); flex-wrap:wrap;
  }
  #bar .sep { flex:1; }
  .chip {
    font:11px/1 var(--mono); background:var(--panel-2); border:1px solid var(--line);
    border-radius:6px; padding:5px 7px; color:var(--dim);
  }
  .chip b { color:var(--ink); }
  #imgnote { font-size:12px; color:var(--accent); }
</style>
</head>
<body>

<header>
  <span class="dot" id="dot"></span>
  <h1>NInfer Console</h1>
  <button class="btn" id="clear">Clear</button>
  <button class="btn" id="gear">Setup</button>
</header>

<section id="settings">
  <div class="grid">
    <div class="full">
      <label>Engine base URL</label>
      <input id="host" placeholder="http://100.106.150.61:8010/v1" autocapitalize="off"
             autocorrect="off" spellcheck="false" inputmode="url">
    </div>
    <div class="full">
      <label>API key</label>
      <input id="key" type="password" placeholder="bearer token" autocapitalize="off"
             autocorrect="off" spellcheck="false">
    </div>
    <div class="full">
      <label>Model</label>
      <select id="model"><option value="">— connect to load —</option></select>
    </div>
    <div>
      <label>Max tokens</label>
      <input id="maxtok" type="number" min="1" max="131072" value="2000" inputmode="numeric">
    </div>
    <div>
      <label>Reasoning</label>
      <select id="effort">
        <option value="">(server default)</option>
        <option value="none">none</option>
        <option value="low">low</option>
        <option value="medium">medium</option>
        <option value="high">high</option>
        <option value="xhigh">xhigh</option>
      </select>
    </div>
    <div>
      <label>Temperature</label>
      <input id="temp" type="number" step="0.1" min="0" max="2" value="0.7" inputmode="decimal">
    </div>
    <div>
      <label>Stream</label>
      <select id="stream"><option value="1">on</option><option value="0">off</option></select>
    </div>
    <div class="full">
      <button class="btn primary" id="connect" style="width:100%">Connect &amp; load models</button>
    </div>
  </div>
  <p class="hint">
    <b>Keep max tokens ≥1000.</b> Reasoning tokens count against the limit, so a small budget
    returns an <i>empty</i> reply with finish=length — that is the limit, not a broken engine.
    Settings and the thread are stored on this device only.
  </p>
</section>

<div id="thread"></div>

<div id="bar">
  <span class="chip">turns <b id="t-turns">0</b></span>
  <span class="chip">reuse <b id="t-reuse">–</b></span>
  <span class="chip">ttft <b id="t-ttft">–</b></span>
  <span class="chip">decode <b id="t-dec">–</b></span>
  <span class="sep"></span>
  <span id="imgnote"></span>
</div>

<div id="composer">
  <button class="btn" id="attach" title="Attach image">＋</button>
  <input type="file" id="file" accept="image/*" hidden>
  <textarea id="prompt" rows="1" placeholder="Message…"></textarea>
  <button class="btn primary" id="send">Send</button>
</div>

<script>
'use strict';
const $ = id => document.getElementById(id);
const LS = 'ninfer-console-v1';

let cfg = { host:'http://100.106.150.61:8010/v1', key:'', model:'', maxtok:2000,
            effort:'', temp:0.7, stream:'1' };
let history = [];      // OpenAI-shaped messages actually sent
let pendingImage = null;
let busy = false;
const totals = { turns:0, prompt:0, reused:0, ttft:[], dec:[] };

/* ---------- persistence (best-effort; private mode can throw) ---------- */
function save() {
  try {
    localStorage.setItem(LS, JSON.stringify({ cfg, history, totals }));
  } catch (e) { /* not worth interrupting a test session over */ }
}
function load() {
  try {
    const raw = localStorage.getItem(LS);
    if (!raw) return;
    const d = JSON.parse(raw);
    if (d.cfg) cfg = Object.assign(cfg, d.cfg);
    if (Array.isArray(d.history)) history = d.history;
    if (d.totals) Object.assign(totals, d.totals);
  } catch (e) { /* corrupt or unavailable: start clean */ }
}

function applyCfgToForm() {
  $('host').value = cfg.host; $('key').value = cfg.key;
  $('maxtok').value = cfg.maxtok; $('effort').value = cfg.effort;
  $('temp').value = cfg.temp; $('stream').value = cfg.stream;
  if (cfg.model) {
    $('model').innerHTML = `<option value="${cfg.model}">${cfg.model}</option>`;
    $('model').value = cfg.model;
  }
}
function readForm() {
  cfg.host = $('host').value.trim().replace(/\/+$/,'');
  cfg.key = $('key').value.trim();
  cfg.model = $('model').value;
  cfg.maxtok = Math.max(1, parseInt($('maxtok').value,10) || 2000);
  cfg.effort = $('effort').value;
  cfg.temp = parseFloat($('temp').value);
  cfg.stream = $('stream').value;
  save();
}
const headers = () => {
  const h = { 'Content-Type':'application/json' };
  if (cfg.key) h['Authorization'] = 'Bearer ' + cfg.key;
  return h;
};

/* ---------- rendering ---------- */
function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
}
function addMsg(role, text, cls) {
  const wrap = el('div', 'msg ' + (cls || role));
  wrap.appendChild(el('div','who', role));
  const b = el('div','bubble', text || '');
  wrap.appendChild(b);
  $('thread').appendChild(wrap);
  scroll();
  return { wrap, bubble:b };
}
function scroll() { $('thread').scrollTop = $('thread').scrollHeight; }

// The reason this exists rather than a generic chat app: what the engine did.
function addStats(wrap, s) {
  const box = el('div','stats');
  const add = (label, val, cls) => {
    const n = el('span','stat ' + (cls||''));
    n.innerHTML = label + ' <b>' + val + '</b>';
    box.appendChild(n);
  };
  if (s.prompt != null) add('prompt', s.prompt);
  if (s.reused != null) {
    const pct = s.prompt ? Math.round(100*s.reused/s.prompt) : 0;
    // Reuse is the difference between a fast follow-up turn and re-reading the
    // whole conversation, so it gets colour.
    add('reused', s.reused + ' (' + pct + '%)', pct > 0 ? 'good' : '');
  }
  if (s.gen != null) add('gen', s.gen);
  if (s.think) add('thinking', s.think);
  if (s.ttft != null) add('ttft', s.ttft.toFixed(2) + 's');
  if (s.dec != null && s.dec > 0) add('decode', s.dec.toFixed(0) + ' tok/s');
  if (s.finish) add('finish', s.finish, s.finish === 'length' ? 'warn' : '');
  wrap.appendChild(box);
  if (s.finish === 'length' && !s.hadText) {
    wrap.appendChild(el('div','note',
      'Empty reply: the token budget was spent before any answer was emitted. '
      + 'Raise Max tokens.'));
  }
  scroll();
}
function updateTotals(s) {
  totals.turns++;
  if (s.prompt) totals.prompt += s.prompt;
  if (s.reused) totals.reused += s.reused;
  if (s.ttft != null) totals.ttft.push(s.ttft);
  if (s.dec > 0) totals.dec.push(s.dec);
  const med = a => a.length ? [...a].sort((x,y)=>x-y)[Math.floor(a.length/2)] : null;
  $('t-turns').textContent = totals.turns;
  $('t-reuse').textContent = totals.prompt
    ? Math.round(100*totals.reused/totals.prompt) + '%' : '–';
  const mt = med(totals.ttft), md = med(totals.dec);
  $('t-ttft').textContent = mt != null ? mt.toFixed(2)+'s' : '–';
  $('t-dec').textContent  = md != null ? md.toFixed(0)+' tok/s' : '–';
  save();
}

/* ---------- connectivity ---------- */
async function connect() {
  readForm();
  $('dot').className = 'dot';
  try {
    const r = await fetch(cfg.host + '/models', { headers: headers() });
    if (!r.ok) {
      $('dot').className = 'dot bad';
      addMsg('system', explainStatus(r.status, cfg.host + '/models'), 'err');
      return;
    }
    const j = await r.json();
    const ids = (j.data || []).map(m => m.id);
    $('model').innerHTML = ids.map(i => `<option value="${i}">${i}</option>`).join('');
    if (ids.length) { $('model').value = cfg.model && ids.includes(cfg.model) ? cfg.model : ids[0]; }
    readForm();
    $('dot').className = 'dot ok';
    addMsg('system', 'Connected. Model: ' + cfg.model);
  } catch (e) {
    $('dot').className = 'dot bad';
    addMsg('system',
      'Could not reach ' + cfg.host + '\n\n' + e.message +
      '\n\nCheck the address, that you are on the tailnet, and that the page and the engine ' +
      'use the same scheme (both http).', 'err');
  }
}
function explainStatus(code, url) {
  if (code === 401) return 'HTTP 401 at ' + url + '\n\nThe API key was rejected or missing.';
  if (code === 404) return 'HTTP 404 at ' + url +
    '\n\nWrong path. Some clients append /v1 themselves — try the base URL with and without it.';
  return 'HTTP ' + code + ' at ' + url;
}

/* ---------- send ---------- */
async function send() {
  if (busy) return;
  const text = $('prompt').value.trim();
  if (!text && !pendingImage) return;
  readForm();
  if (!cfg.model) { addMsg('system','Pick a model first (Setup → Connect).','err'); return; }

  let content = text;
  if (pendingImage) {
    content = [{ type:'text', text: text || 'What is in this image?' },
               { type:'image_url', image_url:{ url: pendingImage } }];
  }
  history.push({ role:'user', content });
  addMsg('user', text + (pendingImage ? '\n[image attached]' : ''));
  $('prompt').value = ''; $('prompt').style.height = 'auto';
  pendingImage = null; $('imgnote').textContent = '';

  busy = true; $('send').disabled = true;
  const out = addMsg('assistant', '');
  const streaming = cfg.stream === '1';
  const body = {
    model: cfg.model, messages: history,
    max_tokens: cfg.maxtok, temperature: cfg.temp, stream: streaming
  };
  if (cfg.effort) body.reasoning_effort = cfg.effort;

  const t0 = performance.now();
  let ttft = null, answer = '', thinking = '', usage = null, finish = null;

  try {
    const r = await fetch(cfg.host + '/chat/completions',
                          { method:'POST', headers: headers(), body: JSON.stringify(body) });
    if (!r.ok) {
      let detail = '';
      try { detail = '\n\n' + (await r.text()).slice(0, 400); } catch (e) {}
      out.wrap.className = 'msg err';
      out.bubble.textContent = explainStatus(r.status, cfg.host + '/chat/completions') + detail;
      history.pop();
      return;
    }

    if (!streaming) {
      const j = await r.json();
      const c = j.choices[0];
      answer = c.message.content || '';
      thinking = c.message.reasoning_content || c.message.reasoning || '';
      usage = j.usage; finish = c.finish_reason;
      ttft = (performance.now() - t0) / 1000;
      out.bubble.textContent = answer;
    } else {
      const reader = r.body.getReader();
      const dec = new TextDecoder();
      let buf = '';
      for (;;) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += dec.decode(value, { stream:true });
        const lines = buf.split('\n');
        buf = lines.pop();
        for (const line of lines) {
          const s = line.trim();
          if (!s.startsWith('data:')) continue;
          const d = s.slice(5).trim();
          if (d === '[DONE]') continue;
          let o; try { o = JSON.parse(d); } catch (e) { continue; }
          if (o.usage) usage = o.usage;
          for (const ch of (o.choices || [])) {
            if (ch.finish_reason) finish = ch.finish_reason;
            const delta = ch.delta || {};
            const piece = delta.content || '';
            const think = delta.reasoning_content || delta.reasoning || '';
            if (think) thinking += think;
            if (piece) {
              if (ttft === null) ttft = (performance.now() - t0) / 1000;
              answer += piece;
              out.bubble.textContent = answer;
              scroll();
            }
          }
        }
      }
    }

    const total = (performance.now() - t0) / 1000;
    if (!answer) out.bubble.textContent = thinking ? '(no answer — see thinking below)' : '(empty)';
    if (thinking) {
      const d = el('details','think');
      d.appendChild(el('summary','', 'thinking (' + thinking.length + ' chars)'));
      d.appendChild(el('div','body', thinking));
      out.wrap.appendChild(d);
    }
    const gen = usage ? usage.completion_tokens : null;
    const decRate = (gen && ttft != null && total > ttft) ? (gen - 1) / (total - ttft) : null;
    const stats = {
      prompt: usage ? usage.prompt_tokens : null,
      reused: usage && usage.prompt_tokens_details
              ? (usage.prompt_tokens_details.cached_tokens || 0) : null,
      gen, ttft, dec: decRate, finish,
      think: usage && usage.completion_tokens_details
             ? usage.completion_tokens_details.reasoning_tokens : null,
      hadText: !!answer
    };
    addStats(out.wrap, stats);
    updateTotals(stats);
    history.push({ role:'assistant', content: answer });
    save();
  } catch (e) {
    out.wrap.className = 'msg err';
    out.bubble.textContent = 'Request failed: ' + e.message;
    history.pop();
  } finally {
    busy = false; $('send').disabled = false;
  }
}

/* ---------- wiring ---------- */
$('gear').onclick = () => $('settings').classList.toggle('open');
$('connect').onclick = connect;
$('send').onclick = send;
$('clear').onclick = () => {
  history = []; $('thread').innerHTML = '';
  totals.turns = 0; totals.prompt = 0; totals.reused = 0; totals.ttft = []; totals.dec = [];
  $('t-turns').textContent = '0'; $('t-reuse').textContent = '–';
  $('t-ttft').textContent = '–'; $('t-dec').textContent = '–';
  save();
};
$('attach').onclick = () => $('file').click();
$('file').onchange = e => {
  const f = e.target.files[0];
  if (!f) return;
  const rd = new FileReader();
  rd.onload = () => { pendingImage = rd.result; $('imgnote').textContent = 'image attached'; };
  rd.readAsDataURL(f);
};
$('prompt').addEventListener('input', function () {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 140) + 'px';
});
// Enter sends on a physical keyboard; on a phone the Send button is the path.
$('prompt').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey && !/Android|iPhone/i.test(navigator.userAgent)) {
    e.preventDefault(); send();
  }
});

load();
applyCfgToForm();
// Replay a stored thread so a reload does not lose the conversation under test.
for (const m of history) {
  const t = typeof m.content === 'string'
    ? m.content
    : (m.content.find(p => p.type === 'text') || {}).text + ' [image]';
  addMsg(m.role, t);
}
if (!cfg.key) $('settings').classList.add('open');
else connect();
</script>
</body>
</html>
